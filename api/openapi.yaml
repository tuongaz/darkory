openapi: 3.0.3
info:
  title: Darkory
  version: 0.1.0
  description: |
    The canonical contract between Members and a Darkory Install. The CLI, the MCP server and the
    web app use only these operations; humans and agents call the same ones.

    **Versioning.** Paths are versioned (`/v1`). Changes within `/v1` are additive only.

    **Credentials.** Every operation except `getHealth`, `showLoginLink`, `redeemLoginLink` and
    `requestEmailSignIn` needs a credential: a bearer token (`dk_…`) together with a
    `Darkory-Session` header naming the Session making the request, or the browser cookie
    `darkory_session`. A bearer request without `Darkory-Session` is refused with
    `session_required`. A request with no credential is never a Member. A browser Session ends
    after a time unused and after a time in all (Install settings); a deactivated Member's
    credentials are all refused.

    **References.** Path parameters and request-body references take an id, or the natural key
    where one exists: a Task or Feature display key (`WEB-42`), a Team key (`WEB`), a Skill name
    (`qa`), a Member name. Tokens, Evidence and Sessions are referenced by id only. Responses
    always carry ids, plus display keys where they exist.

    **Retries.** Every write accepts an `Idempotency-Key` header. The first response is kept for
    24 hours per Member and key; a retry with the same key returns it unchanged. Reusing a key
    for a different request is refused with `idempotency_key_reused`.

    **Errors.** Every failure has the `Error` body. `code` is stable and meant for programs;
    `message` is for people. Each operation lists the codes it can return beyond the common ones
    (`invalid`, `unauthenticated`, `session_required`, `forbidden`, `not_found`, `internal`).

    **Values.** Times are RFC 3339 in UTC. Durations are whole seconds. Fields with no value are
    omitted.
  license:
    name: Apache-2.0
    url: https://www.apache.org/licenses/LICENSE-2.0
servers:
  - url: http://127.0.0.1:7357
    description: A Local Install on its default listen address
security:
  - bearerAuth: []
    sessionHeader: []
  - cookieAuth: []
tags:
  - name: install
  - name: sign-in
  - name: tokens
  - name: members
  - name: teams
  - name: skills
  - name: statuses
  - name: workspaces
  - name: features
  - name: tasks
  - name: evidence
  - name: activity
  - name: runner

paths:
  # ---------------------------------------------------------------- install
  /v1/health:
    get:
      operationId: getHealth
      tags: [install]
      summary: Report that the Install is up, how Members sign in, and whether a newer release exists
      security: []
      responses:
        "200":
          description: The Install is up.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Health"}
        default: {$ref: "#/components/responses/Error"}

  /v1/me:
    get:
      operationId: getMe
      tags: [install]
      summary: The calling Member, their Teams and Skills, and the Session making the request
      responses:
        "200":
          description: The caller.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Me"}
        default: {$ref: "#/components/responses/Error"}

  # ---------------------------------------------------------------- sign-in and Sessions
  /v1/members/{member}/login-links:
    post:
      operationId: issueLoginLink
      tags: [sign-in]
      summary: Issue a one-time login link for a named Member (admin)
      description: |
        The link signs a browser in as the Member once, then stops working. `darkory login
        <member>` and the web app both call this. Errors: `forbidden` (not an admin).
      parameters:
        - {$ref: "#/components/parameters/MemberRef"}
        - {$ref: "#/components/parameters/IdempotencyKey"}
      responses:
        "201":
          description: The link.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/LoginLink"}
        default: {$ref: "#/components/responses/Error"}

  /v1/login-links/{code}:
    get:
      operationId: showLoginLink
      tags: [sign-in]
      summary: Show a login link's sign-in page
      description: |
        An HTML page naming the Member and Organisation the link signs in as, with a button that
        posts to the same address (`redeemLoginLink`). Opening the link signs nobody in, so a
        page elsewhere cannot sign a browser in by sending it here, and a mail scanner fetching
        the link does not use it up. An unknown, used or expired link gets an HTML page saying
        so, with status 404.
      security: []
      parameters:
        - {$ref: "#/components/parameters/LoginCode"}
      responses:
        "200":
          description: The sign-in page.
          content:
            text/html:
              schema: {type: string}
        "404":
          description: The link is unknown, used or expired.
          content:
            text/html:
              schema: {type: string}
        default: {$ref: "#/components/responses/Error"}
    post:
      operationId: redeemLoginLink
      tags: [sign-in]
      summary: Redeem a login link
      description: |
        Starts a browser Session for the link's Member, sets the `darkory_session` cookie and
        redirects to `/`. The request must come from the Install's own sign-in page, as a cookie
        write must: `Sec-Fetch-Site`, when sent, says `same-origin` or `none`, and the `Origin`
        (or `Referer`) is the Install's. A cookie the browser already held has its Session
        closed. The `Idempotency-Key` is accepted and not stored: a link works once. Errors:
        `not_found` (unknown, used or expired link), `forbidden` (not sent from the Install's
        own page).
      security: []
      parameters:
        - {$ref: "#/components/parameters/LoginCode"}
        - {$ref: "#/components/parameters/IdempotencyKey"}
      responses:
        "303":
          description: Signed in; redirects to the web app.
          headers:
            Location:
              schema: {type: string}
            Set-Cookie:
              description: The `darkory_session` cookie.
              schema: {type: string}
        default: {$ref: "#/components/responses/Error"}

  /v1/sign-in/email:
    post:
      operationId: requestEmailSignIn
      tags: [sign-in]
      summary: Ask for a login link by email
      description: |
        When the Install has email sign-in set up and the address belongs to a Member, a login
        link is emailed. The reply is the same either way, so it reveals nothing about Members.
      security: []
      parameters:
        - {$ref: "#/components/parameters/IdempotencyKey"}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/EmailSignInBody"}
      responses:
        "202":
          description: Accepted.
        default: {$ref: "#/components/responses/Error"}

  /v1/logout:
    post:
      operationId: logout
      tags: [sign-in]
      summary: End the browser Session and clear its cookie
      description: Closes the cookie's Session, which ends the Claims bound to it.
      parameters:
        - {$ref: "#/components/parameters/IdempotencyKey"}
      responses:
        "204":
          description: Signed out.
          headers:
            Set-Cookie:
              schema: {type: string}
        default: {$ref: "#/components/responses/Error"}

  /v1/sessions/{session}/close:
    post:
      operationId: closeSession
      tags: [sign-in]
      summary: Close one of the caller's Sessions
      description: |
        Ends every Claim bound to the Session (those made with a heartbeat timeout) and records it
        in Activity. `{session}` is the id the running copy chose; an admin may close another
        Member's Session by naming `member`.
      parameters:
        - {$ref: "#/components/parameters/SessionID"}
        - name: member
          in: query
          description: The Member whose Session to close (admin). Defaults to the caller.
          schema: {type: string}
        - {$ref: "#/components/parameters/IdempotencyKey"}
      responses:
        "200":
          description: The closed Session.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ClosedSession"}
        default: {$ref: "#/components/responses/Error"}

  /v1/members/{member}/sessions:
    get:
      operationId: listSessions
      tags: [sign-in]
      summary: List a Member's open Sessions
      description: |
        The Member's Sessions that are open and, for a browser Session, not yet expired, most
        recently seen first. A Member may list their own; an admin anyone's. Close one with
        `closeSession` and `member`, or close them all with `deactivateMember`.
      parameters:
        - {$ref: "#/components/parameters/MemberRef"}
        - {$ref: "#/components/parameters/Limit"}
        - {$ref: "#/components/parameters/Cursor"}
      responses:
        "200":
          description: The Sessions.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/SessionList"}
        default: {$ref: "#/components/responses/Error"}

  # ---------------------------------------------------------------- tokens
  /v1/members/{member}/tokens:
    post:
      operationId: issueToken
      tags: [tokens]
      summary: Issue a token for a Member (admin)
      description: |
        The secret is returned once and stored only as a hash. Errors: `forbidden`, `conflict`
        (the Member already has a live token with this name).
      parameters:
        - {$ref: "#/components/parameters/MemberRef"}
        - {$ref: "#/components/parameters/IdempotencyKey"}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/IssueTokenBody"}
      responses:
        "201":
          description: The token and its secret.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/IssuedToken"}
        default: {$ref: "#/components/responses/Error"}
    get:
      operationId: listTokens
      tags: [tokens]
      summary: List a Member's tokens
      description: A Member may list their own tokens; an admin may list anyone's. Secrets are never shown.
      parameters:
        - {$ref: "#/components/parameters/MemberRef"}
      responses:
        "200":
          description: The tokens, newest first.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/TokenList"}
        default: {$ref: "#/components/responses/Error"}

  /v1/tokens/{token}/revoke:
    post:
      operationId: revokeToken
      tags: [tokens]
      summary: Revoke a token
      description: |
        Ends every Claim bound to a Session of the token, and records it in Activity. A Member may
        revoke their own tokens; an admin may revoke anyone's.
      parameters:
        - {$ref: "#/components/parameters/TokenID"}
        - {$ref: "#/components/parameters/IdempotencyKey"}
      responses:
        "200":
          description: The revoked token.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Token"}
        default: {$ref: "#/components/responses/Error"}

  # ---------------------------------------------------------------- members
  /v1/members:
    post:
      operationId: createMember
      tags: [members]
      summary: Create a Member (admin)
      description: "Errors: `forbidden`, `conflict` (name or email taken)."
      parameters:
        - {$ref: "#/components/parameters/IdempotencyKey"}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/CreateMemberBody"}
      responses:
        "201":
          description: The new Member.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Member"}
        default: {$ref: "#/components/responses/Error"}
    get:
      operationId: listMembers
      tags: [members]
      summary: List the Organisation's Members
      parameters:
        - name: team
          in: query
          description: Only Members of this Team.
          schema: {type: string}
        - name: kind
          in: query
          schema: {$ref: "#/components/schemas/MemberKind"}
      responses:
        "200":
          description: The Members, by name.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/MemberList"}
        default: {$ref: "#/components/responses/Error"}

  /v1/members/{member}:
    get:
      operationId: getMember
      tags: [members]
      summary: Get a Member with their Teams, Skills and Reporting line
      parameters:
        - {$ref: "#/components/parameters/MemberRef"}
      responses:
        "200":
          description: The Member.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/MemberDetail"}
        default: {$ref: "#/components/responses/Error"}
    patch:
      operationId: updateMember
      tags: [members]
      summary: Change a Member's name, email or admin mark (admin)
      description: "Errors: `forbidden`, `conflict` (name or email taken; removing the last admin)."
      parameters:
        - {$ref: "#/components/parameters/MemberRef"}
        - {$ref: "#/components/parameters/IdempotencyKey"}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/UpdateMemberBody"}
      responses:
        "200":
          description: The Member.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Member"}
        default: {$ref: "#/components/responses/Error"}

  /v1/members/{member}/agent:
    patch:
      operationId: setAgentSettings
      tags: [members]
      summary: Set how the Runner starts an agent Member's sessions (admin)
      description: |
        Changes the fields given and keeps the others. An agent with no settings yet starts from
        the defaults: `command` `claude` with the Claude Code arguments shown on `AgentSettings`,
        model `claude-sonnet-5-5`, no `env`, `unattended` true, `paused` false. The Runner starts
        sessions only for agents that have settings and are not paused. Records
        `member.agent_changed` with the fields that changed. Errors: `forbidden` (not an admin),
        `invalid` (a human Member, or a value out of bounds).
      parameters:
        - {$ref: "#/components/parameters/MemberRef"}
        - {$ref: "#/components/parameters/IdempotencyKey"}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/SetAgentSettingsBody"}
      responses:
        "200":
          description: The Member with its settings.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Member"}
        default: {$ref: "#/components/responses/Error"}
    delete:
      operationId: clearAgentSettings
      tags: [members]
      summary: Clear an agent Member's settings, so the Runner starts no session for it (admin)
      description: |
        The agent goes back to working through its own tokens only, as an agent the Runner does
        not start; a session running carries on until its Claim ends. Records
        `member.agent_changed` with `cleared: true` in its payload; an agent with no settings
        changes nothing. Errors: `forbidden` (not an admin), `invalid` (a human Member).
      parameters:
        - {$ref: "#/components/parameters/MemberRef"}
        - {$ref: "#/components/parameters/IdempotencyKey"}
      responses:
        "200":
          description: The Member, without settings.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Member"}
        default: {$ref: "#/components/responses/Error"}

  /v1/members/{member}/deactivate:
    post:
      operationId: deactivateMember
      tags: [members]
      summary: Deactivate a Member (admin)
      description: |
        Revokes the Member's tokens, closes their Sessions and ends every Claim they hold, bound
        to a Session or to the Member, recording each in Activity. From then on every credential
        of theirs is refused, and no token or login link can be issued for them. The Member stays
        in the record, with everything they did. Deactivating a deactivated Member changes
        nothing. Errors: `forbidden` (not an admin, or deactivating yourself), `conflict` (the
        last active admin).
      parameters:
        - {$ref: "#/components/parameters/MemberRef"}
        - {$ref: "#/components/parameters/IdempotencyKey"}
      responses:
        "200":
          description: The deactivated Member.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Member"}
        default: {$ref: "#/components/responses/Error"}

  /v1/members/{member}/reactivate:
    post:
      operationId: reactivateMember
      tags: [members]
      summary: Reactivate a deactivated Member (admin)
      description: |
        The Member may sign in and be issued tokens again. Tokens revoked and Sessions closed by
        the deactivation stay so. Reactivating an active Member changes nothing. Errors:
        `forbidden` (not an admin).
      parameters:
        - {$ref: "#/components/parameters/MemberRef"}
        - {$ref: "#/components/parameters/IdempotencyKey"}
      responses:
        "200":
          description: The Member.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Member"}
        default: {$ref: "#/components/responses/Error"}

  /v1/members/{member}/skills/{skill}:
    put:
      operationId: grantSkill
      tags: [members]
      summary: Grant a Skill to a Member (admin)
      parameters:
        - {$ref: "#/components/parameters/MemberRef"}
        - {$ref: "#/components/parameters/SkillRef"}
        - {$ref: "#/components/parameters/IdempotencyKey"}
      responses:
        "204":
          description: The Member has the Skill.
        default: {$ref: "#/components/responses/Error"}
    delete:
      operationId: revokeSkill
      tags: [members]
      summary: Take a Skill away from a Member (admin)
      description: Claims the Member holds under the Skill are not ended.
      parameters:
        - {$ref: "#/components/parameters/MemberRef"}
        - {$ref: "#/components/parameters/SkillRef"}
        - {$ref: "#/components/parameters/IdempotencyKey"}
      responses:
        "204":
          description: The Member no longer has the Skill.
        default: {$ref: "#/components/responses/Error"}

  /v1/members/{member}/manager:
    put:
      operationId: setManager
      tags: [members]
      summary: Set the Member who directs this Member (admin)
      description: "Errors: `forbidden`, `cycle` (the Reporting line would loop)."
      parameters:
        - {$ref: "#/components/parameters/MemberRef"}
        - {$ref: "#/components/parameters/IdempotencyKey"}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/SetManagerBody"}
      responses:
        "204":
          description: The Reporting line is set.
        default: {$ref: "#/components/responses/Error"}
    delete:
      operationId: clearManager
      tags: [members]
      summary: Remove the Member's Reporting line (admin)
      parameters:
        - {$ref: "#/components/parameters/MemberRef"}
        - {$ref: "#/components/parameters/IdempotencyKey"}
      responses:
        "204":
          description: The Member reports to no one.
        default: {$ref: "#/components/responses/Error"}

  # ---------------------------------------------------------------- teams
  /v1/teams:
    post:
      operationId: createTeam
      tags: [teams]
      summary: Create a Team (admin)
      description: "Errors: `forbidden`, `conflict` (key or name taken)."
      parameters:
        - {$ref: "#/components/parameters/IdempotencyKey"}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/CreateTeamBody"}
      responses:
        "201":
          description: The new Team.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Team"}
        default: {$ref: "#/components/responses/Error"}
    get:
      operationId: listTeams
      tags: [teams]
      summary: List the Organisation's Teams
      responses:
        "200":
          description: The Teams, by name.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/TeamList"}
        default: {$ref: "#/components/responses/Error"}

  /v1/teams/{team}:
    get:
      operationId: getTeam
      tags: [teams]
      summary: Get a Team and its Members
      parameters:
        - {$ref: "#/components/parameters/TeamRef"}
      responses:
        "200":
          description: The Team.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/TeamDetail"}
        default: {$ref: "#/components/responses/Error"}
    patch:
      operationId: updateTeam
      tags: [teams]
      summary: Change a Team's name, default Workspace or Ship-when-done default (admin)
      description: |
        Changes the fields given and keeps the others; `default_workspace` set to `""` clears it.
        A Task filed naming no Workspace takes the Team's default; a Feature filed without
        `ship_when_done` takes the Team's. Records `team.changed` with the fields that changed.
        Errors: `forbidden` (not an admin), `conflict` (name taken), `not_found` (no such
        Workspace).
      parameters:
        - {$ref: "#/components/parameters/TeamRef"}
        - {$ref: "#/components/parameters/IdempotencyKey"}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/UpdateTeamBody"}
      responses:
        "200":
          description: The Team.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Team"}
        default: {$ref: "#/components/responses/Error"}

  /v1/teams/{team}/members/{member}:
    put:
      operationId: addTeamMember
      tags: [teams]
      summary: Add a Member to a Team (admin)
      parameters:
        - {$ref: "#/components/parameters/TeamRef"}
        - {$ref: "#/components/parameters/MemberRef"}
        - {$ref: "#/components/parameters/IdempotencyKey"}
      responses:
        "204":
          description: The Member is in the Team.
        default: {$ref: "#/components/responses/Error"}
    delete:
      operationId: removeTeamMember
      tags: [teams]
      summary: Remove a Member from a Team (admin)
      description: Claims the Member holds on the Team's Tasks are not ended.
      parameters:
        - {$ref: "#/components/parameters/TeamRef"}
        - {$ref: "#/components/parameters/MemberRef"}
        - {$ref: "#/components/parameters/IdempotencyKey"}
      responses:
        "204":
          description: The Member is not in the Team.
        default: {$ref: "#/components/responses/Error"}

  # ---------------------------------------------------------------- skills
  /v1/skills:
    post:
      operationId: createSkill
      tags: [skills]
      summary: Create a generic or company Skill (admin)
      description: |
        Publishes version 1 with the given body. A company Skill names the generic Skill it builds
        on. Errors: `forbidden`, `conflict` (name taken).
      parameters:
        - {$ref: "#/components/parameters/IdempotencyKey"}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/CreateSkillBody"}
      responses:
        "201":
          description: The new Skill and its first version.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/SkillDetail"}
        default: {$ref: "#/components/responses/Error"}
    get:
      operationId: listSkills
      tags: [skills]
      summary: List the Organisation's Skills
      parameters:
        - name: kind
          in: query
          schema: {$ref: "#/components/schemas/SkillKind"}
      responses:
        "200":
          description: The Skills, by name.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/SkillList"}
        default: {$ref: "#/components/responses/Error"}

  /v1/skills/{skill}:
    get:
      operationId: getSkill
      tags: [skills]
      summary: Get a Skill with its current version
      parameters:
        - {$ref: "#/components/parameters/SkillRef"}
      responses:
        "200":
          description: The Skill.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/SkillDetail"}
        default: {$ref: "#/components/responses/Error"}

  /v1/skills/{skill}/versions:
    get:
      operationId: listSkillVersions
      tags: [skills]
      summary: List a Skill's published versions
      parameters:
        - {$ref: "#/components/parameters/SkillRef"}
      responses:
        "200":
          description: The versions, newest first.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/SkillVersionList"}
        default: {$ref: "#/components/responses/Error"}

  /v1/skill-proposals/{proposal}:
    get:
      operationId: getSkillProposal
      tags: [skills]
      summary: Get a proposed Skill version
      parameters:
        - {$ref: "#/components/parameters/ProposalID"}
      responses:
        "200":
          description: The proposal.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/SkillProposal"}
        default: {$ref: "#/components/responses/Error"}

  # ---------------------------------------------------------------- statuses
  /v1/statuses:
    get:
      operationId: listStatuses
      tags: [statuses]
      summary: List the Organisation's Statuses, in their order
      responses:
        "200":
          description: The Statuses.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/StatusList"}
        default: {$ref: "#/components/responses/Error"}
    put:
      operationId: setStatuses
      tags: [statuses]
      summary: Replace the Organisation's list of Statuses (admin)
      description: |
        Takes the whole list in its new order: a Status already in it carries its `id` and may be
        renamed, moved or given another kind; a new one has no `id`; one left out is deleted.
        Names are unique, ignoring case. The list must keep at least one Status of each kind
        `todo`, `in_progress`, `done` and `dropped`, or it is refused with `invalid`. A deleted
        Status that Tasks are in needs `moves` to say where they go, or it is refused with
        `status_in_use`; so is a Status that Tasks are in changing between an open kind
        (`backlog`, `todo`, `in_progress`), `done` and `dropped`, since a Task in a `done` or
        `dropped` Status has ended. Records `statuses.changed`. Errors: `forbidden` (not an
        admin), `invalid`, `status_in_use`.
      parameters:
        - {$ref: "#/components/parameters/IdempotencyKey"}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/SetStatusesBody"}
      responses:
        "200":
          description: The Statuses, in their new order.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/StatusList"}
        default: {$ref: "#/components/responses/Error"}

  # ---------------------------------------------------------------- workspaces
  /v1/workspaces:
    post:
      operationId: createWorkspace
      tags: [workspaces]
      summary: Add a Workspace to the Install (admin)
      description: |
        A Workspace is a place a session works in; a `git` Workspace is a repository on the
        machine that runs the Install, at `path`. Records `workspace.added`. Errors: `forbidden`
        (not an admin), `conflict` (name taken, ignoring case), `invalid`.
      parameters:
        - {$ref: "#/components/parameters/IdempotencyKey"}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/CreateWorkspaceBody"}
      responses:
        "201":
          description: The new Workspace.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Workspace"}
        default: {$ref: "#/components/responses/Error"}
    get:
      operationId: listWorkspaces
      tags: [workspaces]
      summary: List the Install's Workspaces
      responses:
        "200":
          description: The Workspaces, by name.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/WorkspaceList"}
        default: {$ref: "#/components/responses/Error"}

  /v1/workspaces/{workspace}:
    patch:
      operationId: updateWorkspace
      tags: [workspaces]
      summary: Change a Workspace's name, path, mode or default branch (admin)
      description: |
        Changes the fields given and keeps the others; the kind never changes. Records
        `workspace.changed` with the fields that changed. Errors: `forbidden` (not an admin),
        `conflict` (name taken), `invalid`.
      parameters:
        - {$ref: "#/components/parameters/WorkspaceRef"}
        - {$ref: "#/components/parameters/IdempotencyKey"}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/UpdateWorkspaceBody"}
      responses:
        "200":
          description: The Workspace.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Workspace"}
        default: {$ref: "#/components/responses/Error"}
    delete:
      operationId: removeWorkspace
      tags: [workspaces]
      summary: Remove a Workspace (admin)
      description: |
        Refused with `conflict` while any Task, open or ended, names it: the record keeps where
        its work was done. A Team whose default it was has no default afterwards. Records
        `workspace.removed`. Errors: `forbidden` (not an admin), `conflict`.
      parameters:
        - {$ref: "#/components/parameters/WorkspaceRef"}
        - {$ref: "#/components/parameters/IdempotencyKey"}
      responses:
        "204":
          description: The Workspace is gone.
        default: {$ref: "#/components/responses/Error"}

  # ---------------------------------------------------------------- features
  /v1/features:
    post:
      operationId: fileFeature
      tags: [features]
      summary: File a Feature
      description: |
        Files the Feature at the bottom of its Team's Rank, and files its Break down Task needing
        the `breakdown` Skill in the same write. The owner defaults to the caller. A Feature filed
        by a Retrospective names it in `from_retrospective`.

        A **quick** Feature (`quick: true`) is small enough for one branch: instead of the Break
        down it files its one work Task, with the Feature's title and description, needing
        `skill`, in `workspaces` (default the Team's default Workspace). It always ships when
        done, and it has no Retrospective when it ships or drops. `ship_when_done` defaults to the
        Team's (`updateTeam`); a Feature with it ships itself, in the same write, when its last
        open Task is completed (not dropped). Errors: `forbidden` (not in the Team), `invalid` (a
        quick Feature without `skill`, with `from_retrospective` or with `ship_when_done: false`;
        `skill` or `workspaces` on a Feature that is not quick; a quick Feature in a Team with no
        default Workspace and none named).
      parameters:
        - {$ref: "#/components/parameters/IdempotencyKey"}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/FileFeatureBody"}
      responses:
        "201":
          description: The Feature with its Break down Task, or a quick Feature with its one Task.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/FeatureDetail"}
        default: {$ref: "#/components/responses/Error"}
    get:
      operationId: listFeatures
      tags: [features]
      summary: List Features
      description: Ordered by Team, then Rank.
      parameters:
        - name: team
          in: query
          schema: {type: string}
        - name: state
          in: query
          schema: {$ref: "#/components/schemas/FeatureState"}
        - name: owner
          in: query
          schema: {type: string}
        - {$ref: "#/components/parameters/Limit"}
        - {$ref: "#/components/parameters/Cursor"}
      responses:
        "200":
          description: The Features.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/FeatureList"}
        default: {$ref: "#/components/responses/Error"}

  /v1/features/{feature}:
    get:
      operationId: getFeature
      tags: [features]
      summary: Get a Feature with its Tasks and Evidence
      parameters:
        - {$ref: "#/components/parameters/FeatureRef"}
      responses:
        "200":
          description: The Feature.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/FeatureDetail"}
        default: {$ref: "#/components/responses/Error"}

  /v1/features/{feature}/rank:
    post:
      operationId: rankFeature
      tags: [features]
      summary: Move a Feature to a position in its Team's Rank
      description: |
        Position 1 is first. A position past the end moves the Feature last. Ended Features keep
        their places and count as positions. By a Member of the Feature's Team or its owner.
        Errors: `forbidden`.
      parameters:
        - {$ref: "#/components/parameters/FeatureRef"}
        - {$ref: "#/components/parameters/IdempotencyKey"}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/RankFeatureBody"}
      responses:
        "200":
          description: The Feature in its new place.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Feature"}
        default: {$ref: "#/components/responses/Error"}

  /v1/features/{feature}/ship:
    post:
      operationId: shipFeature
      tags: [features]
      summary: Ship a Feature (Feature owner)
      description: |
        Needs every Task of the Feature to have ended. Files the Retrospective Task ("Retrospective:
        <title>", needing `retro`) in the same write, unless the Feature is quick. A Feature with
        `ship_when_done` ships without this call when its last open Task is completed. Errors:
        `forbidden` (not the owner), `tasks_open`, `ended`.
      parameters:
        - {$ref: "#/components/parameters/FeatureRef"}
        - {$ref: "#/components/parameters/IdempotencyKey"}
      responses:
        "200":
          description: The shipped Feature with its Retrospective Task.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/FeatureDetail"}
        default: {$ref: "#/components/responses/Error"}

  /v1/features/{feature}/drop:
    post:
      operationId: dropFeature
      tags: [features]
      summary: Drop a Feature (Feature owner)
      description: |
        Drops its open Tasks, ends their Claims, and files the Retrospective Task ("Retrospective:
        <title>", needing `retro`) in the same write, unless the Feature is quick. Errors:
        `forbidden` (not the owner), `ended`.
      parameters:
        - {$ref: "#/components/parameters/FeatureRef"}
        - {$ref: "#/components/parameters/IdempotencyKey"}
      responses:
        "200":
          description: The dropped Feature with its Retrospective Task.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/FeatureDetail"}
        default: {$ref: "#/components/responses/Error"}

  /v1/features/{feature}/owner:
    post:
      operationId: passFeatureOwnership
      tags: [features]
      summary: Pass a Feature's ownership to another Member
      description: |
        By the owner, or by a Member on the owner's Reporting line. Errors: `forbidden`.
      parameters:
        - {$ref: "#/components/parameters/FeatureRef"}
        - {$ref: "#/components/parameters/IdempotencyKey"}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/PassFeatureOwnershipBody"}
      responses:
        "200":
          description: The Feature under its new owner.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Feature"}
        default: {$ref: "#/components/responses/Error"}

  /v1/features/{feature}/observations:
    get:
      operationId: listFeatureObservations
      tags: [features]
      summary: List the Observations recorded on a Feature's Tasks
      parameters:
        - {$ref: "#/components/parameters/FeatureRef"}
        - name: reviewed
          in: query
          description: |
            Omitted or false: only the Observations no Retrospective has reviewed yet. True: every
            Observation, reviewed or not.
          schema: {type: boolean}
      responses:
        "200":
          description: The Observations, oldest first.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ObservationList"}
        default: {$ref: "#/components/responses/Error"}

  /v1/features/{feature}/evidence:
    post:
      operationId: attachFeatureEvidence
      tags: [evidence]
      summary: Attach Evidence to a Feature
      description: |
        The request body is the file itself, sent with its own `Content-Type` and a
        `Content-Length`; the Install's limit is 100 MiB unless set otherwise. By the Feature's
        owner or a Member of its Team. Errors: `forbidden`, `too_large`.
      parameters:
        - {$ref: "#/components/parameters/FeatureRef"}
        - {$ref: "#/components/parameters/EvidenceFilename"}
        - {$ref: "#/components/parameters/IdempotencyKey"}
      requestBody:
        required: true
        content:
          "*/*":
            schema: {type: string, format: binary}
      responses:
        "201":
          description: The Evidence record.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Evidence"}
        default: {$ref: "#/components/responses/Error"}

  # ---------------------------------------------------------------- tasks
  /v1/tasks:
    post:
      operationId: fileTask
      tags: [tasks]
      summary: File a Task
      description: |
        A Task needs a Skill or is aimed at a Member by name, not both. Naming `blocks` files a
        question or Escalation: the new Task joins the Feature of the Task it blocks (which must
        then be the `feature` given, or `feature` may be left out) and blocks it in the same write,
        even when that Feature has ended; the asker keeps their Claim. Blocking a Task needs its
        Claim when it is held, else its Feature's ownership or membership of its Team. The Task
        starts in `status`, or else the first `todo` Status. It names `workspaces`, or else its
        Feature's Team's default Workspace, or none when the Team has no default. Errors:
        `not_found` (no such Workspace), `ended` (the Feature has
        ended and the Task blocks nothing, or the blocked Task has ended), `not_holder`,
        `forbidden`, `cycle`, `use_complete` and `use_drop` (`status` is of kind `done` or
        `dropped`).
      parameters:
        - {$ref: "#/components/parameters/IdempotencyKey"}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/FileTaskBody"}
      responses:
        "201":
          description: The new Task.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/TaskDetail"}
        default: {$ref: "#/components/responses/Error"}
    get:
      operationId: listTasks
      tags: [tasks]
      summary: List Tasks
      description: Ordered by Feature Rank, then by how long each Task has waited.
      parameters:
        - name: feature
          in: query
          schema: {type: string}
        - name: team
          in: query
          schema: {type: string}
        - name: state
          in: query
          schema: {$ref: "#/components/schemas/TaskState"}
        - name: skill
          in: query
          description: Only Tasks that need this Skill now.
          schema: {type: string}
        - name: aimed_at
          in: query
          description: Only Tasks aimed at this Member.
          schema: {type: string}
        - name: holder
          in: query
          description: Only Tasks this Member holds a live Claim on.
          schema: {type: string}
        - name: status
          in: query
          description: Only Tasks in this Status, by id or name.
          schema: {type: string}
        - {$ref: "#/components/parameters/Limit"}
        - {$ref: "#/components/parameters/Cursor"}
      responses:
        "200":
          description: The Tasks.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/TaskList"}
        default: {$ref: "#/components/responses/Error"}

  /v1/tasks/takeable:
    get:
      operationId: listTakeableTasks
      tags: [tasks]
      summary: List the Tasks the caller can take now, in the order `next` would offer them
      parameters:
        - {$ref: "#/components/parameters/Limit"}
      responses:
        "200":
          description: The takeable Tasks.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/TaskList"}
        default: {$ref: "#/components/responses/Error"}

  /v1/tasks/next:
    post:
      operationId: nextTask
      tags: [tasks]
      summary: Wait for a takeable Task and claim it
      description: |
        Claims the first Task takeable by the caller, in Rank order across the caller's Teams
        (a tie goes to the Task that has waited longest; within a Feature, Tasks that block
        another come first). When none is takeable, holds the request open for up to
        `wait_seconds` and claims one as soon as it becomes takeable; replies 204 when the wait
        ends with nothing claimed. The Claim takes `heartbeat_timeout_seconds`, or else the
        token's default. A Member may have a limited number of `next` calls waiting at once
        (an Install setting, 16 by default); one more is refused with `too_many_requests`.
      parameters:
        - {$ref: "#/components/parameters/IdempotencyKey"}
      requestBody:
        content:
          application/json:
            schema: {$ref: "#/components/schemas/NextTaskBody"}
      responses:
        "200":
          description: The claimed Task.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/TaskDetail"}
        "204":
          description: Nothing became takeable before the wait ended.
        default: {$ref: "#/components/responses/Error"}

  /v1/tasks/{task}:
    get:
      operationId: getTask
      tags: [tasks]
      summary: Get a Task with its Claims, Notes, Evidence, blockers and Observations
      parameters:
        - {$ref: "#/components/parameters/TaskRef"}
      responses:
        "200":
          description: The Task.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/TaskDetail"}
        default: {$ref: "#/components/responses/Error"}

  /v1/tasks/{task}/claim:
    post:
      operationId: claimTask
      tags: [tasks]
      summary: Claim a Task
      description: |
        One conditional write: it succeeds only when the Task is takeable by the caller. The
        Claim takes `heartbeat_timeout_seconds`, or else the token's default; with a timeout it is
        bound to the calling Session, without one to the Member. A Task in a `todo` Status moves
        to the first `in_progress` one. Errors: `already_claimed` (someone holds it; stop rather
        than retry), `not_takeable`.
      parameters:
        - {$ref: "#/components/parameters/TaskRef"}
        - {$ref: "#/components/parameters/IdempotencyKey"}
      requestBody:
        content:
          application/json:
            schema: {$ref: "#/components/schemas/ClaimTaskBody"}
      responses:
        "200":
          description: The claimed Task.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/TaskDetail"}
        default: {$ref: "#/components/responses/Error"}

  /v1/tasks/{task}/heartbeat:
    post:
      operationId: heartbeat
      tags: [tasks]
      summary: Tell Darkory the caller is still working a Task
      description: |
        Extends a Claim that carries a heartbeat timeout. A Heartbeat that arrives after the
        timeout is refused and the reply says `lapsed`; the Member may claim again if the Task is
        still takeable. Writes no Activity. Repeating a Heartbeat is harmless, so its
        `Idempotency-Key` is accepted but not stored: a retry reports the Claim as it is now.
        Errors: `not_holder` (the caller never held this Claim).
      parameters:
        - {$ref: "#/components/parameters/TaskRef"}
        - {$ref: "#/components/parameters/IdempotencyKey"}
      responses:
        "200":
          description: What became of the caller's Claim.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/HeartbeatReply"}
        default: {$ref: "#/components/responses/Error"}

  /v1/tasks/{task}/release:
    post:
      operationId: releaseTask
      tags: [tasks]
      summary: Give up the caller's Claim, leaving the Task needing the same Skill
      description: "A Task in an `in_progress` Status moves to the first `todo` one. Errors: `not_holder`."
      parameters:
        - {$ref: "#/components/parameters/TaskRef"}
        - {$ref: "#/components/parameters/IdempotencyKey"}
      requestBody:
        content:
          application/json:
            schema: {$ref: "#/components/schemas/ReleaseTaskBody"}
      responses:
        "200":
          description: The Task.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Task"}
        default: {$ref: "#/components/responses/Error"}

  /v1/tasks/{task}/handover:
    post:
      operationId: handoverTask
      tags: [tasks]
      summary: End the caller's Claim and set the Skill the Task needs next
      description: |
        The Task then waits for a Member with that Skill, from the moment of the Handover; it is
        no longer aimed at a Member. A Member who has held the Task under one Skill can take it
        again only under that Skill. The Status stays as it is unless `status` names another.
        Errors: `not_holder`, `use_complete` and `use_drop` (`status` is of kind `done` or
        `dropped`).
      parameters:
        - {$ref: "#/components/parameters/TaskRef"}
        - {$ref: "#/components/parameters/IdempotencyKey"}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/HandoverTaskBody"}
      responses:
        "200":
          description: The Task.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Task"}
        default: {$ref: "#/components/responses/Error"}

  /v1/tasks/{task}/complete:
    post:
      operationId: completeTask
      tags: [tasks]
      summary: Complete a Task the caller holds
      description: |
        Ends the Task done, in the first `done` Status. Completing a Task that needs
        `skill-review` and carries a pending proposal publishes it as the Skill's next version;
        completing a Retrospective marks its Feature's unreviewed Observations reviewed by it.
        Completing the last open Task of an open Feature with `ship_when_done` ships the Feature
        in the same write (`feature.shipped` with `ship_when_done: true` in its payload), filing
        its Retrospective unless it is quick. Errors: `not_holder`, `proposal_stale`
        (the version the proposal was written against is no longer current; nothing changes, and
        the Task is handed back to `retro`), `forbidden` (the caller wrote the proposal).
      parameters:
        - {$ref: "#/components/parameters/TaskRef"}
        - {$ref: "#/components/parameters/IdempotencyKey"}
      requestBody:
        content:
          application/json:
            schema: {$ref: "#/components/schemas/CompleteTaskBody"}
      responses:
        "200":
          description: The Task.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Task"}
        default: {$ref: "#/components/responses/Error"}

  /v1/tasks/{task}/drop:
    post:
      operationId: dropTask
      tags: [tasks]
      summary: Drop a Task (Feature owner)
      description: "Ends the Task dropped, in the first `dropped` Status, and ends any Claim on it. Errors: `forbidden` (not the owner), `ended`."
      parameters:
        - {$ref: "#/components/parameters/TaskRef"}
        - {$ref: "#/components/parameters/IdempotencyKey"}
      requestBody:
        content:
          application/json:
            schema: {$ref: "#/components/schemas/DropTaskBody"}
      responses:
        "200":
          description: The Task.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Task"}
        default: {$ref: "#/components/responses/Error"}

  /v1/tasks/{task}/take-back:
    post:
      operationId: takeBackTask
      tags: [tasks]
      summary: End another Member's Claim on a Task
      description: |
        By a Member on the holder's Reporting line, or by the Feature owner. The Task becomes
        takeable again; in an `in_progress` Status it moves to the first `todo` one. Errors:
        `forbidden`, `not_holder` (nobody holds it).
      parameters:
        - {$ref: "#/components/parameters/TaskRef"}
        - {$ref: "#/components/parameters/IdempotencyKey"}
      requestBody:
        content:
          application/json:
            schema: {$ref: "#/components/schemas/TakeBackTaskBody"}
      responses:
        "200":
          description: The Task.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Task"}
        default: {$ref: "#/components/responses/Error"}

  /v1/tasks/{task}/status:
    post:
      operationId: setTaskStatus
      tags: [tasks]
      summary: Move a Task to another Status
      description: |
        By any Member of the Feature's Team, the Feature's owner, or the Member holding the Task
        (who may be from another Team, as a reviewer or the Member a question is aimed at is),
        whether or not someone holds it: the Status is where the Task is in its workflow, and the
        Claim stays as it is. Only an open kind (`backlog`, `todo`, `in_progress`) can be named; a
        Task reaches `done` and `dropped` by being completed or dropped. Naming the Status the
        Task is in changes nothing. Records `task.status_set`. Errors: `forbidden` (none of
        those), `ended` (the Task has ended), `use_complete` (a `done` Status), `use_drop` (a
        `dropped` Status).
      parameters:
        - {$ref: "#/components/parameters/TaskRef"}
        - {$ref: "#/components/parameters/IdempotencyKey"}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/SetTaskStatusBody"}
      responses:
        "200":
          description: The Task in its new Status.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Task"}
        default: {$ref: "#/components/responses/Error"}

  /v1/tasks/{task}/notes:
    post:
      operationId: addNote
      tags: [tasks]
      summary: Add a Note to a Task's running log
      description: |
        On a held Task, by the Member holding it, the Note recording the Skill of their Claim. On
        a Task nobody holds, open or ended, by its Feature's owner or a Member of its Feature's
        Team, the Note recording no Skill: such as the Runner noting a merge on a review it has
        just seen completed. Errors: `not_holder` (another Member holds the Task), `forbidden`.
      parameters:
        - {$ref: "#/components/parameters/TaskRef"}
        - {$ref: "#/components/parameters/IdempotencyKey"}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/AddNoteBody"}
      responses:
        "201":
          description: The Note.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Note"}
        default: {$ref: "#/components/responses/Error"}

  /v1/tasks/{task}/observations:
    post:
      operationId: observe
      tags: [tasks]
      summary: Record an Observation on a Task
      description: |
        By the Member holding the Task; the Observation records the Skill they hold it under.
        Errors: `not_holder`.
      parameters:
        - {$ref: "#/components/parameters/TaskRef"}
        - {$ref: "#/components/parameters/IdempotencyKey"}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/ObserveBody"}
      responses:
        "201":
          description: The Observation.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Observation"}
        default: {$ref: "#/components/responses/Error"}

  /v1/tasks/{task}/blockers/{blocker}:
    put:
      operationId: addBlocker
      tags: [tasks]
      summary: Let one Task block another
      description: |
        `{blocker}` blocks `{task}`: `{task}` is not takeable until `{blocker}` has ended. The two
        may be in different Features. Needs `{task}`'s Claim when it is held, else its Feature's
        ownership or membership of its Team. Errors: `forbidden`, `not_holder`, `ended`, `cycle`
        (`{task}` already blocks `{blocker}`, directly or through other Tasks).
      parameters:
        - {$ref: "#/components/parameters/TaskRef"}
        - {$ref: "#/components/parameters/BlockerRef"}
        - {$ref: "#/components/parameters/IdempotencyKey"}
      responses:
        "204":
          description: The Task is blocked by the blocker.
        default: {$ref: "#/components/responses/Error"}
    delete:
      operationId: removeBlocker
      tags: [tasks]
      summary: Stop one Task blocking another
      description: "Needs the same authority as adding the blocker. An open question on an ended Feature must keep blocking an open Task, so removing its last such edge is refused with `ended`: complete or drop the question instead. Errors: `forbidden`, `not_holder`, `ended`."
      parameters:
        - {$ref: "#/components/parameters/TaskRef"}
        - {$ref: "#/components/parameters/BlockerRef"}
        - {$ref: "#/components/parameters/IdempotencyKey"}
      responses:
        "204":
          description: The Task is no longer blocked by the blocker.
        default: {$ref: "#/components/responses/Error"}

  /v1/tasks/{task}/skill-proposals:
    post:
      operationId: proposeSkillVersion
      tags: [skills]
      summary: Propose a new version of a company Skill from the Task the caller holds
      description: |
        Written against `based_on_version`, which must be the current version, for a company
        Skill, on a Retrospective the caller holds. The caller then hands the Task over to
        `skill-review`. A Task carries one pending proposal; a new one supersedes it. Errors:
        `not_holder`, `forbidden` (not a Retrospective), `proposal_stale`, `invalid` (not a
        company Skill).
      parameters:
        - {$ref: "#/components/parameters/TaskRef"}
        - {$ref: "#/components/parameters/IdempotencyKey"}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/ProposeSkillVersionBody"}
      responses:
        "201":
          description: The proposal.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/SkillProposal"}
        default: {$ref: "#/components/responses/Error"}

  /v1/tasks/{task}/evidence:
    post:
      operationId: attachTaskEvidence
      tags: [evidence]
      summary: Attach Evidence to a Task
      description: |
        The request body is the file itself, sent with its own `Content-Type` and a
        `Content-Length`; the Install's limit is 100 MiB unless set otherwise. Needs the Task's
        Claim while it is held, else its Feature's ownership or membership of its Team. Errors:
        `not_holder`, `forbidden`, `too_large`.
      parameters:
        - {$ref: "#/components/parameters/TaskRef"}
        - {$ref: "#/components/parameters/EvidenceFilename"}
        - {$ref: "#/components/parameters/IdempotencyKey"}
      requestBody:
        required: true
        content:
          "*/*":
            schema: {type: string, format: binary}
      responses:
        "201":
          description: The Evidence record.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Evidence"}
        default: {$ref: "#/components/responses/Error"}

  # ---------------------------------------------------------------- evidence
  /v1/evidence/{evidence}:
    get:
      operationId: getEvidence
      tags: [evidence]
      summary: Get an Evidence record
      parameters:
        - {$ref: "#/components/parameters/EvidenceID"}
      responses:
        "200":
          description: The Evidence record.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Evidence"}
        default: {$ref: "#/components/responses/Error"}

  /v1/evidence/{evidence}/content:
    get:
      operationId: downloadEvidence
      tags: [evidence]
      summary: Download an Evidence file
      description: |
        Served with the content type it was attached with, always as an attachment and with
        `X-Content-Type-Options: nosniff`, so a browser never renders an uploaded page.
      parameters:
        - {$ref: "#/components/parameters/EvidenceID"}
      responses:
        "200":
          description: The file.
          headers:
            Content-Disposition:
              description: "`attachment`, with the file's name."
              schema: {type: string}
            X-Content-Type-Options:
              schema: {type: string, enum: [nosniff]}
          content:
            "*/*":
              schema: {type: string, format: binary}
        default: {$ref: "#/components/responses/Error"}

  # ---------------------------------------------------------------- activity
  /v1/activity:
    get:
      operationId: listActivity
      tags: [activity]
      summary: Read Activity after, or before, a sequence number
      description: |
        Activity is numbered per Organisation in commit order. Pass the `last_seq` of one page as
        `after` to read the next. To read backwards, pass `before`: the page holds the `limit`
        entries numbered just below it, still in sequence order, and its `first_seq` is the
        `before` of the page before it. A `before` past the newest entry (such as
        9007199254740991) reads the latest page. `member`, `kind` and `team` keep only the
        matching entries; the page is then the `limit` matching entries after `after` or just
        below `before`, and its `first_seq` and `last_seq` are theirs.
      parameters:
        - name: after
          in: query
          description: Return entries with a sequence number greater than this. Defaults to 0.
          schema: {type: integer, format: int64, minimum: 0}
        - name: before
          in: query
          description: Return the entries with a sequence number below this, closest first.
          schema: {type: integer, format: int64, minimum: 1}
        - name: member
          in: query
          description: |
            Only entries this Member (id or name) acted in, or that ended a Claim they held: a
            lapse, a take-back, a drop, a revoked token, a closed Session or a deactivation.
          schema: {type: string}
        - name: kind
          in: query
          description: Only entries of these kinds; repeat it for several.
          style: form
          explode: true
          schema:
            type: array
            items: {$ref: "#/components/schemas/ActivityKind"}
        - name: team
          in: query
          description: Only entries about a Feature of this Team (id or key), or about a Task of one.
          schema: {type: string}
        - {$ref: "#/components/parameters/Limit"}
      responses:
        "200":
          description: The entries, in sequence order.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ActivityPage"}
        default: {$ref: "#/components/responses/Error"}

  /v1/activity/stream:
    get:
      operationId: streamActivity
      tags: [activity]
      summary: Stream Activity as Server-Sent Events
      description: |
        Each entry is one event: `id` is its sequence number, `event` is `activity` and `data` is
        the `Activity` as JSON. A reconnecting client sends `Last-Event-ID` (or `after`, for
        clients that cannot set headers) and receives every entry after it; `0` sends the whole
        history. With neither, the stream starts from now: it sends only entries written after
        it opened. It opens with the comment `: connected` and sends `: keep-alive` while idle;
        clients skip comments. A Member may have a limited number of streams open at once (an Install
        setting, 16 by default); one more is refused with `too_many_requests`.
      parameters:
        - name: Last-Event-ID
          in: header
          schema: {type: integer, format: int64, minimum: 0}
        - name: after
          in: query
          description: Used when `Last-Event-ID` is absent.
          schema: {type: integer, format: int64, minimum: 0}
      responses:
        "200":
          description: The event stream.
          content:
            text/event-stream:
              schema: {type: string}
        default: {$ref: "#/components/responses/Error"}

  # ---------------------------------------------------------------- runner
  /v1/runner/sessions:
    get:
      operationId: listRunnerSessions
      tags: [runner]
      summary: List the agent sessions the Runner is running now
      description: |
        A read model of the Runner beside this server, not part of the record: what it runs now,
        one session per Task it holds a Claim on for an agent. With no Runner attached to this
        server (as with `serve --agents=off`) it answers `runner: false` and no sessions, not an
        error, so a page can poll it.
      responses:
        "200":
          description: The sessions, oldest first.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/RunnerSessionList"}
        default: {$ref: "#/components/responses/Error"}

  /v1/runner/sessions/{task}/nudge:
    post:
      operationId: nudgeRunnerSession
      tags: [runner]
      summary: Nudge the agent in a Task's session to end the Task (admin)
      description: |
        Types the Runner's nudge into the session: complete the Task, hand it over, or file a
        question. Errors: `forbidden` (not an admin), `no_runner`, `not_found` (no session on the
        Task).
      parameters:
        - {$ref: "#/components/parameters/TaskRef"}
        - {$ref: "#/components/parameters/IdempotencyKey"}
      responses:
        "204":
          description: The nudge was sent.
        default: {$ref: "#/components/responses/Error"}

  /v1/runner/sessions/{task}/stop:
    post:
      operationId: stopRunnerSession
      tags: [runner]
      summary: Stop a Task's session (admin)
      description: |
        Ends the agent's session and releases its Claim with a Note, as when a session ends
        without a decision; the session's log is attached as Evidence. Errors: `forbidden` (not an
        admin), `no_runner`, `not_found` (no session on the Task).
      parameters:
        - {$ref: "#/components/parameters/TaskRef"}
        - {$ref: "#/components/parameters/IdempotencyKey"}
      responses:
        "204":
          description: The session is stopping.
        default: {$ref: "#/components/responses/Error"}

  /v1/runner/sessions/{task}/terminal:
    get:
      operationId: runnerTerminal
      tags: [runner]
      summary: Watch or join a Task's session through a terminal (WebSocket)
      description: |
        Upgrades to a WebSocket bridged to the session's terminal (`tmux attach`). Binary
        messages carry the terminal's bytes both ways; a text message `{"cols": n, "rows": n}`
        resizes the client's view. Admins may type unless they ask for `readonly`; every other
        Member only watches, and what they send is ignored. Authenticated as every operation is,
        by a bearer token with its Session or by the browser cookie; a browser's upgrade must
        come from this Install's own origin. The Runner adds a Note on the Task when someone
        joins. Errors, before the upgrade: `no_runner`, `not_found` (no session on the Task),
        `conflict` (the session runs without tmux and cannot be joined), `forbidden` (another
        origin).
      parameters:
        - {$ref: "#/components/parameters/TaskRef"}
        - name: readonly
          in: query
          description: Watch without typing, even as an admin.
          schema: {type: boolean}
      responses:
        "101":
          description: Switched to the WebSocket protocol; the terminal follows.
        default: {$ref: "#/components/responses/Error"}

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: A Member token, `dk_…`. Sent together with `Darkory-Session`.
    sessionHeader:
      type: apiKey
      in: header
      name: Darkory-Session
      description: The id the running copy chose for its Session. Required with a bearer token.
    cookieAuth:
      type: apiKey
      in: cookie
      name: darkory_session
      description: The browser Session, set by redeeming a login link.

  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      description: |
        A key unique to this write. A retry with the same key returns the first response. It is 1
        to 255 printable ASCII characters, without spaces; any other is refused with `invalid`.
      schema: {type: string, minLength: 1, maxLength: 255, pattern: "^[!-~]+$"}
    MemberRef:
      name: member
      in: path
      required: true
      description: Member id or name.
      schema: {type: string}
    TeamRef:
      name: team
      in: path
      required: true
      description: Team id or key, such as `WEB`.
      schema: {type: string}
    SkillRef:
      name: skill
      in: path
      required: true
      description: Skill id or name.
      schema: {type: string}
    FeatureRef:
      name: feature
      in: path
      required: true
      description: Feature id or display key, such as `WEB-1`.
      schema: {type: string}
    TaskRef:
      name: task
      in: path
      required: true
      description: Task id or display key, such as `WEB-42`.
      schema: {type: string}
    BlockerRef:
      name: blocker
      in: path
      required: true
      description: Id or display key of the blocking Task.
      schema: {type: string}
    TokenID:
      name: token
      in: path
      required: true
      schema: {type: string}
    WorkspaceRef:
      name: workspace
      in: path
      required: true
      description: Workspace id or name.
      schema: {type: string}
    EvidenceID:
      name: evidence
      in: path
      required: true
      schema: {type: string}
    ProposalID:
      name: proposal
      in: path
      required: true
      schema: {type: string}
    SessionID:
      name: session
      in: path
      required: true
      description: The id the running copy chose for its Session.
      schema: {type: string}
    LoginCode:
      name: code
      in: path
      required: true
      schema: {type: string}
    EvidenceFilename:
      name: filename
      in: query
      required: true
      description: The file's name, as it should be shown and downloaded.
      schema: {type: string, minLength: 1, maxLength: 255}
    Limit:
      name: limit
      in: query
      description: At most this many items. Defaults to 100.
      schema: {type: integer, minimum: 1, maximum: 500}
    Cursor:
      name: cursor
      in: query
      description: The `next_cursor` of the previous page.
      schema: {type: string}

  responses:
    Error:
      description: The request failed.
      content:
        application/json:
          schema: {$ref: "#/components/schemas/Error"}

  schemas:
    # ------------------------------------------------------------ errors
    Error:
      type: object
      required: [code, message]
      properties:
        code: {$ref: "#/components/schemas/ErrorCode"}
        message:
          type: string
          description: For people; may change between releases.
        details:
          type: object
          additionalProperties: true
          description: Extra facts about the failure, by code.
    ErrorCode:
      type: string
      description: |
        Stable reason for a failure, with its HTTP status:
        `invalid` 400 · `unauthenticated` 401 · `session_required` 401 · `forbidden` 403 ·
        `not_found` 404 · `conflict` 409 · `already_claimed` 409 · `not_takeable` 409 ·
        `not_holder` 409 · `ended` 409 · `tasks_open` 409 · `cycle` 409 · `proposal_stale` 409 ·
        `status_in_use` 409 · `use_complete` 409 · `use_drop` 409 · `no_runner` 409 ·
        `too_large` 413 · `idempotency_key_reused` 422 · `too_many_requests` 429 · `internal` 500 ·
        `not_implemented` 501.
      enum:
        - invalid
        - unauthenticated
        - session_required
        - forbidden
        - not_found
        - conflict
        - already_claimed
        - not_takeable
        - not_holder
        - ended
        - tasks_open
        - cycle
        - proposal_stale
        - status_in_use
        - use_complete
        - use_drop
        - no_runner
        - too_large
        - idempotency_key_reused
        - too_many_requests
        - internal
        - not_implemented

    # ------------------------------------------------------------ install
    Health:
      type: object
      required: [status, version, sign_in_modes]
      properties:
        status:
          type: string
          enum: [ok]
        version:
          type: string
          description: The server's release version.
        sign_in_modes:
          type: array
          description: How humans sign in to this Install.
          items: {$ref: "#/components/schemas/SignInMode"}
        update_available:
          type: boolean
          description: |
            True when a newer release than `version` exists. Absent when the server has not
            checked: a development build, or checks turned off with DARKORY_NO_UPDATE_CHECK.
        latest_version:
          type: string
          description: The newest release the server knows of. Absent when it has not checked.
    SignInMode:
      type: string
      description: |
        `printed_link`: one-time login links, printed by `darkory serve` and issued by admins.
        `email_link`: login links emailed on request. More modes may be added within `/v1`.
      enum: [printed_link, email_link]
      x-enum-varnames: [SignInPrintedLink, SignInEmailLink]
    Organisation:
      type: object
      required: [id, name, created_at]
      properties:
        id: {type: string}
        name: {type: string}
        created_at: {type: string, format: date-time}
    Me:
      type: object
      required: [organisation, member, teams, skills, session]
      properties:
        organisation: {$ref: "#/components/schemas/Organisation"}
        member: {$ref: "#/components/schemas/Member"}
        teams:
          type: array
          items: {$ref: "#/components/schemas/Team"}
        skills:
          type: array
          items: {$ref: "#/components/schemas/Skill"}
        session: {$ref: "#/components/schemas/Session"}

    # ------------------------------------------------------------ sign-in and Sessions
    Session:
      type: object
      required: [id, member_id, kind, started_at, last_seen_at]
      properties:
        id:
          type: string
          description: The id the running copy chose.
        member_id: {type: string}
        kind: {$ref: "#/components/schemas/SessionKind"}
        token_id:
          type: string
          description: The token the Session presents. Absent for browser Sessions.
        started_at: {type: string, format: date-time}
        last_seen_at: {type: string, format: date-time}
        expires_at:
          type: string
          format: date-time
          description: |
            When an open browser Session ends unless it is used before: after a time unused, and
            at the latest a time after it started. Absent for token Sessions, which end when
            closed or when their token is revoked.
        closed_at: {type: string, format: date-time}
    SessionList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: {$ref: "#/components/schemas/Session"}
        next_cursor:
          type: string
          description: Pass as `cursor` for the next page. Absent on the last page.
    SessionKind:
      type: string
      enum: [token, browser]
    ClosedSession:
      type: object
      required: [session, claims_ended]
      properties:
        session: {$ref: "#/components/schemas/Session"}
        claims_ended:
          type: integer
          description: How many Claims bound to the Session were ended.
    LoginLink:
      type: object
      required: [url, expires_at]
      properties:
        url:
          type: string
          description: Open once in a browser to sign in.
        expires_at: {type: string, format: date-time}
    EmailSignInBody:
      type: object
      required: [email]
      properties:
        email: {type: string, format: email}

    # ------------------------------------------------------------ tokens
    Token:
      type: object
      required: [id, member_id, name, prefix, created_at]
      properties:
        id: {type: string}
        member_id: {type: string}
        name: {type: string}
        prefix:
          type: string
          description: The first characters of the secret, to tell tokens apart.
        default_heartbeat_timeout_seconds:
          type: integer
          description: The heartbeat timeout `claim` and `next` use when the call names none. Absent when Claims have none by default.
        created_at: {type: string, format: date-time}
        last_used_at: {type: string, format: date-time}
        revoked_at: {type: string, format: date-time}
    IssuedToken:
      type: object
      required: [token, secret]
      properties:
        token: {$ref: "#/components/schemas/Token"}
        secret:
          type: string
          description: The bearer credential, `dk_…`. Shown only in this reply.
    TokenList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: {$ref: "#/components/schemas/Token"}
    IssueTokenBody:
      type: object
      required: [name]
      properties:
        name: {type: string, minLength: 1, maxLength: 100}
        default_heartbeat_timeout_seconds:
          type: integer
          minimum: 1
          maximum: 86400

    # ------------------------------------------------------------ members
    Member:
      type: object
      required: [id, name, kind, admin, created_at]
      properties:
        id: {type: string}
        name: {type: string}
        kind: {$ref: "#/components/schemas/MemberKind"}
        email: {type: string}
        admin:
          type: boolean
          description: Admins create Members, Teams and Skills, set Reporting lines, and issue tokens and login links.
        manager_id:
          type: string
          description: The Member who directs this one. Absent when there is no Reporting line.
        created_at: {type: string, format: date-time}
        deactivated_at:
          type: string
          format: date-time
          description: When an admin deactivated the Member. Absent while the Member is active.
        agent:
          $ref: "#/components/schemas/AgentSettings"
    MemberKind:
      type: string
      enum: [human, agent]
    MemberDetail:
      type: object
      required: [member, teams, skills, reports]
      properties:
        member: {$ref: "#/components/schemas/Member"}
        teams:
          type: array
          items: {$ref: "#/components/schemas/Team"}
        skills:
          type: array
          items: {$ref: "#/components/schemas/Skill"}
        reports:
          type: array
          description: The Members this Member directs.
          items: {$ref: "#/components/schemas/Member"}
    MemberList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: {$ref: "#/components/schemas/Member"}
    CreateMemberBody:
      type: object
      required: [name, kind]
      properties:
        name: {type: string, minLength: 1, maxLength: 100}
        kind: {$ref: "#/components/schemas/MemberKind"}
        email: {type: string, format: email}
        admin: {type: boolean}
    UpdateMemberBody:
      type: object
      properties:
        name: {type: string, minLength: 1, maxLength: 100}
        email: {type: string, format: email}
        admin: {type: boolean}
    AgentSettings:
      type: object
      description: |
        How the Runner starts an agent Member's sessions. Absent for humans, and for agents the
        Runner does not start (an agent working from elsewhere, through its own token). `command`
        is the program and `args` its arguments; in each, the Runner replaces `{session_id}` (the
        session id it chooses), `{model}`, `{prompt_file}` (the prompt it writes from the record),
        `{mcp_config}` (a config file pointing at `darkory mcp`), `{workspace}` (the session's
        directory) and `{task}` (the Task's display key). The defaults start Claude Code:
        `claude --session-id {session_id} --model {model} --dangerously-skip-permissions
        --mcp-config {mcp_config} --append-system-prompt-file {prompt_file}`. Every Member can
        read these settings, `env` included: keep secrets in the server's own environment, which
        sessions inherit.
      required: [command, args, model, env, unattended, paused]
      properties:
        command:
          type: string
          description: The program to start, such as `claude`.
        args:
          type: array
          description: Its arguments, each a template.
          items: {type: string}
        model:
          type: string
          description: The model the agent runs on, passed as `{model}` and reported as the Claim's model label.
        env:
          type: object
          description: Variables added to the session's environment, besides `DARKORY_URL`, `DARKORY_TOKEN` and `DARKORY_SESSION`.
          additionalProperties: {type: string}
        unattended:
          type: boolean
          description: The session runs with the agent's permission checks skipped; the worktree and the exit rules are the fence.
        paused:
          type: boolean
          description: The Runner starts no new session for the agent; one running carries on.
        progress_file:
          type: string
          description: |
            The file whose modified time shows the session making progress, for a command other
            than Claude Code (whose transcript the Runner finds itself); it may use the same
            placeholders. The Runner sends Heartbeats only while it changes.
    SetAgentSettingsBody:
      type: object
      description: The settings to change; those left out stay as they are. `progress_file` set to `""` clears it.
      properties:
        command: {type: string, minLength: 1, maxLength: 1000}
        args:
          type: array
          maxItems: 100
          items: {type: string, maxLength: 1000}
        model: {type: string, minLength: 1, maxLength: 200}
        env:
          type: object
          description: The whole set of variables, replacing the one there.
          additionalProperties: {type: string}
        unattended: {type: boolean}
        paused: {type: boolean}
        progress_file: {type: string, maxLength: 1000}
    SetManagerBody:
      type: object
      required: [manager]
      properties:
        manager:
          type: string
          description: Member id or name.

    # ------------------------------------------------------------ teams
    Team:
      type: object
      required: [id, key, name, ship_when_done, created_at]
      properties:
        id: {type: string}
        key:
          type: string
          description: The prefix of the Team's display keys, such as `WEB` in `WEB-42`.
        name: {type: string}
        default_workspace_id:
          type: string
          description: The Workspace a Task filed in the Team names when it names none. Absent when the Team has none.
        ship_when_done:
          type: boolean
          description: The `ship_when_done` a Feature filed in the Team takes when its filer does not say.
        created_at: {type: string, format: date-time}
    TeamDetail:
      type: object
      required: [team, members]
      properties:
        team: {$ref: "#/components/schemas/Team"}
        members:
          type: array
          items: {$ref: "#/components/schemas/Member"}
    TeamList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: {$ref: "#/components/schemas/Team"}
    CreateTeamBody:
      type: object
      required: [key, name]
      properties:
        key:
          type: string
          pattern: "^[A-Z][A-Z0-9]{1,9}$"
        name: {type: string, minLength: 1, maxLength: 100}
    UpdateTeamBody:
      type: object
      properties:
        name: {type: string, minLength: 1, maxLength: 100}
        default_workspace:
          type: string
          description: Workspace id or name; `""` clears the Team's default.
        ship_when_done: {type: boolean}

    # ------------------------------------------------------------ workspaces
    Workspace:
      type: object
      description: |
        A place a session works in, named on the Install. A `git` Workspace is a repository at
        `path` on the machine that runs the Install; a session works in a checkout of it on a
        branch named after its Task. In `pull_request` mode, work lands through pull requests
        instead of merges by the Runner.
      required: [id, name, kind, path, mode, default_branch, created_at]
      properties:
        id: {type: string}
        name:
          type: string
          description: Unique on the Install, ignoring case; it names the session's checkout directory.
        kind: {$ref: "#/components/schemas/WorkspaceKind"}
        path:
          type: string
          description: The repository's absolute path.
        mode: {$ref: "#/components/schemas/WorkspaceMode"}
        default_branch:
          type: string
          description: The branch work lands on, such as `main`.
        created_at: {type: string, format: date-time}
    WorkspaceKind:
      type: string
      description: The kind of place. Only `git` for now; more may be added within `/v1`.
      enum: [git]
      x-enum-varnames: [WorkspaceKindGit]
    WorkspaceMode:
      type: string
      description: |
        `plain`: the Runner merges branches itself. `pull_request`: it opens pull requests, and a
        merged pull request carrying a Task's key completes that Task's review.
      enum: [plain, pull_request]
      x-enum-varnames: [WorkspaceModePlain, WorkspaceModePullRequest]
    WorkspaceList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: {$ref: "#/components/schemas/Workspace"}
    CreateWorkspaceBody:
      type: object
      required: [name, path]
      properties:
        name:
          type: string
          pattern: "^[A-Za-z0-9][A-Za-z0-9._-]{0,62}$"
        kind: {$ref: "#/components/schemas/WorkspaceKind"}
        path:
          type: string
          minLength: 1
          maxLength: 4096
          description: The repository's absolute path.
        mode: {$ref: "#/components/schemas/WorkspaceMode"}
        default_branch:
          type: string
          minLength: 1
          maxLength: 255
          description: Defaults to `main`.
    UpdateWorkspaceBody:
      type: object
      properties:
        name:
          type: string
          pattern: "^[A-Za-z0-9][A-Za-z0-9._-]{0,62}$"
        path: {type: string, minLength: 1, maxLength: 4096}
        mode: {$ref: "#/components/schemas/WorkspaceMode"}
        default_branch: {type: string, minLength: 1, maxLength: 255}

    # ------------------------------------------------------------ skills
    Skill:
      type: object
      required: [id, name, kind, builtin, current_version, created_at]
      properties:
        id: {type: string}
        name: {type: string}
        kind: {$ref: "#/components/schemas/SkillKind"}
        base_skill_id:
          type: string
          description: The generic Skill a company Skill builds on.
        builtin:
          type: boolean
          description: True for `breakdown`, `retro` and `skill-review`, which Darkory relies on.
        current_version:
          type: integer
          format: int64
        created_at: {type: string, format: date-time}
    SkillKind:
      type: string
      enum: [generic, company]
    SkillVersion:
      type: object
      required: [skill_id, version, body, published_at]
      properties:
        skill_id: {type: string}
        version:
          type: integer
          format: int64
        body: {type: string}
        proposal_id:
          type: string
          description: The proposal this version was published from. Absent for version 1.
        published_by:
          type: string
          description: The Member who completed the review, or who created the Skill.
        published_at: {type: string, format: date-time}
    SkillDetail:
      type: object
      required: [skill, current]
      properties:
        skill: {$ref: "#/components/schemas/Skill"}
        current: {$ref: "#/components/schemas/SkillVersion"}
    SkillList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: {$ref: "#/components/schemas/Skill"}
    SkillVersionList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: {$ref: "#/components/schemas/SkillVersion"}
    CreateSkillBody:
      type: object
      required: [name, kind, body]
      properties:
        name:
          type: string
          pattern: "^[a-z0-9][a-z0-9-]{0,62}$"
        kind: {$ref: "#/components/schemas/SkillKind"}
        base_skill:
          type: string
          description: Required for a company Skill. Id or name of a generic Skill.
        body:
          type: string
          description: The Skill's text, published as version 1.
    SkillProposal:
      type: object
      required: [id, skill_id, task_id, based_on_version, body, author_id, state, created_at]
      properties:
        id: {type: string}
        skill_id: {type: string}
        task_id: {type: string}
        based_on_version:
          type: integer
          format: int64
        body: {type: string}
        author_id: {type: string}
        state: {$ref: "#/components/schemas/ProposalState"}
        published_version:
          type: integer
          format: int64
          description: The version publishing it made. Absent unless `state` is `published`.
        created_at: {type: string, format: date-time}
        decided_at:
          type: string
          format: date-time
          description: When it was published or superseded.
    ProposalState:
      type: string
      description: |
        `pending`: waiting for review. `published`: a review published it. `superseded`: it will
        not be published, because a newer proposal replaced it on its Task or its Task ended
        without publishing it.
      enum: [pending, published, superseded]
    ProposeSkillVersionBody:
      type: object
      required: [skill, based_on_version, body]
      properties:
        skill:
          type: string
          description: Id or name of a company Skill.
        based_on_version:
          type: integer
          format: int64
        body: {type: string}

    # ------------------------------------------------------------ features
    Feature:
      type: object
      required: [id, key, team_id, title, description, owner_id, state, rank, quick, ship_when_done, filed_by, created_at, task_counts]
      properties:
        id: {type: string}
        key:
          type: string
          description: Display key, such as `WEB-1`.
        team_id: {type: string}
        title: {type: string}
        description: {type: string}
        owner_id: {type: string}
        state: {$ref: "#/components/schemas/FeatureState"}
        rank:
          type: integer
          format: int64
          description: Position in the Team's Rank, 1 first. An ended Feature keeps its place.
        from_retrospective_task_id:
          type: string
          description: The Retrospective that filed this Feature.
        quick:
          type: boolean
          description: A quick Feature was filed with its one Task and no Break down; it has no Retrospective.
        ship_when_done:
          type: boolean
          description: The Feature ships itself when its last open Task is completed. Always true for a quick Feature.
        filed_by: {type: string}
        created_at: {type: string, format: date-time}
        ended_at: {type: string, format: date-time}
        task_counts: {$ref: "#/components/schemas/TaskCounts"}
    TaskCounts:
      type: object
      description: How many of the Feature's Tasks are in each state.
      required: [open, claimed, done, dropped]
      properties:
        open:
          type: integer
          description: Open Tasks, claimed or not.
        claimed:
          type: integer
          description: Open Tasks with a live Claim; these are also counted in `open`.
        done: {type: integer}
        dropped: {type: integer}
    FeatureState:
      type: string
      enum: [open, shipped, dropped]
    FeatureDetail:
      type: object
      required: [feature, tasks, evidence]
      properties:
        feature: {$ref: "#/components/schemas/Feature"}
        tasks:
          type: array
          items: {$ref: "#/components/schemas/Task"}
        evidence:
          type: array
          items: {$ref: "#/components/schemas/Evidence"}
    FeatureList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: {$ref: "#/components/schemas/Feature"}
        next_cursor:
          type: string
          description: Pass as `cursor` for the next page. Absent on the last page.
    FileFeatureBody:
      type: object
      required: [team, title]
      properties:
        team:
          type: string
          description: Team id or key.
        title: {type: string, minLength: 1, maxLength: 200}
        description: {type: string}
        owner:
          type: string
          description: Member id or name. Defaults to the caller.
        from_retrospective:
          type: string
          description: Id or display key of the Retrospective Task filing this Feature.
        quick:
          type: boolean
          description: File a quick Feature, with its one Task instead of a Break down. Needs `skill`.
        skill:
          type: string
          description: A quick Feature's only. Skill id or name its one Task needs.
        workspaces:
          type: array
          description: A quick Feature's only. Workspace ids or names its one Task names; default the Team's default Workspace.
          items: {type: string}
        ship_when_done:
          type: boolean
          description: Ship the Feature when its last open Task is completed. Defaults to the Team's; true for a quick Feature.
    RankFeatureBody:
      type: object
      required: [position]
      properties:
        position:
          type: integer
          format: int64
          minimum: 1
    PassFeatureOwnershipBody:
      type: object
      required: [owner]
      properties:
        owner:
          type: string
          description: Member id or name.

    # ------------------------------------------------------------ tasks
    Task:
      type: object
      required: [id, key, feature_id, kind, title, description, state, status_id, blocked, filed_by, waiting_since, created_at]
      properties:
        id: {type: string}
        key:
          type: string
          description: Display key, such as `WEB-42`.
        feature_id: {type: string}
        kind: {$ref: "#/components/schemas/TaskKind"}
        title: {type: string}
        description: {type: string}
        state: {$ref: "#/components/schemas/TaskState"}
        status_id:
          type: string
          description: The Task's Status, one of the Organisation's (`listStatuses`).
        skill_id:
          type: string
          description: The Skill the Task needs now. Absent when it is aimed at a Member.
        aimed_at_id:
          type: string
          description: The Member the Task is aimed at by name.
        claim:
          $ref: "#/components/schemas/Claim"
        blocked:
          type: boolean
          description: True while any Task blocking this one is open.
        open_blockers:
          type: array
          description: The open Tasks blocking this one. Absent when none is open.
          items: {$ref: "#/components/schemas/TaskBrief"}
        workspace_ids:
          type: array
          description: The Workspaces the Task names, in the order named. Absent when it names none.
          items: {type: string}
        filed_by: {type: string}
        waiting_since:
          type: string
          format: date-time
          description: When the Task was filed or last handed over.
        created_at: {type: string, format: date-time}
        ended_at: {type: string, format: date-time}
    TaskBrief:
      type: object
      description: A Task named by its id and display key.
      required: [id, key]
      properties:
        id: {type: string}
        key:
          type: string
          description: Display key, such as `WEB-42`.
    TaskState:
      type: string
      description: Claimed and lapsed are not states; they follow from the Task's Claim.
      enum: [open, done, dropped]
    Status:
      type: object
      description: |
        Where a Task is in its workflow, from the list the Organisation defines and orders. The
        rules read the kind, never the name. A Task in a `backlog` Status is not takeable, so
        `next` never offers it. Darkory moves the Status on its own acts: a claim moves a Task in
        a `todo` Status to the first `in_progress` one; complete moves it to the first `done` one,
        drop to the first `dropped` one; a Claim that ends any other way but Handover (release, a
        lapse, take-back, a revoked token, a closed Session, a deactivated Member) moves a Task in
        an `in_progress` Status to the first `todo` one. Handover leaves the Status unless the
        holder names one. Claimed and blocked are not Statuses.
      required: [id, name, kind, position]
      properties:
        id: {type: string}
        name: {type: string}
        kind: {$ref: "#/components/schemas/StatusKind"}
        position:
          type: integer
          format: int64
          description: Its place in the Organisation's list, 1 first.
    StatusKind:
      type: string
      description: |
        What Darkory's rules read. `backlog`: filed ahead, not takeable. `todo`: takeable.
        `in_progress`: being worked, and still takeable once its Claim has lapsed. `done` and
        `dropped`: reached only by completing or dropping the Task, which never leaves them.
      enum: [backlog, todo, in_progress, done, dropped]
      x-enum-varnames: [StatusKindBacklog, StatusKindTodo, StatusKindInProgress, StatusKindDone, StatusKindDropped]
    StatusList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          description: The Organisation's Statuses, in their order.
          items: {$ref: "#/components/schemas/Status"}
    SetStatusesBody:
      type: object
      required: [items]
      properties:
        items:
          type: array
          description: |
            The whole list, in its new order. A Status already in the list carries its `id`; a
            new one has none. A Status left out is deleted.
          items: {$ref: "#/components/schemas/StatusInput"}
        moves:
          type: object
          description: |
            Where the Tasks in a deleted Status go: the deleted Status's id to the id of a Status
            kept in the list, of the same kind of ending (an open kind to an open kind, `done` to
            `done`, `dropped` to `dropped`).
          additionalProperties: {type: string}
    StatusInput:
      type: object
      required: [name, kind]
      properties:
        id:
          type: string
          description: The id of a Status in the list now; left out for a new one.
        name: {type: string, minLength: 1, maxLength: 50}
        kind: {$ref: "#/components/schemas/StatusKind"}
    SetTaskStatusBody:
      type: object
      required: [status]
      properties:
        status:
          type: string
          description: Status id or name, of kind `backlog`, `todo` or `in_progress`.
    TaskKind:
      type: string
      description: "`breakdown` and `retrospective` Tasks are filed by Darkory."
      enum: [work, breakdown, retrospective]
    Claim:
      type: object
      required: [id, task_id, holder_id, session_id, started_at]
      properties:
        id: {type: string}
        task_id: {type: string}
        holder_id: {type: string}
        session_id:
          type: string
          description: The Session that made the Claim.
        skill_id:
          type: string
          description: The Skill the Claim was made under. Absent for a Task aimed at a Member.
        skill_version:
          type: integer
          format: int64
          description: The version of the Skill the Claim was worked under.
        model_label:
          type: string
          description: The AI model the holder said it used. Stored, never interpreted.
        heartbeat_timeout_seconds:
          type: integer
          description: Absent when the Claim never lapses on its own.
        started_at: {type: string, format: date-time}
        expires_at:
          type: string
          format: date-time
          description: When the Claim lapses unless a Heartbeat arrives.
        ended_at: {type: string, format: date-time}
        how_ended: {$ref: "#/components/schemas/ClaimEnd"}
    ClaimEnd:
      type: string
      enum: [released, handed_over, completed, lapsed, taken_back, dropped, token_revoked, session_closed, member_deactivated]
    TaskDetail:
      type: object
      required: [task, status, feature, workspaces, claims, notes, evidence, blockers, blocking, observations]
      description: The Task with its record. `proposal` is the latest Skill proposal written on it, when any.
      properties:
        task: {$ref: "#/components/schemas/Task"}
        status:
          $ref: "#/components/schemas/Status"
        feature: {$ref: "#/components/schemas/Feature"}
        workspaces:
          type: array
          description: The Workspaces the Task names, in the order of `task.workspace_ids`.
          items: {$ref: "#/components/schemas/Workspace"}
        claims:
          type: array
          description: Every Claim on the Task, oldest first.
          items: {$ref: "#/components/schemas/Claim"}
        notes:
          type: array
          description: The running log, oldest first.
          items: {$ref: "#/components/schemas/Note"}
        evidence:
          type: array
          items: {$ref: "#/components/schemas/Evidence"}
        blockers:
          type: array
          description: The Tasks blocking this one.
          items: {$ref: "#/components/schemas/Task"}
        blocking:
          type: array
          description: The Tasks this one blocks.
          items: {$ref: "#/components/schemas/Task"}
        observations:
          type: array
          items: {$ref: "#/components/schemas/Observation"}
        proposal:
          $ref: "#/components/schemas/SkillProposal"
    TaskList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: {$ref: "#/components/schemas/Task"}
        next_cursor:
          type: string
          description: Pass as `cursor` for the next page. Absent on the last page.
    FileTaskBody:
      type: object
      required: [title]
      properties:
        feature:
          type: string
          description: Feature id or display key. May be left out when `blocks` is given.
        title: {type: string, minLength: 1, maxLength: 200}
        description: {type: string}
        skill:
          type: string
          description: Skill id or name the Task needs. Give this or `aimed_at`.
        aimed_at:
          type: string
          description: Member id or name the Task is aimed at. Give this or `skill`.
        blocks:
          type: string
          description: Id or display key of a Task the new one blocks (a question or Escalation).
        status:
          type: string
          description: |
            Status id or name the Task starts in, of kind `backlog`, `todo` or `in_progress`;
            `backlog` files it ahead, where `next` does not offer it. Defaults to the first `todo`
            Status.
        workspaces:
          type: array
          description: |
            Workspace ids or names the Task names: where a session works it. Left out, the Task
            names its Feature's Team's default Workspace, or none when the Team has none; an
            empty list names none.
          items: {type: string}
    ClaimTaskBody:
      type: object
      properties:
        heartbeat_timeout_seconds:
          type: integer
          minimum: 0
          maximum: 86400
          description: Seconds without a Heartbeat before the Claim lapses. 0 for none. Defaults to the token's default.
        model_label:
          type: string
          maxLength: 200
    NextTaskBody:
      type: object
      properties:
        wait_seconds:
          type: integer
          minimum: 0
          maximum: 60
          description: How long to wait for a takeable Task. Defaults to 30; 0 returns at once.
        heartbeat_timeout_seconds:
          type: integer
          minimum: 0
          maximum: 86400
          description: Seconds without a Heartbeat before the Claim lapses. 0 for none. Defaults to the token's default.
        model_label:
          type: string
          maxLength: 200
    HeartbeatReply:
      type: object
      required: [status]
      properties:
        status: {$ref: "#/components/schemas/HeartbeatStatus"}
        expires_at:
          type: string
          format: date-time
          description: The Claim's new expiry, when `status` is `ok`.
    HeartbeatStatus:
      type: string
      description: |
        `ok`: the Claim is extended. `lapsed`: it ran out before this Heartbeat. `taken_back`:
        someone on the Reporting line or the Feature owner took it back. `ended`: it ended some
        other way (released, handed over, completed, dropped, revoked).
      enum: [ok, lapsed, taken_back, ended]
    ReleaseTaskBody:
      type: object
      properties:
        note:
          type: string
          description: Added to the Task's Notes in the same write.
    HandoverTaskBody:
      type: object
      required: [skill]
      properties:
        skill:
          type: string
          description: Skill id or name the Task needs next.
        note:
          type: string
          description: Added to the Task's Notes in the same write.
        status:
          type: string
          description: |
            Status id or name to move the Task to, of kind `backlog`, `todo` or `in_progress`,
            such as In review. Left out, the Status stays as it is.
    CompleteTaskBody:
      type: object
      properties:
        note:
          type: string
          description: Added to the Task's Notes in the same write.
    DropTaskBody:
      type: object
      properties:
        reason: {type: string}
    TakeBackTaskBody:
      type: object
      properties:
        reason: {type: string}

    # ------------------------------------------------------------ Notes, Observations, Evidence
    Note:
      type: object
      required: [id, task_id, author_id, body, created_at]
      properties:
        id: {type: string}
        task_id: {type: string}
        author_id: {type: string}
        skill_id:
          type: string
          description: The Skill the author was working under.
        body: {type: string}
        created_at: {type: string, format: date-time}
    AddNoteBody:
      type: object
      required: [body]
      properties:
        body: {type: string, minLength: 1}
    Observation:
      type: object
      required: [id, task_id, feature_id, author_id, outcome, body, created_at]
      properties:
        id: {type: string}
        task_id: {type: string}
        feature_id: {type: string}
        author_id: {type: string}
        skill_id:
          type: string
          description: The Skill the author was working under.
        outcome: {$ref: "#/components/schemas/ObservationOutcome"}
        body: {type: string}
        created_at: {type: string, format: date-time}
        reviewed_by_task_id:
          type: string
          description: The Retrospective that reviewed it. Absent until reviewed.
        reviewed_at: {type: string, format: date-time}
    ObservationOutcome:
      type: string
      enum: [worked, didnt_work]
    ObservationList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: {$ref: "#/components/schemas/Observation"}
    ObserveBody:
      type: object
      required: [outcome, body]
      properties:
        outcome: {$ref: "#/components/schemas/ObservationOutcome"}
        body: {type: string, minLength: 1}
    Evidence:
      type: object
      required: [id, feature_id, filename, content_type, size, sha256, attached_by, created_at]
      properties:
        id: {type: string}
        feature_id: {type: string}
        task_id:
          type: string
          description: Absent when attached to the Feature itself.
        filename: {type: string}
        content_type: {type: string}
        size:
          type: integer
          format: int64
        sha256: {type: string}
        attached_by: {type: string}
        created_at: {type: string, format: date-time}

    # ------------------------------------------------------------ activity
    Activity:
      type: object
      required: [seq, at, kind, subject_type, subject_id, payload]
      properties:
        seq:
          type: integer
          format: int64
          description: Per-Organisation sequence number, in commit order.
        at: {type: string, format: date-time}
        actor_id:
          type: string
          description: The Member who acted. Absent when Darkory acted, as when recording a lapse.
        kind: {$ref: "#/components/schemas/ActivityKind"}
        subject_type: {$ref: "#/components/schemas/SubjectType"}
        subject_id:
          type: string
          description: The id of the record the entry is about, of `subject_type`.
        payload:
          type: object
          additionalProperties: true
    ActivityKind:
      type: string
      description: |
        What happened. The part before the dot is the `subject_type`. New kinds may be added
        within `/v1`; a client should skip a kind it does not know.
      enum:
        - feature.filed
        - feature.ranked
        - feature.shipped
        - feature.dropped
        - feature.owner_passed
        - feature.evidence_attached
        - task.filed
        - task.claimed
        - task.lapsed
        - task.released
        - task.handed_over
        - task.completed
        - task.dropped
        - task.taken_back
        - task.claim_ended
        - task.note_added
        - task.observed
        - task.blocker_added
        - task.blocker_removed
        - task.evidence_attached
        - task.skill_proposed
        - task.status_set
        - statuses.changed
        - skill.created
        - skill.version_published
        - member.created
        - member.updated
        - member.manager_set
        - member.manager_cleared
        - member.skill_granted
        - member.skill_revoked
        - member.deactivated
        - member.reactivated
        - member.agent_changed
        - team.created
        - team.changed
        - team.member_added
        - team.member_removed
        - workspace.added
        - workspace.changed
        - workspace.removed
        - token.issued
        - token.revoked
        - session.closed
        - login_link.issued
        - login_link.redeemed
    SubjectType:
      type: string
      description: |
        The kind of record an Activity entry is about. `statuses` is the Organisation's list of
        Statuses as a whole; its `subject_id` is the Organisation's id.
      enum: [feature, task, skill, member, team, token, session, login_link, statuses, workspace]
    ActivityPage:
      type: object
      required: [items, last_seq]
      properties:
        items:
          type: array
          items: {$ref: "#/components/schemas/Activity"}
        last_seq:
          type: integer
          format: int64
          description: The sequence number of the last entry returned, or `after` when none were. Pass it as `after` next time.
        first_seq:
          type: integer
          format: int64
          description: The sequence number of the first entry returned. Absent when none were. Pass it as `before` to read the page before.

    # ------------------------------------------------------------ runner
    RunnerSession:
      type: object
      description: |
        An agent session the Runner runs for a Task it claimed as that agent. Not part of the
        record: it lives as long as the session.
      required: [task_id, member_id, session_id, host, started_at, state, log_path]
      properties:
        task_id: {type: string}
        member_id:
          type: string
          description: The agent whose session it is.
        session_id:
          type: string
          description: The Darkory Session the Runner holds the Claim through, which is also the agent's own session id.
        host:
          type: string
          description: The machine the session runs on.
        tmux:
          type: string
          description: The tmux session's name, such as `dk-WEB-12`. Absent when the session runs without tmux and cannot be joined.
        started_at: {type: string, format: date-time}
        state: {$ref: "#/components/schemas/RunnerSessionState"}
        log_path:
          type: string
          description: Where the session's terminal is logged on that machine; attached to the Task as Evidence when it ends.
    RunnerSessionState:
      type: string
      description: |
