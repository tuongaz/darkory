openapi: 3.0.3
info:
  title: Darkory
  version: 0.1.0
  description: |
    The canonical contract between Members and a Darkory Install. The CLI, the MCP server and the
    web app use only these operations; humans and agents call the same ones.

    **Versioning.** Paths are versioned (`/v1`). Changes within `/v1` are additive only.

    **Credentials.** Every operation except `getHealth`, `showLoginLink`, `redeemLoginLink` and
    `requestEmailSignIn` needs a credential: a bearer token (`dk_…`) together with a
    `Darkory-Session` header naming the Session making the request, or the browser cookie
    `darkory_session`. A bearer request without `Darkory-Session` is refused with
    `session_required`. A request with no credential is never a Member. A browser Session ends
    after a time unused and after a time in all (Install settings); a deactivated Member's
    credentials are all refused.

    **References.** Path parameters and request-body references take an id, or the natural key
    where one exists: a Task display key (`MAIN-42`), a Project key (`MAIN`), a Skill name
    (`qa`), a Member name, a Workspace name; a Step by its name within its Project,
    and a Label by its name among those a Task of the Project can carry. Tokens, Evidence,
    Sessions, Views and Labels in a path are referenced by id only. Responses always carry ids,
    plus display keys where they exist.

    **Ids.** Every id is a UUID, written in its short form (the `ID` schema, `format: id`): 22
    characters of base58 in the Bitcoin alphabet, the UUID's 128 bits as one number, left-padded
    with `1`, such as `1CTuJUrXDEC71Dv55PHKrq`. Short ids sort as their UUIDs do. Wherever an id
    is read (a path, a query parameter, a filter value, a request body, the `Darkory-Session`
    header) its UUID's canonical 36-character text is read too, now and later, so an old link
    still works. Responses, Activity payloads and the stream write the short form. A Session's id
    is the one its running copy chose: written short when it is a UUID, as it is otherwise.
    Secrets (tokens, login-link codes, the cookie) and Task display keys are not ids.

    **Retries.** Every write accepts an `Idempotency-Key` header. The first response is kept for
    24 hours per Member and key; a retry with the same key returns it unchanged. Reusing a key
    for a different request is refused with `idempotency_key_reused`.

    **Errors.** Every failure has the `Error` body. `code` is stable and meant for programs;
    `message` is for people. Each operation lists the codes it can return beyond the common ones
    (`invalid`, `unauthenticated`, `session_required`, `forbidden`, `not_found`, `internal`).

    **Values.** Times are RFC 3339 in UTC. Durations are whole seconds, except a field whose name
    ends in `_ms`, which is milliseconds. Fields with no value are omitted, and so is a list with
    no items unless the schema requires it.
  license:
    name: Apache-2.0
    url: https://www.apache.org/licenses/LICENSE-2.0
servers:
  - url: http://127.0.0.1:7357
    description: A Local Install on its default listen address
security:
  - bearerAuth: []
    sessionHeader: []
  - cookieAuth: []
tags:
  - name: install
  - name: sign-in
  - name: tokens
  - name: members
  - name: projects
  - name: labels
  - name: skills
  - name: workspaces
  - name: tasks
  - name: evidence
  - name: activity
  - name: runner
  - name: views
  - name: files

paths:
  # ---------------------------------------------------------------- install
  /v1/health:
    get:
      operationId: getHealth
      tags: [install]
      summary: Report that the Install is up, how Members sign in, and whether a newer release exists
      security: []
      responses:
        "200":
          description: The Install is up.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Health"}
        default: {$ref: "#/components/responses/Error"}

  /v1/me:
    get:
      operationId: getMe
      tags: [install]
      summary: The calling Member, their Projects and Skills, and the Session making the request
      responses:
        "200":
          description: The caller.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Me"}
        default: {$ref: "#/components/responses/Error"}

  # ---------------------------------------------------------------- sign-in and Sessions
  /v1/members/{member}/login-links:
    post:
      operationId: issueLoginLink
      tags: [sign-in]
      summary: Issue a one-time login link for a named Member (admin)
      description: |
        The link signs a browser in as the Member once, then stops working. `darkory login
        <member>` and the web app both call this. Errors: `forbidden` (not an admin).
      parameters:
        - {$ref: "#/components/parameters/MemberRef"}
        - {$ref: "#/components/parameters/IdempotencyKey"}
      responses:
        "201":
          description: The link.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/LoginLink"}
        default: {$ref: "#/components/responses/Error"}

  /v1/login-links/{code}:
    get:
      operationId: showLoginLink
      tags: [sign-in]
      summary: Show a login link's sign-in page
      description: |
        An HTML page naming the Member and Organisation the link signs in as, with a button that
        posts to the same address (`redeemLoginLink`). Opening the link signs nobody in, so a
        page elsewhere cannot sign a browser in by sending it here, and a mail scanner fetching
        the link does not use it up. An unknown, used or expired link gets an HTML page saying
        so, with status 404.
      security: []
      parameters:
        - {$ref: "#/components/parameters/LoginCode"}
      responses:
        "200":
          description: The sign-in page.
          content:
            text/html:
              schema: {type: string}
        "404":
          description: The link is unknown, used or expired.
          content:
            text/html:
              schema: {type: string}
        default: {$ref: "#/components/responses/Error"}
    post:
      operationId: redeemLoginLink
      tags: [sign-in]
      summary: Redeem a login link
      description: |
        Starts a browser Session for the link's Member, sets the `darkory_session` cookie and
        redirects to `/`. The request must come from the Install's own sign-in page, as a cookie
        write must: `Sec-Fetch-Site`, when sent, says `same-origin` or `none`, and the `Origin`
        (or `Referer`) is the Install's. A cookie the browser already held has its Session
        closed. The `Idempotency-Key` is accepted and not stored: a link works once. Errors:
        `not_found` (unknown, used or expired link), `forbidden` (not sent from the Install's
        own page).
      security: []
      parameters:
        - {$ref: "#/components/parameters/LoginCode"}
        - {$ref: "#/components/parameters/IdempotencyKey"}
      responses:
        "303":
          description: Signed in; redirects to the web app.
          headers:
            Location:
              schema: {type: string}
            Set-Cookie:
              description: The `darkory_session` cookie.
              schema: {type: string}
        default: {$ref: "#/components/responses/Error"}

  /v1/sign-in/email:
    post:
      operationId: requestEmailSignIn
      tags: [sign-in]
      summary: Ask for a login link by email
      description: |
        When the Install has email sign-in set up and the address belongs to a Member, a login
        link is emailed. The reply is the same either way, so it reveals nothing about Members.
      security: []
      parameters:
        - {$ref: "#/components/parameters/IdempotencyKey"}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/EmailSignInBody"}
      responses:
        "202":
          description: Accepted.
        default: {$ref: "#/components/responses/Error"}

  /v1/logout:
    post:
      operationId: logout
      tags: [sign-in]
      summary: End the browser Session and clear its cookie
      description: Closes the cookie's Session, which ends the Claims bound to it.
      parameters:
        - {$ref: "#/components/parameters/IdempotencyKey"}
      responses:
        "204":
          description: Signed out.
          headers:
            Set-Cookie:
              schema: {type: string}
        default: {$ref: "#/components/responses/Error"}

  /v1/sessions/{session}/close:
    post:
      operationId: closeSession
      tags: [sign-in]
      summary: Close one of the caller's Sessions
      description: |
        Ends every Claim bound to the Session (those made with a heartbeat timeout) and records it
        in Activity. `{session}` is the id the running copy chose; an admin may close another
        Member's Session by naming `member`.
      parameters:
        - {$ref: "#/components/parameters/SessionID"}
        - name: member
          in: query
          description: The Member whose Session to close (admin). Defaults to the caller.
          schema: {type: string}
        - {$ref: "#/components/parameters/IdempotencyKey"}
      responses:
        "200":
          description: The closed Session.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ClosedSession"}
        default: {$ref: "#/components/responses/Error"}

  /v1/members/{member}/sessions:
    get:
      operationId: listSessions
      tags: [sign-in]
      summary: List a Member's Sessions
      description: |
        The Member's open Sessions, most recently seen first; with `state=ended`, those that have
        ended instead, most recently ended first. A Session ends when it is closed, when its token
        is revoked or its Member deactivated, or on its own: a browser Session when it expires, a
        token Session when no request has come through it for the Install's idle limit (15
        minutes unless set), but never while a Claim bound to it is live. Every page says how
        many of the Member's Sessions are open and how many have ended. A Member may list their
        own; an admin anyone's. Close one with `closeSession` and `member`, or close them all with
        `deactivateMember`.
      parameters:
        - {$ref: "#/components/parameters/MemberRef"}
        - name: state
          in: query
          description: Which Sessions to list. Defaults to `open`.
          schema: {$ref: "#/components/schemas/SessionState"}
        - {$ref: "#/components/parameters/Limit"}
        - {$ref: "#/components/parameters/Cursor"}
      responses:
        "200":
          description: The Sessions.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/SessionList"}
        default: {$ref: "#/components/responses/Error"}

  # ---------------------------------------------------------------- tokens
  /v1/members/{member}/tokens:
    post:
      operationId: issueToken
      tags: [tokens]
      summary: Issue a token for a Member (admin)
      description: |
        The secret is returned once and stored only as a hash. Errors: `forbidden`, `conflict`
        (the Member already has a live token with this name).
      parameters:
        - {$ref: "#/components/parameters/MemberRef"}
        - {$ref: "#/components/parameters/IdempotencyKey"}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/IssueTokenBody"}
      responses:
        "201":
          description: The token and its secret.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/IssuedToken"}
        default: {$ref: "#/components/responses/Error"}
    get:
      operationId: listTokens
      tags: [tokens]
      summary: List a Member's tokens
      description: A Member may list their own tokens; an admin may list anyone's. Secrets are never shown.
      parameters:
        - {$ref: "#/components/parameters/MemberRef"}
      responses:
        "200":
          description: The tokens, newest first.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/TokenList"}
        default: {$ref: "#/components/responses/Error"}

  /v1/tokens/{token}/revoke:
    post:
      operationId: revokeToken
      tags: [tokens]
      summary: Revoke a token
      description: |
        Ends every Claim bound to a Session of the token, and records it in Activity. A Member may
        revoke their own tokens; an admin may revoke anyone's.
      parameters:
        - {$ref: "#/components/parameters/TokenID"}
        - {$ref: "#/components/parameters/IdempotencyKey"}
      responses:
        "200":
          description: The revoked token.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Token"}
        default: {$ref: "#/components/responses/Error"}

  # ---------------------------------------------------------------- members
  /v1/members:
    post:
      operationId: createMember
      tags: [members]
      summary: Create a Member (admin)
      description: "Errors: `forbidden`, `conflict` (name or email taken)."
      parameters:
        - {$ref: "#/components/parameters/IdempotencyKey"}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/CreateMemberBody"}
      responses:
        "201":
          description: The new Member.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Member"}
        default: {$ref: "#/components/responses/Error"}
    get:
      operationId: listMembers
      tags: [members]
      summary: List the Organisation's Members
      parameters:
        - name: project
          in: query
          description: Only Members of this Project, by id or key.
          schema: {type: string}
        - name: kind
          in: query
          schema: {$ref: "#/components/schemas/MemberKind"}
      responses:
        "200":
          description: The Members, by name.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/MemberList"}
        default: {$ref: "#/components/responses/Error"}

  /v1/members/{member}:
    get:
      operationId: getMember
      tags: [members]
      summary: Get a Member with their Projects, Skills and Reporting line
      parameters:
        - {$ref: "#/components/parameters/MemberRef"}
      responses:
        "200":
          description: The Member.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/MemberDetail"}
        default: {$ref: "#/components/responses/Error"}
    patch:
      operationId: updateMember
      tags: [members]
      summary: Change a Member's name, email, admin mark or avatar
      description: |
        An admin changes any of them. A human Member may change their own avatar, and only that;
        an agent's avatar is changed by an admin. `avatar_file_id` names a file of the
        Organisation uploaded with `purpose=avatar`, by the caller unless they are an admin;
        `""` removes the avatar. The avatar file a Member stops showing is
        deleted, unless another Member shows it. Records `member.updated`, and `file.deleted`
        for a released avatar. Errors: `forbidden`, `not_found` (no such file), `invalid` (the
        file was not uploaded as an avatar), `forbidden` (also: another Member's upload),
        `conflict` (name or email taken; removing the last
        admin).
      parameters:
        - {$ref: "#/components/parameters/MemberRef"}
        - {$ref: "#/components/parameters/IdempotencyKey"}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/UpdateMemberBody"}
      responses:
        "200":
          description: The Member.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Member"}
        default: {$ref: "#/components/responses/Error"}

  /v1/members/{member}/agent:
    patch:
      operationId: setAgentSettings
      tags: [members]
      summary: Set how the Runner starts an agent Member's Shifts (admin)
      description: |
        Changes the fields given and keeps the others. An agent with no settings yet starts from
        the defaults: `command` `claude` with the Claude Code arguments shown on `AgentSettings`,
        model `claude-sonnet-5-5`, no `env`, `unattended` true, `paused` false, `shifts` 1. The Runner starts
        Shifts only for agents that have settings and are not paused. Records
        `member.agent_changed` with the fields that changed. Errors: `forbidden` (not an admin),
        `invalid` (a human Member, or a value out of bounds).
      parameters:
        - {$ref: "#/components/parameters/MemberRef"}
        - {$ref: "#/components/parameters/IdempotencyKey"}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/SetAgentSettingsBody"}
      responses:
        "200":
          description: The Member with its settings.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Member"}
        default: {$ref: "#/components/responses/Error"}
    delete:
      operationId: clearAgentSettings
      tags: [members]
      summary: Clear an agent Member's settings, so the Runner starts no Shift for it (admin)
      description: |
        The agent goes back to working through its own tokens only, as an agent the Runner does
        not start; a Shift running carries on until its Claim ends. Records
        `member.agent_changed` with `cleared: true` in its payload; an agent with no settings
        changes nothing. Errors: `forbidden` (not an admin), `invalid` (a human Member).
      parameters:
        - {$ref: "#/components/parameters/MemberRef"}
        - {$ref: "#/components/parameters/IdempotencyKey"}
      responses:
        "200":
          description: The Member, without settings.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Member"}
        default: {$ref: "#/components/responses/Error"}

  /v1/members/{member}/deactivate:
    post:
      operationId: deactivateMember
      tags: [members]
      summary: Deactivate a Member (admin)
      description: |
        Revokes the Member's tokens, closes their Sessions and ends every Claim they hold, bound
        to a Session or to the Member, recording each in Activity. From then on every credential
        of theirs is refused, and no token or login link can be issued for them. The Member stays
        in the record, with everything they did. Deactivating a deactivated Member changes
        nothing. Errors: `forbidden` (not an admin, or deactivating yourself), `conflict` (the
        last active admin).
      parameters:
        - {$ref: "#/components/parameters/MemberRef"}
        - {$ref: "#/components/parameters/IdempotencyKey"}
      responses:
        "200":
          description: The deactivated Member.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Member"}
        default: {$ref: "#/components/responses/Error"}

  /v1/members/{member}/reactivate:
    post:
      operationId: reactivateMember
      tags: [members]
      summary: Reactivate a deactivated Member (admin)
      description: |
        The Member may sign in and be issued tokens again. Tokens revoked and Sessions closed by
        the deactivation stay so. Reactivating an active Member changes nothing. Errors:
        `forbidden` (not an admin).
      parameters:
        - {$ref: "#/components/parameters/MemberRef"}
        - {$ref: "#/components/parameters/IdempotencyKey"}
      responses:
        "200":
          description: The Member.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Member"}
        default: {$ref: "#/components/responses/Error"}

  /v1/members/{member}/skills/{skill}:
    put:
      operationId: grantSkill
      tags: [members]
      summary: Grant a Skill to a Member (admin)
      parameters:
        - {$ref: "#/components/parameters/MemberRef"}
        - {$ref: "#/components/parameters/SkillRef"}
        - {$ref: "#/components/parameters/IdempotencyKey"}
      responses:
        "204":
          description: The Member has the Skill.
        default: {$ref: "#/components/responses/Error"}
    delete:
      operationId: revokeSkill
      tags: [members]
      summary: Take a Skill away from a Member (admin)
      description: Claims the Member holds under the Skill are not ended.
      parameters:
        - {$ref: "#/components/parameters/MemberRef"}
        - {$ref: "#/components/parameters/SkillRef"}
        - {$ref: "#/components/parameters/IdempotencyKey"}
      responses:
        "204":
          description: The Member no longer has the Skill.
        default: {$ref: "#/components/responses/Error"}

  /v1/members/{member}/manager:
    put:
      operationId: setManager
      tags: [members]
      summary: Set the Member who directs this Member (admin)
      description: "Errors: `forbidden`, `cycle` (the Reporting line would loop)."
      parameters:
        - {$ref: "#/components/parameters/MemberRef"}
        - {$ref: "#/components/parameters/IdempotencyKey"}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/SetManagerBody"}
      responses:
        "204":
          description: The Reporting line is set.
        default: {$ref: "#/components/responses/Error"}
    delete:
      operationId: clearManager
      tags: [members]
      summary: Remove the Member's Reporting line (admin)
      parameters:
        - {$ref: "#/components/parameters/MemberRef"}
        - {$ref: "#/components/parameters/IdempotencyKey"}
      responses:
        "204":
          description: The Member reports to no one.
        default: {$ref: "#/components/responses/Error"}

  # ---------------------------------------------------------------- projects
  /v1/projects:
    post:
      operationId: createProject
      tags: [projects]
      summary: Create a Project with its Workflows (admin)
      description: |
        The key prefixes the display keys of the Project's Tasks (`MAIN` in `MAIN-42`) and never
        changes. The Project starts with its Workflows: `default`, two Workflows, Implementation and
        Bug triage, with the Steps, Skills and Connectors `NewWorkflow` describes, where a Task
        filed without a Step starts at Build; `empty`, one Workflow named Work (Backlog, a hold, →
        Done "done"), for a Project that draws its own; or `copy`, every Workflow of the Project
        `copy_from` names, with its Steps and Connectors, without its Tasks. The Members named are
        put in the Project in the same write; the creator is not, unless named. `auto_complete` and
        `acceptance` are what a Task filed in the Project takes when its filer does not say; both
        default to false. Records `project.created`. Errors: `forbidden` (not an admin), `conflict`
        (key or name taken, ignoring case), `not_found` (no such Project to copy, Workspace or
        Member), `invalid` (`copy` without `copy_from`, or `copy_from` with another `workflow`).
      parameters:
        - {$ref: "#/components/parameters/IdempotencyKey"}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/CreateProjectBody"}
      responses:
        "201":
          description: The new Project with its Members.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ProjectDetail"}
        default: {$ref: "#/components/responses/Error"}
    get:
      operationId: listProjects
      tags: [projects]
      summary: List the Organisation's Projects
      responses:
        "200":
          description: The Projects, by name.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ProjectList"}
        default: {$ref: "#/components/responses/Error"}

  /v1/projects/{project}:
    get:
      operationId: getProject
      tags: [projects]
      summary: Get a Project and its Members
      parameters:
        - {$ref: "#/components/parameters/ProjectRef"}
      responses:
        "200":
          description: The Project.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ProjectDetail"}
        default: {$ref: "#/components/responses/Error"}
    patch:
      operationId: updateProject
      tags: [projects]
      summary: Change a Project's name, colour, default Workspace, or the Auto-complete and Acceptance a Task filed in it takes (admin)
      description: |
        Changes the fields given and keeps the others; `default_workspace` set to `""` clears it.
        The key never changes. A Task filed with no Parent naming no Workspace takes the Project's
        default; a Task filed without `auto_complete` or `acceptance` takes the Project's. Tasks
        already filed keep theirs. Records `project.changed` with the fields that changed.
        Errors: `forbidden` (not an admin), `conflict` (name taken), `not_found` (no such
        Workspace).
      parameters:
        - {$ref: "#/components/parameters/ProjectRef"}
        - {$ref: "#/components/parameters/IdempotencyKey"}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/UpdateProjectBody"}
      responses:
        "200":
          description: The Project.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Project"}
        default: {$ref: "#/components/responses/Error"}

  /v1/projects/{project}/members/{member}:
    put:
      operationId: addProjectMember
      tags: [projects]
      summary: Add a Member to a Project (admin)
      description: |
        The Member can then take the Project's Tasks at the Steps whose Skills they have. Adding a
        Member already in the Project changes nothing. Records `project.member_added`. Errors:
        `forbidden` (not an admin).
      parameters:
        - {$ref: "#/components/parameters/ProjectRef"}
        - {$ref: "#/components/parameters/MemberRef"}
        - {$ref: "#/components/parameters/IdempotencyKey"}
      responses:
        "204":
          description: The Member is in the Project.
        default: {$ref: "#/components/responses/Error"}
    delete:
      operationId: removeProjectMember
      tags: [projects]
      summary: Remove a Member from a Project (admin)
      description: |
        Claims the Member holds on the Project's Tasks are not ended. Records
        `project.member_removed`. Errors: `forbidden` (not an admin).
      parameters:
        - {$ref: "#/components/parameters/ProjectRef"}
        - {$ref: "#/components/parameters/MemberRef"}
        - {$ref: "#/components/parameters/IdempotencyKey"}
      responses:
        "204":
          description: The Member is not in the Project.
        default: {$ref: "#/components/responses/Error"}

  /v1/projects/{project}/seen:
    get:
      operationId: getProjectSeen
      tags: [projects]
      summary: Read how far the caller has seen a Project's Activity
      description: |
        The `seq` of the newest Activity entry the caller has seen in the Project, so a client can
        show what happened there since they looked, and when they set it. Both are null until the
        caller first sets it. It is the caller's own: nobody else, an admin included, reads it.
        Errors: `forbidden` (the caller is not in the Project), `not_found` (no such Project).
      parameters:
        - {$ref: "#/components/parameters/ProjectRef"}
      responses:
        "200":
          description: The caller's mark.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ProjectSeen"}
        default: {$ref: "#/components/responses/Error"}
    put:
      operationId: setProjectSeen
      tags: [projects]
      summary: Say how far the caller has seen a Project's Activity
      description: |
        By a Member of the Project, for themselves. The mark only moves forward: a `seq` at or
        below the one kept changes nothing, and the response is the mark as kept, so a client
        learns when its `seq` was behind. It is the caller's preference, not the record: setting
        it records no Activity. Errors: `forbidden` (the caller is not in the Project),
        `not_found` (no such Project), `invalid` (`seq` past the newest Activity entry).
      parameters:
        - {$ref: "#/components/parameters/ProjectRef"}
        - {$ref: "#/components/parameters/IdempotencyKey"}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/SetProjectSeenBody"}
      responses:
        "200":
          description: The caller's mark as kept.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ProjectSeen"}
        default: {$ref: "#/components/responses/Error"}

  /v1/projects/{project}/workflow:
    get:
      operationId: getWorkflow
      tags: [projects]
      summary: Get a Project's Workflows with what is happening at each Step now
      description: |
        The Workflows in their order, the Steps in theirs and the Connectors out of each, with each
        Step's live facts: the open Tasks at it, how many of them are being worked, the Members who
        could take them by its Skill, and the median time Tasks spent at it over the last 30 days.
        Any Member may read any Project's Workflows. A Task aimed at a Member, a Parent and an ended
        Task are at no Step and counted at none.
      parameters:
        - {$ref: "#/components/parameters/ProjectRef"}
      responses:
        "200":
          description: The Workflows.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Workflows"}
        default: {$ref: "#/components/responses/Error"}
    put:
      operationId: setWorkflow
      tags: [projects]
      summary: Replace a Project's Workflows (admin)
      description: |
        Takes the Project's whole graph: every Workflow, every Step with the Workflow it belongs to,
        and every Connector. A Workflow already there carries its `id` and may be renamed or
        reordered; one without `id` keeps the id of the Workflow with the same name, ignoring case,
        unless another Workflow of the body carries it, and any other is new; one left out is
        deleted with its Steps, whose open Tasks need `moves` as for any deleted Step. A Step
        already there carries its `id` and may be renamed, reordered, moved on the canvas, given
        another Skill or put in another Workflow; a new one has no `id`; one left out is deleted.
        Connectors likewise: one left out is deleted, and one without `id` is new unless a Connector
        out of the same Step with the same name exists, which it then keeps. A Connector may lead
        into a Step of another Workflow of the Project. Workflows are ordered by `position`, each
        Workflow's Steps by theirs and each Step's Connectors by theirs; the lists' own order is read
        only where a `position` is left out or 0. Changing a Step's Skill keeps the Tasks at it where they are, Claims included, and the
        next `next` offers them by the new Skill. A deleted Step at which open Tasks stand needs
        `moves` to say where they go, or it is refused with `step_in_use`; the Tasks moved keep
        their Claims. The Steps carrying the builtin `breakdown`, `acceptance` and `retro` Skills
        are where Darkory files the Subtasks it owns, the first of each by the Project's order, and
        a Project may have none of them: it then offers no Break down, files no Acceptance and no
        Retrospective. A Workflow may have no Steps at all, and a Project whose Workflows have none
        files nothing.
        The same body may change who takes the Steps, so an editor saves its draft whole: it creates
        the generic Skills in `skills` first, so a Step or a grant may name one, then puts the
        Workflows in place, adds the Members in `joins` to the Project, and gives and takes away the
        Skills in `grants` and `revokes`. All of it is one write: refused, none of it is made.
        Records `workflow.changed` when the Workflows change, and `skill.created`,
        `project.member_added`, `member.skill_granted` and `member.skill_revoked` for each act that
        changes something. Errors: `forbidden` (not an admin), `not_found` (no such Skill or
        Member), `conflict` (a Skill in `skills` is named as one that exists), `invalid` (a Skill's
        name in `skills` is not lower-case letters, digits and dashes, or given twice; one Member
        and Skill both granted and revoked; no Workflow at all; two Workflows share a name, ignoring
        case, or a `position`; a Step names a Workflow that is not in the body; two Steps share a
        name, ignoring case; two Steps of one Workflow share a `position`; a Connector names a Step
        that is not in the body; two Connectors out of one Step share a name, ignoring case, or a
        `position`; a Workflow `id` the Project does not have, or given twice; a Step or Connector
        `id` the Project does not have, or given twice; a Workflow, Step or Connector name that is
        empty, over 50 characters, on more than one line, or spelled as an id; a negative
        `position`; a `moves` key that is not a Step being deleted, or names one twice, or a value that is
        not a Step of the body), `step_in_use`.
      parameters:
        - {$ref: "#/components/parameters/ProjectRef"}
        - {$ref: "#/components/parameters/IdempotencyKey"}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/SetWorkflowBody"}
      responses:
        "200":
          description: The new Workflows, as `getWorkflow` returns them.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Workflows"}
        default: {$ref: "#/components/responses/Error"}

  # ---------------------------------------------------------------- labels
  /v1/projects/{project}/labels:
    get:
      operationId: listProjectLabels
      tags: [labels]
      summary: List a Project's own Labels
