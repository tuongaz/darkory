# Cuts a release when a v* tag is pushed: goreleaser builds, signs and publishes the binaries,
# the container image and the Homebrew cask (.goreleaser.yaml). docs/build/release.md lists the
# secrets and variables it needs.
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        if: hashFiles('web/package.json') != ''
        with:
          node-version: 22
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DARKORY_SIGNING_KEY: ${{ secrets.DARKORY_SIGNING_KEY }}
          DARKORY_RELEASE_PUBLIC_KEY: ${{ vars.DARKORY_RELEASE_PUBLIC_KEY }}
          HOMEBREW_TAP_GITHUB_TOKEN: ${{ secrets.HOMEBREW_TAP_GITHUB_TOKEN }}
