# Generates the server interface (net/http, non-strict) and its types from api/openapi.yaml.
# Handlers own the http.ResponseWriter, which the SSE stream and the long-poll `next` need.
# Run `make gen`.
package: gen
output: server.gen.go
generate:
  models: true
  std-http-server: true
output-options:
  name-normalizer: ToCamelCaseWithInitialisms
  # An id (format: id) is a shortid.ID on the server: it reads either form and writes the short
  # one (ADR 0017). The Go client keeps plain strings: it passes ids through as the API wrote them.
  type-mapping:
    string:
      formats:
        id:
          type: shortid.ID
          import: github.com/tuongaz/darkory/internal/shortid
