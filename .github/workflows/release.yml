# Cuts a release when a v* tag is pushed: goreleaser builds, signs and publishes the binaries,
# the container image and the Homebrew cask (.goreleaser.yaml). docs/build/release.md lists the
# secrets and variables it needs.
#
# The web app is built in a job of its own that holds no secret, and handed to the release job
# as an artifact: npm runs code from hundreds of packages, which must never share an environment
# with the signing key or a write token. Actions are pinned by commit, and goreleaser by version.
name: release

on:
  push:
    tags: ["v*"]

permissions: {}

jobs:
  web:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - name: Build the web app
        working-directory: web
        run: |
          npm ci --ignore-scripts
          npm run build
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: web-app
          path: web/dist/app
          if-no-files-found: error
          retention-days: 1

  release:
    needs: web
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
          # No cache another workflow could have written: this job holds the signing key.
          cache: false
      # The web app built above; goreleaser's before-hook embeds it and runs no npm.
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: web-app
          path: web/dist/app
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3.7.0
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: goreleaser/goreleaser-action@e435ccd777264be153ace6237001ef4d979d3a7a # v6.4.0
        with:
          distribution: goreleaser
          version: v2.18.2
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DARKORY_SIGNING_KEY: ${{ secrets.DARKORY_SIGNING_KEY }}
          DARKORY_RELEASE_PUBLIC_KEY: ${{ vars.DARKORY_RELEASE_PUBLIC_KEY }}
          HOMEBREW_TAP_GITHUB_TOKEN: ${{ secrets.HOMEBREW_TAP_GITHUB_TOKEN }}
