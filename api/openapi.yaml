      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/CreateWorkspaceBody"}
      responses:
        "201":
          description: The new Workspace.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Workspace"}
        default: {$ref: "#/components/responses/Error"}
    get:
      operationId: listWorkspaces
      tags: [workspaces]
      summary: List the Install's Workspaces
      responses:
        "200":
          description: The Workspaces, by name.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/WorkspaceList"}
        default: {$ref: "#/components/responses/Error"}

  /v1/workspaces/{workspace}:
    patch:
      operationId: updateWorkspace
      tags: [workspaces]
      summary: Change a Workspace's name, path, mode or default branch (admin)
      description: |
        Changes the fields given and keeps the others; the kind never changes. Records
        `workspace.changed` with the fields that changed. Errors: `forbidden` (not an admin),
        `conflict` (name taken), `invalid`.
      parameters:
        - {$ref: "#/components/parameters/WorkspaceRef"}
        - {$ref: "#/components/parameters/IdempotencyKey"}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/UpdateWorkspaceBody"}
      responses:
        "200":
          description: The Workspace.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Workspace"}
        default: {$ref: "#/components/responses/Error"}
    delete:
      operationId: removeWorkspace
      tags: [workspaces]
      summary: Remove a Workspace (admin)
      description: |
        Refused with `conflict` while any Task, open or ended, names it: the record keeps where
        its work was done. A Project whose default it was has no default afterwards. Records
        `workspace.removed`. Errors: `forbidden` (not an admin), `conflict`.
      parameters:
        - {$ref: "#/components/parameters/WorkspaceRef"}
        - {$ref: "#/components/parameters/IdempotencyKey"}
      responses:
        "204":
          description: The Workspace is gone.
        default: {$ref: "#/components/responses/Error"}

  # ---------------------------------------------------------------- tasks
  /v1/tasks:
    post:
      operationId: fileTask
      tags: [tasks]
      summary: File a Task, a Subtask under a Parent, or a question beside the Task it blocks
      description: |
        Name `project` for a Task with no Parent, `parent` for a Subtask, or `blocks` for a
        question or Escalation; `project` may be given with the other two, and must then be theirs.

        A Task with no Parent goes to the bottom of its Project's Rank, owned by `owner` or else
        the caller, who must be a Member of the Project. A Task or Subtask waits at `step`, or else
        at the Project's first work Step, by its Workflows' order then their Steps': the first
        carrying a Skill other than those Darkory files its own Subtasks at (`breakdown`,
        `acceptance`, `retro`, `skill-review`), which is Build in a `default` Project; failing that,
        the first Step carrying any Skill; failing that, the first Step. Break down is the
        `breakdown` switch, never where a Task lands by default. At a hold no one is offered it
        until someone moves it on (`moveTask`). Aimed at a Member by name (`aim`), it waits with
        that Member at no Step instead. With `breakdown` it is a Parent from its first moment, at no
        Step: its Breakdown Subtask ("Break down: <title>", kind `breakdown`, filed by nobody) is
        filed with it at the Project's first Step carrying `breakdown`, and whoever takes that files
        its other Subtasks. `auto_complete` and `acceptance` default to the Project's. It names
        `workspaces`, or else the Project's default Workspace, or none when the Project has no
        default.

        A Subtask (`parent`) takes its Parent's Project and Owner, sorts by its Parent's Rank,
        and names its Parent's Workspaces unless `workspaces` says otherwise, since its branch
        starts from its Parent's and merges into it. Its Parent must be open and have no Parent
        of its own. Under a Task nobody holds, any Member of the Project or the Task's Owner may
        file one; under a held Task only its holder, and the write ends their Claim (`split`) and
        adds `note` to the Parent's Notes. The first Subtask makes the Task a Parent: it leaves its
        Step, is aimed at no one, and is never claimed or takeable again. A Task that blocks or is
        blocked by an open Task cannot become a Parent, since a Parent neither blocks nor is
        blocked: remove the Blocking first.

        Naming `blocks` files a question or Escalation: the new Task joins the blocked Task's
        Parent, even an ended one, or stands alone in its Project beside a Task with none, and
        blocks it in the same write; the asker keeps their Claim. Blocking a Task needs its Claim
        while it is held, else its ownership or membership of its Project.

        A Task filed by a Retrospective names it in `from_retrospective` and has no Parent: an
        ended Parent takes no new Subtasks but questions, so a Retrospective files new work as
        Tasks of the Project. Records `task.filed`, and `task.split` and `task.became_parent`
        when they apply, in the same write.

        Errors: `forbidden` (not in the Project or the Owner; no authority over the blocked Task),
        `not_found` (no such Project, Task, Step, Member, Label or Workspace), `invalid` (none of
        `project`, `parent` and `blocks`; a `project` or `parent` other than the blocked Task's;
        `step` with `aim`; `breakdown` with `step`, `aim`, `parent` or `blocks`; `auto_complete`,
        `acceptance` or `from_retrospective` on a Subtask; `note` where no Claim ends; a Label of
        another Project; `from_retrospective` naming a Task that is not a Retrospective),
        `use_parent` (`owner` on a Subtask), `one_level` (the Parent is itself a Subtask), `held`
        (another Member holds the Parent), `ended` (the Parent has ended and the Task blocks
        nothing under it, or the blocked Task has ended), `not_holder` (another Member holds the
        blocked Task), `no_step` (`breakdown` in a Project with no Step carrying `breakdown`, or a
        Project whose Workflows have no Steps), `conflict` (the Parent-to-be blocks or is blocked by
        an open Task; the blocked Task is a Parent), `cycle`.
      parameters:
        - {$ref: "#/components/parameters/IdempotencyKey"}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/FileTaskBody"}
      responses:
        "201":
          description: The new Task.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/TaskDetail"}
        default: {$ref: "#/components/responses/Error"}
    get:
      operationId: listTasks
      tags: [tasks]
      summary: List Tasks
      description: |
        Ordered by Project, then Rank: a Task with no Parent by its own, each Subtask after its
        Parent, by how long it has waited. Every parameter given narrows the list, `filter`
        together with the others.
      parameters:
        - name: project
          in: query
          description: Only Tasks of this Project, by id or key.
          schema: {type: string}
        - name: parent
          in: query
          description: Only the Subtasks of this Task, by id or display key.
          schema: {type: string}
        - name: state
          in: query
          schema: {$ref: "#/components/schemas/TaskState"}
        - name: step
          in: query
          description: Only Tasks at this Step, by id, or by name together with `project`.
          schema: {type: string}
        - name: workflow
          in: query
          description: |
            Only Tasks listed in this Workflow, as each Task's `workflow_id` reads: those at or
            ended at one of its Steps, and the Parents and Tasks aimed at a Member placed in it. By
            id, or by name together with `project`.
          schema: {type: string}
        - name: aimed_at
          in: query
          description: Only Tasks aimed at this Member.
          schema: {type: string}
        - name: holder
          in: query
          description: Only Tasks this Member holds a live Claim on.
          schema: {type: string}
        - {$ref: "#/components/parameters/TaskFilter"}
        - {$ref: "#/components/parameters/Limit"}
        - {$ref: "#/components/parameters/Cursor"}
      responses:
        "200":
          description: The Tasks.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/TaskList"}
        default: {$ref: "#/components/responses/Error"}

  /v1/tasks/takeable:
    get:
      operationId: listTakeableTasks
      tags: [tasks]
      summary: List the Tasks the caller can take now, in the order `next` would offer them
      parameters:
        - {$ref: "#/components/parameters/Limit"}
      responses:
        "200":
          description: The takeable Tasks.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/TaskList"}
        default: {$ref: "#/components/responses/Error"}

  /v1/tasks/next:
    post:
      operationId: nextTask
      tags: [tasks]
      summary: Wait for a takeable Task and claim it
      description: |
        Claims the first Task takeable by the caller, in Rank order across the caller's Projects:
        a Task with no Parent by its own Rank and a Subtask by its Parent's, so a Task ranked first
        in any Project comes before one ranked second in any Project. A tie goes to the Task that
        has waited longest since it was filed or last reached its Step; among one Parent's
        Subtasks, those that block another come first. When none is takeable, holds the request
        open for up to `wait_seconds` and claims one as soon as it becomes takeable; replies 204
        when the wait ends with nothing claimed. The Claim is made as `claimTask` makes it. A
        Member may have a limited number of `next` calls waiting at once (an Install setting, 16
        by default); one more is refused with `too_many_requests`.
      parameters:
        - {$ref: "#/components/parameters/IdempotencyKey"}
      requestBody:
        content:
          application/json:
            schema: {$ref: "#/components/schemas/NextTaskBody"}
      responses:
        "200":
          description: The claimed Task.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/TaskDetail"}
        "204":
          description: Nothing became takeable before the wait ended.
        default: {$ref: "#/components/responses/Error"}

  /v1/tasks/{task}:
    get:
      operationId: getTask
      tags: [tasks]
      summary: Get a Task with its Parent, Subtasks, Step and outcomes, Labels, Claims, Notes, Evidence, Blocking and Observations
      parameters:
        - {$ref: "#/components/parameters/TaskRef"}
      responses:
        "200":
          description: The Task.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/TaskDetail"}
        default: {$ref: "#/components/responses/Error"}

  /v1/tasks/{task}/claim:
    post:
      operationId: claimTask
      tags: [tasks]
      summary: Claim a Task
      description: |
        One conditional write: it succeeds only when the Task is takeable by the caller. It is
        takeable when it is open, has no Subtasks, is not blocked and nobody holds it, and one of
        these holds: it is aimed at the caller; it is at a Step whose Skill the caller has, in one
        of the caller's Projects; it is at a Step carrying `skill-review`, which the caller has,
        in any Project; or the caller owns it and no Member could take it by its Step's Skill
        (none in its Project has that Skill, or, for `skill-review`, none in the Organisation). A
        Member who has held the Task under one Skill can take it again only under that Skill. The
        Claim records the Step's Skill and that Skill's current version (none for a Task aimed at
        the caller), and takes `heartbeat_timeout_seconds`, or else the token's default; with a
        timeout it is bound to the calling Session, without one to the Member. Claiming moves
        nothing: the Task stays at its Step. Records `task.claimed`. Errors: `already_claimed`
        (someone holds it; stop rather than retry), `not_takeable` (a Parent, a Task at a hold,
        a blocked or ended Task, or one the caller may not take).
      parameters:
        - {$ref: "#/components/parameters/TaskRef"}
        - {$ref: "#/components/parameters/IdempotencyKey"}
      requestBody:
        content:
          application/json:
            schema: {$ref: "#/components/schemas/ClaimTaskBody"}
      responses:
        "200":
          description: The claimed Task.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/TaskDetail"}
        default: {$ref: "#/components/responses/Error"}

  /v1/tasks/{task}/heartbeat:
    post:
      operationId: heartbeat
      tags: [tasks]
      summary: Tell Darkory the caller is still working a Task
      description: |
        Extends a Claim that carries a heartbeat timeout. A Heartbeat that arrives after the
        timeout is refused and the reply says `lapsed`; the Member may claim again if the Task is
        still takeable. Writes no Activity. Repeating a Heartbeat is harmless, so its
        `Idempotency-Key` is accepted but not stored: a retry reports the Claim as it is now.
        Errors: `not_holder` (the caller never held this Claim).
      parameters:
        - {$ref: "#/components/parameters/TaskRef"}
        - {$ref: "#/components/parameters/IdempotencyKey"}
      responses:
        "200":
          description: What became of the caller's Claim.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/HeartbeatReply"}
        default: {$ref: "#/components/responses/Error"}

  /v1/tasks/{task}/release:
    post:
      operationId: releaseTask
      tags: [tasks]
      summary: Give up the caller's Claim, leaving the Task at its Step
      description: |
        The Task stays at its Step, takeable again by whoever has the Step's Skill; `note` is
        added to its Notes in the same write. Records `task.released`. Errors: `not_holder`.
      parameters:
        - {$ref: "#/components/parameters/TaskRef"}
        - {$ref: "#/components/parameters/IdempotencyKey"}
      requestBody:
        content:
          application/json:
            schema: {$ref: "#/components/schemas/ReleaseTaskBody"}
      responses:
        "200":
          description: The Task.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Task"}
        default: {$ref: "#/components/responses/Error"}

  /v1/tasks/{task}/nudged:
    post:
      operationId: recordNudge
      tags: [runner]
      summary: Record that the Runner nudged the agent holding a Task
      description: |
        Called by the Runner, through the Session that holds the Task's Claim, after it typed
        its nudge into a Shift whose turn ended with the Task still held and no decision. It
        nudges twice, then releases the Task. Records `task.nudged`, with no actor: Darkory acted,
        as with a lapse. Errors: `not_holder` (the caller's Session does not hold the Task's
        Claim), `invalid`.
      parameters:
        - {$ref: "#/components/parameters/TaskRef"}
        - {$ref: "#/components/parameters/IdempotencyKey"}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/RecordNudgeBody"}
      responses:
        "204":
          description: The nudge is recorded.
        default: {$ref: "#/components/responses/Error"}

  /v1/tasks/{task}/advance:
    post:
      operationId: advanceTask
      tags: [tasks]
      summary: End the caller's work on a Task along a Connector out of its Step
      description: |
        By the Member holding the Task. The Connector is the one out of the Task's Step named
        `outcome`, ignoring case, or the only one when the Step has exactly one and `outcome` is
        left out; otherwise the request is refused with `no_connector`, whose `details.outcomes`
        lists the Step's outcomes. A Task aimed at a Member is at no Step and has no outcomes:
        it is completed instead. `note` is added to the Task's Notes first, under the Skill of the
        Claim, so its context goes with it to the next Step.

        Along a Connector to a Step, the Claim ends `advanced` and the Task waits at that Step,
        from now, for whoever has its Skill; a Member who has held it under one Skill can take it
        again only under that Skill. Records `task.advanced` with `from`, `to` and `outcome`.

        Along a Connector into Done, the Task completes, with everything `completeTask` says
        follows: proposals published from a Step carrying `skill-review`, an Acceptance filed or
        its Parent auto-completed, a Retrospective filed. Errors: `not_holder`, `no_connector`,
        and `forbidden` and `proposal_stale` as on `completeTask`.
      parameters:
        - {$ref: "#/components/parameters/TaskRef"}
        - {$ref: "#/components/parameters/IdempotencyKey"}
      requestBody:
        content:
          application/json:
            schema: {$ref: "#/components/schemas/AdvanceTaskBody"}
      responses:
        "200":
          description: The Task, at its next Step or done.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Task"}
        default: {$ref: "#/components/responses/Error"}

  /v1/tasks/{task}/step:
    post:
      operationId: moveTask
      tags: [tasks]
      summary: Move a Task to a Step of its Project by hand
      description: |
        Puts an open Task that is not a Parent at any Step of any of its Project's Workflows,
        recorded as a move rather than an advance; it is the only way out of a hold. By any Member
        of the Project or the Task's Owner. A held Task may be moved only by whoever may take it
        back (someone on the holder's Reporting line, or the Owner), and the write ends the Claim
        `taken_back` first; anyone else is refused with `held`. A Task aimed at a Member then
        waits at the Step instead. `note` is added to the Task's Notes by the mover, under no
        Skill. Naming the Step the Task is at changes nothing. Records `task.moved` with `from`
        and `to`. Errors: `forbidden` (not in the Project, not the Owner), `held`, `ended`,
        `conflict` (a Parent, which is at no Step), `not_found` (no such Step).
      parameters:
        - {$ref: "#/components/parameters/TaskRef"}
        - {$ref: "#/components/parameters/IdempotencyKey"}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/MoveTaskBody"}
      responses:
        "200":
          description: The Task at its new Step.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Task"}
        default: {$ref: "#/components/responses/Error"}

  /v1/tasks/{task}/complete:
    post:
      operationId: completeTask
      tags: [tasks]
      summary: Complete a Task the caller holds, or a Parent the caller owns
      description: |
        Ends the Task done: `done`, at no Step, with `ended_at`. A Task with no Subtasks is
        completed by the Member holding it, along the one Connector out of its Step into Done;
        when its Step has none or several, the request is refused with `use_advance`, whose
        `details.outcomes` lists the Step's outcomes. A Task aimed at a Member, at no Step,
        completes as it is. The Claim ends `completed`. A Parent is completed by its Owner, who
        needs no Claim, once every Subtask has ended (`tasks_open` while one is open, an
        Acceptance included). `note` is added to the Task's Notes first.

        Completing from a Step carrying `skill-review` publishes every pending Skill proposal on
        the Task as its Skill's next version. When the version one was written against is no
        longer current, the request is refused with `proposal_stale` naming the stale proposals,
        nothing is published, and the Task is advanced back along the Connector named "needs
        changes" (or else the first that leads to a Step) with the refusal as its Note; that
        write is made and the refusal is the reply. A proposal is never published by its author
        (`forbidden`). Completing a Retrospective marks its Parent's unreviewed Observations
        reviewed by it.

        A Subtask ending done may finish its Parent. When the Parent is open and every other
        Subtask has ended: if the Parent has `acceptance` on, its Project has a Step carrying
        `acceptance`, and the Subtask is not itself an Acceptance, Darkory files an Acceptance
        ("Acceptance: <Parent title>", kind `acceptance`, filed by nobody, owned by the Parent's
        Owner) at that Step; otherwise, if the Parent has `auto_complete` on, the Parent completes
        in the same write. A Parent that ends, done or dropped, files its Retrospective
        ("Retrospective: <title>", kind `retrospective`, filed by nobody) at the Project's first
        Step carrying `retro`, when it has one; a Retrospective ending under an ended Parent sets
        off neither rule. Records `task.completed`, and the Parent's entries in the same write.
        Errors: `not_holder`, `use_advance`, `forbidden` (a Parent's Complete by anyone but its
        Owner; the caller wrote a proposal it would publish), `tasks_open`, `ended`,
        `proposal_stale`.
      parameters:
        - {$ref: "#/components/parameters/TaskRef"}
        - {$ref: "#/components/parameters/IdempotencyKey"}
      requestBody:
        content:
          application/json:
            schema: {$ref: "#/components/schemas/CompleteTaskBody"}
      responses:
        "200":
          description: The Task.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Task"}
        default: {$ref: "#/components/responses/Error"}

  /v1/tasks/{task}/drop:
    post:
      operationId: dropTask
      tags: [tasks]
      summary: Drop a Task (Owner)
      description: |
        Ends the Task dropped, at no Step, and ends any Claim on it, even one another Member
        holds. Dropping a Parent drops its open Subtasks and ends their Claims, and files its
        Retrospective as completing does. A Subtask that ends dropped files no Acceptance and
        completes no Parent; an Acceptance that ends dropped files nothing more. Records
        `task.dropped`. Errors: `forbidden` (not the Owner), `ended`.
      parameters:
        - {$ref: "#/components/parameters/TaskRef"}
        - {$ref: "#/components/parameters/IdempotencyKey"}
      requestBody:
        content:
          application/json:
            schema: {$ref: "#/components/schemas/DropTaskBody"}
      responses:
        "200":
          description: The Task.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Task"}
        default: {$ref: "#/components/responses/Error"}

  /v1/tasks/{task}/take-back:
    post:
      operationId: takeBackTask
      tags: [tasks]
      summary: End another Member's Claim on a Task
      description: |
        By a Member on the holder's Reporting line, or by the Task's Owner. The Task stays at its
        Step and is takeable again; the holder's next Heartbeat reports `taken_back`. Records
        `task.taken_back`. Errors: `forbidden`, `not_holder` (nobody holds it).
      parameters:
        - {$ref: "#/components/parameters/TaskRef"}
        - {$ref: "#/components/parameters/IdempotencyKey"}
      requestBody:
        content:
          application/json:
            schema: {$ref: "#/components/schemas/TakeBackTaskBody"}
      responses:
        "200":
          description: The Task.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Task"}
        default: {$ref: "#/components/responses/Error"}

  /v1/tasks/{task}/owner:
    post:
      operationId: passOwnership
      tags: [tasks]
      summary: Pass a Task's ownership, with its Subtasks', to another Member
      description: |
        Makes the Member the Owner of a Task with no Parent and of every Subtask under it, in one
        write. By the Owner, or by a Member on the Owner's Reporting line. Ownership is not a
        Claim: Claims on the Tasks stay as they are. Records `task.owner_passed`. Errors:
        `forbidden`, `use_parent` (a Subtask, whose Owner is its Parent's).
      parameters:
        - {$ref: "#/components/parameters/TaskRef"}
        - {$ref: "#/components/parameters/IdempotencyKey"}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/PassOwnershipBody"}
      responses:
        "200":
          description: The Task under its new Owner.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Task"}
        default: {$ref: "#/components/responses/Error"}

  /v1/tasks/{task}/rank:
    post:
      operationId: rankTask
      tags: [tasks]
      summary: Move a Task to a position in its Project's Rank
      description: |
        For a Task with no Parent; a Subtask sorts by its Parent's. Position 1 is first. A
        position past the end moves the Task last. Ended Tasks keep their places and count as
        positions. By a Member of the Project or the Task's Owner. Records `task.ranked`.
        Errors: `forbidden`, `use_parent` (a Subtask).
      parameters:
        - {$ref: "#/components/parameters/TaskRef"}
        - {$ref: "#/components/parameters/IdempotencyKey"}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/RankTaskBody"}
      responses:
        "200":
          description: The Task in its new place.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Task"}
        default: {$ref: "#/components/responses/Error"}

  /v1/tasks/{task}/labels:
    put:
      operationId: setTaskLabels
      tags: [tasks]
      summary: Set the Labels a Task carries
      description: |
        Replaces the Labels the Task carries with `labels`; an empty list clears them. Each is the
        Task's Project's own or the Organisation's. By a Member of the Project or the Task's
        Owner, open or ended, whoever holds it: Darkory's rules never read a Label. Records
        `task.labels_set` with the Labels added and removed. Errors: `forbidden`, `not_found` (no
        such Label), `invalid` (another Project's Label).
      parameters:
        - {$ref: "#/components/parameters/TaskRef"}
        - {$ref: "#/components/parameters/IdempotencyKey"}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/SetTaskLabelsBody"}
      responses:
        "200":
          description: The Task with its Labels.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Task"}
        default: {$ref: "#/components/responses/Error"}

  /v1/tasks/{task}/pull-request:
    put:
      operationId: setTaskPullRequest
      tags: [tasks]
      summary: Record the pull request a Task's branch lands through
      description: |
        The Runner is its normal writer: it records a pull request it finds open for the Task's
        branch on GitHub, and again one it finds merged. Any Member of the Task's Project may
        write it, and its Owner, whoever holds the Task, open or ended: the next holder may
        already have the Task when the pull request is read. `url` is kept as given once valid:
        the `https` address of pull request `number` itself, `https://<host>/<owner>/<repo>/pull/<number>`
        with no query, fragment or trailing slash, on `github.com` or on the host the server's
        `GH_HOST` names when it is set. An agent's write of `merged` is checked on GitHub through
        the Runner beside this server, when one is attached: the pull request must be merged there
        and its head branch must start with the Task's key, as the Runner names a Task's branches.
        A human's write, a write of `open`, and any write with no Runner attached are not checked.
        Writing the values the Task already carries changes nothing and records nothing. Records
        `task.pull_request_opened` on the first write of `open` and `task.pull_request_merged` on
        a write of `merged`. Errors: `forbidden`, `invalid` (the address is not on GitHub or not
        pull request `number`'s; the Task names no Workspace in `pull_request` mode, through its
        own Workspaces or else its Project's default; the pull request's branch is not the
        Task's), `conflict` (`open` written over a pull request already merged; GitHub has the
        pull request open, not merged).
      parameters:
        - {$ref: "#/components/parameters/TaskRef"}
        - {$ref: "#/components/parameters/IdempotencyKey"}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/SetTaskPullRequestBody"}
      responses:
        "200":
          description: The Task with its pull request.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Task"}
        default: {$ref: "#/components/responses/Error"}

  /v1/tasks/{task}/pull-request/merge:
    post:
      operationId: mergeTaskPullRequest
      tags: [runner]
      summary: Merge a Task's open pull request
      description: |
        The Runner beside this server merges the Task's open pull request on GitHub, as the
        identity its `gh` signs in as, once it has checked there that the pull request numbered
        as the record says has a head branch starting with the Task's key (the Runner names a
        branch from the Task's title when it makes it, so a renamed Task's branch still starts
        with its key) and as its base that branch's own base: the Parent's branch for a Subtask,
        else the Workspace's default branch. One merge of a Task runs at a time; a second request
        waits and then finds the pull request merged. The server then records it merged as the
        caller, with the Note
        "<Workspace>: #<n> merged". Merging is a human's act: allowed to a human Member who is the
        Task's Owner or an admin; an agent is refused, its Owner too. Errors: `forbidden`,
        `no_runner` (no Runner is attached to this server), `not_found` (the Task carries no open
        pull request, or GitHub has none so numbered open), `conflict` (the pull request's head
        or base is not the Task's, or GitHub refused the merge; the message is the Runner's, as
        it read it from `gh`).
      parameters:
        - {$ref: "#/components/parameters/TaskRef"}
        - {$ref: "#/components/parameters/IdempotencyKey"}
      responses:
        "200":
          description: The Task with its pull request merged.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Task"}
        default: {$ref: "#/components/responses/Error"}

  /v1/tasks/{task}/notes:
    post:
      operationId: addNote
      tags: [tasks]
      summary: Add a Note to a Task's running log
      description: |
        On a held Task, by the Member holding it, the Note recording the Skill of their Claim. On
        a Task nobody holds, open or ended, by its Owner or a Member of its Project, the Note
        recording no Skill: such as the Runner noting a merge on a Task it has just seen
        completed. Records `task.note_added`. Errors: `not_holder` (another Member holds the
        Task), `forbidden`.
      parameters:
        - {$ref: "#/components/parameters/TaskRef"}
        - {$ref: "#/components/parameters/IdempotencyKey"}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/AddNoteBody"}
      responses:
        "201":
          description: The Note.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Note"}
        default: {$ref: "#/components/responses/Error"}

  /v1/tasks/{task}/observations:
    post:
      operationId: observe
      tags: [tasks]
      summary: Record an Observation on a Task
      description: |
        By the Member holding the Task; the Observation records the Skill they hold it under. It
        feeds the Retrospective of the Task's Parent. Records `task.observed`. Errors:
        `not_holder`.
      parameters:
        - {$ref: "#/components/parameters/TaskRef"}
        - {$ref: "#/components/parameters/IdempotencyKey"}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/ObserveBody"}
      responses:
        "201":
          description: The Observation.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Observation"}
        default: {$ref: "#/components/responses/Error"}
    get:
      operationId: listTaskObservations
      tags: [tasks]
      summary: List the Observations recorded on a Task and, for a Parent, on its Subtasks
      description: |
        What a Retrospective reads about its Parent: the Parent's Observations are those recorded
        on its Subtasks.
      parameters:
        - {$ref: "#/components/parameters/TaskRef"}
        - name: reviewed
          in: query
          description: |
            Omitted or false: only the Observations no Retrospective has reviewed yet. True: every
            Observation, reviewed or not.
          schema: {type: boolean}
      responses:
        "200":
          description: The Observations, oldest first.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ObservationList"}
        default: {$ref: "#/components/responses/Error"}

  /v1/tasks/{task}/blockers/{blocker}:
    put:
      operationId: addBlocker
      tags: [tasks]
      summary: Let one Task block another
      description: |
        `{blocker}` blocks `{task}`: `{task}` is not takeable until `{blocker}` has ended. The two
        may be under different Parents. A Parent neither blocks nor is blocked. Needs `{task}`'s
        Claim when it is held, else its ownership or membership of its Project. Records
        `task.blocker_added`. Errors: `forbidden`, `not_holder`, `ended`, `conflict` (either is a
        Parent), `cycle` (`{task}` already blocks `{blocker}`, directly or through other Tasks, or
        they are the same Task).
      parameters:
        - {$ref: "#/components/parameters/TaskRef"}
        - {$ref: "#/components/parameters/BlockerRef"}
        - {$ref: "#/components/parameters/IdempotencyKey"}
      responses:
        "204":
          description: The Task is blocked by the blocker.
        default: {$ref: "#/components/responses/Error"}
    delete:
      operationId: removeBlocker
      tags: [tasks]
      summary: Stop one Task blocking another
      description: |
        Needs the same authority as adding the blocker. An open question under an ended Parent
        must keep blocking an open Task, so removing its last such edge is refused with `ended`:
        complete or drop the question instead. Records `task.blocker_removed`. Errors:
        `forbidden`, `not_holder`, `ended`.
      parameters:
        - {$ref: "#/components/parameters/TaskRef"}
        - {$ref: "#/components/parameters/BlockerRef"}
        - {$ref: "#/components/parameters/IdempotencyKey"}
      responses:
        "204":
          description: The Task is no longer blocked by the blocker.
        default: {$ref: "#/components/responses/Error"}

  /v1/tasks/{task}/skill-proposals:
    post:
      operationId: proposeSkillVersion
      tags: [skills]
      summary: Propose a new version of a company Skill from the Retrospective the caller holds
      description: |
        Written against `based_on_version`, which must be the Skill's current version, for a
        company Skill, on a Retrospective the caller holds whose Step has a Connector leading to a
        Step carrying `skill-review`. The caller then advances the Retrospective along it; a
        Member with `skill-review`, other than the author, publishes the proposals by advancing
        it into Done. A Task carries one pending proposal per Skill: a new one for the same Skill
        supersedes it, and one for another Skill stands beside it. Records `task.skill_proposed`.
        Errors: `not_holder`, `forbidden` (not a Retrospective), `no_step` (no Connector leads
        from its Step to a Step carrying `skill-review`), `proposal_stale`, `invalid` (not a
        company Skill).
      parameters:
        - {$ref: "#/components/parameters/TaskRef"}
        - {$ref: "#/components/parameters/IdempotencyKey"}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/ProposeSkillVersionBody"}
      responses:
        "201":
          description: The proposal.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/SkillProposal"}
        default: {$ref: "#/components/responses/Error"}

  /v1/tasks/{task}/evidence:
    post:
      operationId: attachTaskEvidence
      tags: [evidence]
      summary: Attach Evidence to a Task
      description: |
        The request body is the file itself, sent with its own `Content-Type` and a
        `Content-Length`; the Install's limit is 100 MiB unless set otherwise. Needs the Task's
        Claim while it is held, else its ownership or membership of its Project. Evidence about a
        Parent as a whole is attached to the Parent. `kind=log` is a Shift's terminal log, which
        the Runner attaches when the Shift ends. Records `task.evidence_attached` with `kind`.
        Errors: `not_holder`, `forbidden`, `too_large`.
      parameters:
        - {$ref: "#/components/parameters/TaskRef"}
        - {$ref: "#/components/parameters/EvidenceFilename"}
        - {$ref: "#/components/parameters/EvidenceKind"}
        - {$ref: "#/components/parameters/IdempotencyKey"}
      requestBody:
        required: true
        content:
          "*/*":
            schema: {type: string, format: binary}
      responses:
        "201":
          description: The Evidence record.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Evidence"}
        default: {$ref: "#/components/responses/Error"}

  # ---------------------------------------------------------------- evidence
  /v1/evidence/{evidence}:
    get:
      operationId: getEvidence
      tags: [evidence]
      summary: Get an Evidence record
      parameters:
        - {$ref: "#/components/parameters/EvidenceID"}
      responses:
        "200":
          description: The Evidence record.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/Evidence"}
        default: {$ref: "#/components/responses/Error"}

  /v1/evidence/{evidence}/content:
    get:
      operationId: downloadEvidence
      tags: [evidence]
      summary: Download an Evidence file
      description: |
        Served with the content type it was attached with, always as an attachment and with
        `X-Content-Type-Options: nosniff`, so a browser never renders an uploaded page.
      parameters:
        - {$ref: "#/components/parameters/EvidenceID"}
      responses:
        "200":
          description: The file.
          headers:
            Content-Disposition:
              description: "`attachment`, with the file's name."
              schema: {type: string}
            X-Content-Type-Options:
              schema: {type: string, enum: [nosniff]}
          content:
            "*/*":
              schema: {type: string, format: binary}
        default: {$ref: "#/components/responses/Error"}

  # ---------------------------------------------------------------- files
  /v1/files:
    post:
      operationId: uploadFile
      tags: [files]
      summary: Upload a file the Organisation keeps, such as an avatar
      description: |
        The request body is the file itself with a `Content-Length`, as Evidence is sent. The
        server finds the file's type by reading its bytes and keeps that, never the
        `Content-Type` the request claims. Any Member may upload; the file belongs to the
        caller's Organisation, and every Member of it can read it. The Install's limit is 10 MiB
        unless set otherwise.

        With `purpose=avatar` the file must be a PNG, JPEG, WebP or GIF image of at most 2 MiB
        (never SVG or HTML, which can carry script); the server keeps the largest square in its
        middle, scaled down to 256 pixels a side, re-encoded as PNG. Only the pixels are kept:
        metadata such as EXIF goes, and a GIF keeps its first frame. Records `file.uploaded`.
        Errors: `too_large`, `invalid` (not an image an avatar can be).
      parameters:
        - {$ref: "#/components/parameters/FileName"}
        - name: purpose
          in: query
          description: What the file is for; `general` unless said.
          schema: {$ref: "#/components/schemas/FilePurpose"}
        - {$ref: "#/components/parameters/IdempotencyKey"}
      requestBody:
        required: true
        content:
          "*/*":
            schema: {type: string, format: binary}
      responses:
        "201":
          description: The file's record.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/File"}
        default: {$ref: "#/components/responses/Error"}

  /v1/files/{file}:
    get:
      operationId: getFile
      tags: [files]
      summary: Get a file's record
      description: Any Member of the file's Organisation; a deleted file, or another Organisation's, is `not_found`.
      parameters:
        - {$ref: "#/components/parameters/FileID"}
      responses:
        "200":
          description: The file's record.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/File"}
        default: {$ref: "#/components/responses/Error"}
    delete:
      operationId: deleteFile
      tags: [files]
      summary: Delete a file (its uploader, or an admin)
      description: |
        Its bytes are removed and its id is never reused. Records `file.deleted`. Errors:
        `forbidden`, `conflict` (the file is a Member's avatar: change or remove that first).
      parameters:
        - {$ref: "#/components/parameters/FileID"}
        - {$ref: "#/components/parameters/IdempotencyKey"}
      responses:
        "204": {description: Deleted.}
        default: {$ref: "#/components/responses/Error"}

  /v1/files/{file}/content:
    get:
      operationId: downloadFile
      tags: [files]
      summary: Download a file's bytes
      description: |
        Any Member of the file's Organisation. Served with the type the server found in the
        bytes and `X-Content-Type-Options: nosniff`: inline for a PNG, JPEG, WebP or GIF image,
        so an `<img>` can show it, and as an attachment for anything else. A file's bytes never
        change, so the response carries an `ETag` of its SHA-256 and may be cached privately for
        a year; `If-None-Match` with that ETag answers 304.
      parameters:
        - {$ref: "#/components/parameters/FileID"}
        - name: If-None-Match
          in: header
          schema: {type: string}
      responses:
        "200":
          description: The bytes.
          headers:
            Content-Disposition:
              description: "`inline` for an image, else `attachment`, with the file's name."
              schema: {type: string}
            ETag:
              schema: {type: string}
            X-Content-Type-Options:
              schema: {type: string, enum: [nosniff]}
          content:
            "*/*":
              schema: {type: string, format: binary}
        "304": {description: The copy the client holds is current.}
        default: {$ref: "#/components/responses/Error"}

  # ---------------------------------------------------------------- activity
  /v1/activity:
    get:
      operationId: listActivity
      tags: [activity]
      summary: Read Activity after, or before, a sequence number
      description: |
        Activity is numbered per Organisation in commit order. Pass the `last_seq` of one page as
        `after` to read the next. To read backwards, pass `before`: the page holds the `limit`
        entries numbered just below it, still in sequence order, and its `first_seq` is the
        `before` of the page before it. A `before` past the newest entry (such as
        9007199254740991) reads the latest page. `member`, `kind`, `project` and `task` keep only
        the matching entries, all of them together; the page is then the `limit` matching entries after `after` or just
        below `before`, and its `first_seq` and `last_seq` are theirs.
      parameters:
        - name: after
          in: query
          description: Return entries with a sequence number greater than this. Defaults to 0.
          schema: {type: integer, format: int64, minimum: 0}
        - name: before
          in: query
          description: Return the entries with a sequence number below this, closest first.
          schema: {type: integer, format: int64, minimum: 1}
        - name: member
          in: query
          description: |
            Only entries this Member (id or name) acted in, or that ended a Claim they held: a
            lapse, a take-back, a move, a drop, a revoked token, a closed Session or a
            deactivation.
          schema: {type: string}
        - name: kind
          in: query
          description: Only entries of these kinds; repeat it for several.
          style: form
          explode: true
          schema:
            type: array
            items: {$ref: "#/components/schemas/ActivityKind"}
        - name: project
          in: query
          description: |
            Only entries about this Project (id or key): the Project itself, its Workflows, its own
            Labels, or a Task of it.
          schema: {type: string}
        - name: task
          in: query
          description: |
            Only entries about this Task (id or key): those whose subject is the Task, and for a
            Parent its Subtasks' too, the ones filed after the request included. Errors:
            `not_found` (no such Task).
          schema: {type: string}
        - {$ref: "#/components/parameters/Limit"}
      responses:
        "200":
          description: The entries, in sequence order.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ActivityPage"}
        default: {$ref: "#/components/responses/Error"}

  /v1/activity/stream:
    get:
      operationId: streamActivity
      tags: [activity]
      summary: Stream Activity as Server-Sent Events
      description: |
        Each entry is one event: `id` is its sequence number, `event` is `activity` and `data` is
        the `Activity` as JSON. A reconnecting client sends `Last-Event-ID` (or `after`, for
        clients that cannot set headers) and receives every entry after it; `0` sends the whole
        history. With neither, the stream starts from now: it sends only entries written after
        it opened. It opens with the comment `: connected` and sends `: keep-alive` while idle;
        clients skip comments. A Member may have a limited number of streams open at once (an Install
        setting, 16 by default); one more is refused with `too_many_requests`.
      parameters:
        - name: Last-Event-ID
          in: header
          schema: {type: integer, format: int64, minimum: 0}
        - name: after
          in: query
          description: Used when `Last-Event-ID` is absent.
          schema: {type: integer, format: int64, minimum: 0}
      responses:
        "200":
          description: The event stream.
          content:
            text/event-stream:
              schema: {type: string}
        default: {$ref: "#/components/responses/Error"}

  # ---------------------------------------------------------------- runner
  /v1/runner/sessions:
    get:
      operationId: listRunnerSessions
      tags: [runner]
      summary: List the Shifts the Runner is running now
      description: |
        A read model of the Runner beside this server, not part of the record: what it runs now,
        one Shift per Task it holds a Claim on for an agent. With no Runner attached to this
        server (as with `serve --runner=off`) it answers `runner: false` and no Shifts, not an
        error, so a page can poll it.
      responses:
        "200":
          description: The Shifts, oldest first.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/RunnerSessionList"}
        default: {$ref: "#/components/responses/Error"}

  /v1/runner/sessions/{task}/nudge:
    post:
      operationId: nudgeRunnerSession
      tags: [runner]
      summary: Nudge the agent in a Task's Shift to end the Task (admin)
      description: |
        Types the Runner's nudge into the Shift: advance the Task, complete it, or file a
        question. Errors: `forbidden` (not an admin), `no_runner`, `not_found` (no Shift on the
        Task).
      parameters:
        - {$ref: "#/components/parameters/TaskRef"}
        - {$ref: "#/components/parameters/IdempotencyKey"}
      responses:
        "204":
          description: The nudge was sent.
        default: {$ref: "#/components/responses/Error"}

  /v1/runner/sessions/{task}/stop:
    post:
      operationId: stopRunnerSession
      tags: [runner]
      summary: Stop a Task's Shift (admin)
      description: |
        Ends the agent's Shift and releases its Claim with a Note, as when a Shift ends
        without a decision; the Shift's log is attached as Evidence. Errors: `forbidden` (not an
        admin), `no_runner`, `not_found` (no Shift on the Task).
      parameters:
        - {$ref: "#/components/parameters/TaskRef"}
        - {$ref: "#/components/parameters/IdempotencyKey"}
      responses:
        "204":
          description: The Shift is stopping.
        default: {$ref: "#/components/responses/Error"}

  /v1/runner/sessions/{task}/terminal:
    get:
      operationId: runnerTerminal
      tags: [runner]
      summary: Watch or join a Task's Shift through a terminal (WebSocket)
      description: |
        Upgrades to a WebSocket bridged to the Shift's terminal (`tmux attach`). Binary
        messages carry the terminal's bytes both ways; a text message `{"cols": n, "rows": n}`
        resizes the client's view. Admins may type unless they ask for `readonly`; every other
        Member only watches, and what they send is ignored. Authenticated as every operation is,
        by a bearer token with its Session or by the browser cookie; a browser's upgrade must
        come from this Install's own origin. The Runner adds a Note on the Task when someone
        joins. Errors, before the upgrade: `no_runner`, `not_found` (no Shift on the Task),
        `conflict` (the Shift runs without tmux and cannot be joined), `forbidden` (another
        origin).
      parameters:
        - {$ref: "#/components/parameters/TaskRef"}
        - name: readonly
          in: query
          description: Watch without typing, even as an admin.
          schema: {type: boolean}
      responses:
        "101":
          description: Switched to the WebSocket protocol; the terminal follows.
        default: {$ref: "#/components/responses/Error"}

  # ---------------------------------------------------------------- views
  /v1/views:
    get:
      operationId: listViews
      tags: [views]
      summary: List the caller's Views
      description: |
        A View is a saved set of filters, sort and display for a list, kept by one Member for
        themselves; nobody else, an admin included, sees or changes it. Oldest first.
      parameters:
        - name: entity
          in: query
          description: Only Views of this list.
          schema: {$ref: "#/components/schemas/ViewEntity"}
        - name: project
          in: query
          description: Only Views of this Project's list, by id or key.
          schema: {type: string}
      responses:
        "200":
          description: The caller's Views.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/ViewList"}
        default: {$ref: "#/components/responses/Error"}
    post:
      operationId: createView
      tags: [views]
      summary: Save a View
      description: |
        `filters` are `filter` tokens of the entity's list (`listTasks`), checked as the list
        checks them. A View is a Member's preference, not the record: saving, changing or
        deleting one records no Activity. Errors: `conflict` (the caller has a View of that name
        for the same list, ignoring case), `not_found` (no such Project), `invalid`.
      parameters:
        - {$ref: "#/components/parameters/IdempotencyKey"}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/CreateViewBody"}
      responses:
        "201":
          description: The new View.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/View"}
        default: {$ref: "#/components/responses/Error"}

  /v1/views/{view}:
    patch:
      operationId: updateView
      tags: [views]
      summary: Change one of the caller's Views
      description: |
        Replaces the fields given and keeps the others; `sort: ""` clears the sort. The list a
        View is of (entity and Project) never changes. Errors: `not_found` (no View of the
        caller's with that id), `conflict` (name taken), `invalid`.
      parameters:
        - {$ref: "#/components/parameters/ViewID"}
        - {$ref: "#/components/parameters/IdempotencyKey"}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/UpdateViewBody"}
      responses:
        "200":
          description: The View.
          content:
            application/json:
              schema: {$ref: "#/components/schemas/View"}
        default: {$ref: "#/components/responses/Error"}
    delete:
      operationId: deleteView
      tags: [views]
      summary: Delete one of the caller's Views
      description: "Errors: `not_found` (no View of the caller's with that id)."
      parameters:
        - {$ref: "#/components/parameters/ViewID"}
        - {$ref: "#/components/parameters/IdempotencyKey"}
      responses:
        "204":
          description: The View is gone.
        default: {$ref: "#/components/responses/Error"}

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: A Member token, `dk_…`. Sent together with `Darkory-Session`.
    sessionHeader:
      type: apiKey
      in: header
      name: Darkory-Session
      description: The id the running copy chose for its Session. Required with a bearer token.
    cookieAuth:
      type: apiKey
      in: cookie
      name: darkory_session
      description: The browser Session, set by redeeming a login link.

  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      description: |
        A key unique to this write. A retry with the same key returns the first response. It is 1
        to 255 printable ASCII characters, without spaces; any other is refused with `invalid`.
      schema: {type: string, minLength: 1, maxLength: 255, pattern: "^[!-~]+$"}
    MemberRef:
      name: member
      in: path
      required: true
      description: Member id or name.
      schema: {type: string}
    ProjectRef:
      name: project
      in: path
      required: true
      description: Project id or key, such as `MAIN`.
      schema: {type: string}
    SkillRef:
      name: skill
      in: path
      required: true
      description: Skill id or name.
      schema: {type: string}
    TaskRef:
      name: task
      in: path
      required: true
      description: Task id or display key, such as `MAIN-42`.
      schema: {type: string}
    BlockerRef:
      name: blocker
      in: path
      required: true
      description: Id or display key of the blocking Task.
      schema: {type: string}
    TokenID:
      name: token
      in: path
      required: true
      schema: {type: string, format: id}
    WorkspaceRef:
      name: workspace
      in: path
      required: true
      description: Workspace id or name.
      schema: {type: string}
    LabelID:
      name: label
      in: path
      required: true
      description: Label id.
      schema: {type: string, format: id}
    EvidenceID:
      name: evidence
      in: path
      required: true
      schema: {type: string, format: id}
    FileID:
      name: file
      in: path
      required: true
      schema: {type: string, format: id}
    FileName:
      name: name
      in: query
      required: true
      description: The file's name, as it should be shown and downloaded.
      schema: {type: string, minLength: 1, maxLength: 255}
    ProposalID:
      name: proposal
      in: path
      required: true
      schema: {type: string, format: id}
    SessionID:
      name: session
      in: path
      required: true
      description: The id the running copy chose for its Session.
      schema: {type: string, format: id}
    LoginCode:
      name: code
      in: path
      required: true
      schema: {type: string}
    EvidenceFilename:
      name: filename
      in: query
      required: true
      description: The file's name, as it should be shown and downloaded.
      schema: {type: string, minLength: 1, maxLength: 255}
    EvidenceKind:
      name: kind
      in: query
      description: What the file is; `evidence` unless given.
      schema: {$ref: "#/components/schemas/EvidenceKind"}
    Limit:
      name: limit
      in: query
      description: At most this many items. Defaults to 100.
      schema: {type: integer, minimum: 1, maximum: 500}
    Cursor:
      name: cursor
      in: query
      description: The `next_cursor` of the previous page.
      schema: {type: string}
    TaskFilter:
      name: filter
      in: query
      style: form
      explode: true
      description: |
        Repeatable: `filter=<field>:<op>:<v1>,<v2>…`. Several `filter`s all apply (AND), together
        with the other parameters; `in` and `nin` match any of their values (OR). Each value is
        percent-encoded on its own before the values are joined with `,` (so `,`, `:`, `%` and
        `+` inside a value travel as `%2C`, `%3A`, `%25` and `%2B`), and the token is then
        query-encoded as usual. References are ids, not names, in either form (see Ids); an id
        that names nothing matches nothing. A View's saved filters come back with short ids.

        Operators: `is`, `not` (one value), `in`, `nin` (one or more) on enum, reference and
        boolean fields; on numbers those and `lte`, `gte` (one value, both ends included);
        `contains` (one value) on text; on dates `before` (earlier than), `after` (later than),
        `gte`, `lte` (one value), `btw` (two values, both ends included, the earlier first) and
        `last` (`7d`, `30d` or `90d`: at or after the server's now less that many days). A date
        is RFC 3339 with its offset, to the millisecond, such as
        `2026-10-07T09:00:00.000+11:00`; a day picked in a browser is sent as its local bounds,
        `btw:2026-10-04T00:00:00.000+11:00,2026-10-04T23:59:59.999+11:00`. `not` and `nin` also
        match a Task with no value for the field (`step:not:<id>` matches a Task at no Step: a
        Parent, a Task aimed at a Member, an ended Task; `workflow:not:<id>` matches a Task with no
        `workflow_id`: a Task aimed at a Member that blocks no Task at a Step and has no Parent
        placed, an ended Task whose last Step was since deleted), and on a field with several values (`label`, `workspace`) match a Task none of
        whose values is one given.

        Fields: `project` (Project id) · `step` (Step id the Task is at) · `workflow` (Workflow
        id the Task is listed in, as its `workflow_id` reads) · `skill` (Skill id
        carried by the Task's Step; a hold carries none) · `label` (Label id the Task carries) ·
        `parent` (Task id of the Task's Parent, or `none` for a Task with no Parent) · `top`
        (`true`: a Task with no Parent, as `parent:is:none`; `false`: a Subtask) · `holder`
        (Member id holding a live Claim, or `none` for no live Claim) · `aimed_at` (Member id) ·
        `owner` (Member id owning the Task) · `filed_by` (Member id; the Subtasks Darkory files
        itself have none) · `blocked` (`true`: an open Task blocks it) · `blocks` (`true`: it is
        open and blocks an open Task) · `kind` (`work`, `breakdown`, `acceptance`,
        `retrospective`, or `question`: a work Task aimed at a Member; `work` is a work Task aimed
        at nobody) · `claim` (`held`: a live Claim; `unheld`: none, as `holder:is:none`;
        `lapsed`: a Claim of the Task lapsed within the last 24 hours; `session`: the Runner
        beside this server runs a Shift for it now, as `listRunnerSessions` lists) ·
        `takeable_by` (`agents`: an active agent could take it by its Step's Skill, being a
        Member of its Project with that Skill, or for `skill-review` any Member of the
        Organisation with it; `humans`: likewise a human; `both`: an agent and a human could) ·
        `rank` (a number, its place in its Project's Rank, 1 first; a Subtask's is its Parent's)
        · `auto_complete` (`true`, `false`) · `acceptance` (`true`, `false`) · `workspace`
        (Workspace id the Task names) · `model` (the live Claim's model label) · `filed_at` (when
        it was filed) · `completed_at` (when it ended done; a dropped Task has none) · `ended_at`
        (when it ended, done or dropped) · `q` (`contains`, ignoring case, over the key and the
        title) · `pull_request` (`open`, `merged`, or `none`: no pull request recorded).

        Example: `filter=step:in:<id>,<id>&filter=holder:is:none&filter=filed_at:last:7d`. An
        unknown field, an operator the field does not take, the wrong number of values or a value
        the field cannot hold is refused with `invalid`, naming the token. At most 50 `filter`s
        of at most 100 values each.
      schema:
        type: array
        maxItems: 50
        items: {type: string, minLength: 1}
    ViewID:
      name: view
      in: path
      required: true
      schema: {type: string, format: id}

  responses:
    Error:
      description: The request failed.
      content:
        application/json:
          schema: {$ref: "#/components/schemas/Error"}

  schemas:
    # ------------------------------------------------------------ ids
    ID:
      type: string
      format: id
      pattern: "^[1-9A-HJ-NP-Za-km-z]{22}$"
      description: |
        An id as a response writes it, and what `format: id` means wherever it appears: a UUID in
        its short form, 22 characters of base58 (Bitcoin alphabet, in ASCII order), the UUID's
        128 bits as one number left-padded with `1`. A request may send either this or the
        UUID's canonical 36-character text. The one exception is a Session's id, which its
        running copy chose: written short when it is a UUID, unchanged otherwise.
      example: 1CTuJUrXDEC71Dv55PHKrq

    # ------------------------------------------------------------ errors
    Error:
      type: object
      required: [code, message]
      properties:
        code: {$ref: "#/components/schemas/ErrorCode"}
        message:
          type: string
          description: For people; may change between releases.
        details:
          type: object
          additionalProperties: true
          description: |
            Extra facts about the failure, by code. `no_connector` and `use_advance` carry
            `outcomes`: the names of the Connectors out of the Task's Step, in order, so a caller
            can choose one. `proposal_stale` from an advance or a Complete carries `proposals`:
            the ids of the proposals no longer written against their Skill's current version.
    ErrorCode:
      type: string
      description: |
        Stable reason for a failure, with its HTTP status:
        `invalid` 400 · `unauthenticated` 401 · `session_required` 401 · `forbidden` 403 ·
        `not_found` 404 · `conflict` 409 · `already_claimed` 409 · `not_takeable` 409 ·
        `not_holder` 409 · `ended` 409 · `tasks_open` 409 · `cycle` 409 · `proposal_stale` 409 ·
        `no_connector` 409 · `use_advance` 409 · `no_step` 409 · `one_level` 409 · `held` 409 ·
        `step_in_use` 409 · `use_parent` 409 · `no_runner` 409 · `too_large` 413 ·
        `idempotency_key_reused` 422 · `too_many_requests` 429 · `internal` 500 ·
        `not_implemented` 501.

        `no_connector`: the Task's Step has no Connector of the outcome named, or several and none
        was named. `use_advance`: Complete was asked of a Task whose Step has no Connector or
        several into Done. `no_step`: the Project has no Step the request needs (one carrying
        `breakdown` for Break down, or any Step to file at), or no Connector leads from a
        Retrospective's Step to one carrying `skill-review`. `one_level`: a Subtask has no
        Subtasks of its own. `held`: another Member holds the Task, and only its holder, or
        whoever may take it back, may do this. `step_in_use`: a Step being deleted has open Tasks
        at it and nothing says where they go. `use_parent`: a Subtask takes this from its Parent
        (its Owner, its Rank); ask it of the Parent.
      enum:
        - invalid
        - unauthenticated
        - session_required
        - forbidden
        - not_found
        - conflict
        - already_claimed
        - not_takeable
        - not_holder
        - ended
        - tasks_open
        - cycle
        - proposal_stale
        - no_connector
        - use_advance
        - no_step
        - one_level
        - held
        - step_in_use
        - use_parent
        - no_runner
        - too_large
        - idempotency_key_reused
        - too_many_requests
        - internal
        - not_implemented

    # ------------------------------------------------------------ install
    Health:
      type: object
      required: [status, version, sign_in_modes]
      properties:
        status:
          type: string
          enum: [ok]
        version:
          type: string
          description: The server's release version.
        sign_in_modes:
          type: array
          description: How humans sign in to this Install.
          items: {$ref: "#/components/schemas/SignInMode"}
        update_available:
          type: boolean
          description: |
            True when a newer release than `version` exists. Absent when the server has not
            checked: a development build, or checks turned off with DARKORY_NO_UPDATE_CHECK.
        latest_version:
          type: string
          description: The newest release the server knows of. Absent when it has not checked.
    SignInMode:
      type: string
      description: |
        `printed_link`: one-time login links, printed by `darkory serve` and issued by admins.
        `email_link`: login links emailed on request. More modes may be added within `/v1`.
      enum: [printed_link, email_link]
      x-enum-varnames: [SignInPrintedLink, SignInEmailLink]
    Organisation:
      type: object
      required: [id, name, created_at]
      properties:
        id: {type: string, format: id}
        name: {type: string}
        created_at: {type: string, format: date-time}
    OrganisationBrief:
      type: object
      description: An Organisation named by its id and name.
      required: [id, name]
      properties:
        id: {type: string, format: id}
        name: {type: string}
    Me:
      type: object
      required: [organisation, member, projects, skills, session]
      properties:
        organisation: {$ref: "#/components/schemas/Organisation"}
        member: {$ref: "#/components/schemas/Member"}
        projects:
          type: array
          description: The Projects the caller is a Member of, by name.
          items: {$ref: "#/components/schemas/Project"}
        skills:
          type: array
          items: {$ref: "#/components/schemas/Skill"}
        session: {$ref: "#/components/schemas/Session"}
        organisations:
          type: array
          description: |
            The Organisations the caller's sign-in reaches, the current one included, by name,
            for switching between them. Absent on Local, which holds exactly one.
          items: {$ref: "#/components/schemas/OrganisationBrief"}

    # ------------------------------------------------------------ sign-in and Sessions
    Session:
      type: object
      required: [id, member_id, kind, started_at, last_seen_at]
      properties:
        id:
          type: string
          format: id
          description: The id the running copy chose.
        member_id: {type: string, format: id}
        kind: {$ref: "#/components/schemas/SessionKind"}
        token_id:
          type: string
          format: id
          description: The token the Session presents. Absent for browser Sessions.
        started_at: {type: string, format: date-time}
        last_seen_at: {type: string, format: date-time}
        expires_at:
          type: string
          format: date-time
          description: |
            When an open browser Session ends unless it is used before: after a time unused, and
            at the latest a time after it started. Absent for token Sessions, which end when
            closed, when their token is revoked, or after the Install's idle limit without a
            request (see `listSessions`).
        closed_at:
          type: string
          format: date-time
          description: When the Session was closed. Absent while it is open, and for a browser Session that expired.
        ended_at:
          type: string
          format: date-time
          description: |
            When the Session ended, however it ended: `closed_at`, or the moment a browser
            Session expired or a token Session reached the idle limit. Absent while it is open.
    SessionState:
      type: string
      description: "`open`: the Session can still make requests. `ended`: it cannot; a request with its id starts a new Session."
      enum: [open, ended]
      x-enum-varnames: [SessionOpen, SessionEnded]
    SessionList:
      type: object
      required: [items, open, ended]
      properties:
        items:
          type: array
          items: {$ref: "#/components/schemas/Session"}
        next_cursor:
          type: string
          description: Pass as `cursor` for the next page. Absent on the last page.
        open:
          type: integer
          description: How many of the Member's Sessions are open.
        ended:
          type: integer
          description: How many of the Member's Sessions have ended.
    SessionKind:
      type: string
      enum: [token, browser]
    ClosedSession:
      type: object
      required: [session, claims_ended]
      properties:
        session: {$ref: "#/components/schemas/Session"}
        claims_ended:
          type: integer
          description: How many Claims bound to the Session were ended.
    LoginLink:
      type: object
      required: [url, expires_at]
      properties:
        url:
          type: string
          description: Open once in a browser to sign in.
        expires_at: {type: string, format: date-time}
    EmailSignInBody:
      type: object
      required: [email]
      properties:
        email: {type: string, format: email}

    # ------------------------------------------------------------ tokens
    Token:
      type: object
      required: [id, member_id, name, prefix, created_at]
      properties:
        id: {type: string, format: id}
        member_id: {type: string, format: id}
        name: {type: string}
        prefix:
          type: string
          description: The first characters of the secret, to tell tokens apart.
        default_heartbeat_timeout_seconds:
          type: integer
          description: The heartbeat timeout `claim` and `next` use when the call names none. Absent when Claims have none by default.
        created_at: {type: string, format: date-time}
        last_used_at: {type: string, format: date-time}
        revoked_at: {type: string, format: date-time}
    IssuedToken:
      type: object
      required: [token, secret]
      properties:
        token: {$ref: "#/components/schemas/Token"}
        secret:
          type: string
          description: The bearer credential, `dk_…`. Shown only in this reply.
    TokenList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: {$ref: "#/components/schemas/Token"}
    IssueTokenBody:
      type: object
      required: [name]
      properties:
        name: {type: string, minLength: 1, maxLength: 100}
        default_heartbeat_timeout_seconds:
          type: integer
          minimum: 1
          maximum: 86400

    # ------------------------------------------------------------ members
    Member:
      type: object
      required: [id, name, kind, admin, created_at]
      properties:
        id: {type: string, format: id}
        name: {type: string}
        kind: {$ref: "#/components/schemas/MemberKind"}
        email: {type: string}
        admin:
          type: boolean
          description: Admins create Members, Projects, Skills and the Organisation's Labels, set Workflows and Reporting lines, and issue tokens and login links.
        manager_id:
          type: string
          format: id
          description: The Member who directs this one. Absent when there is no Reporting line.
        created_at: {type: string, format: date-time}
        deactivated_at:
          type: string
          format: date-time
          description: When an admin deactivated the Member. Absent while the Member is active.
        agent:
          $ref: "#/components/schemas/AgentSettings"
        avatar_file_id:
          type: string
          format: id
          description: |
            The file shown in place of the Member's initials, at `/v1/files/{id}/content`: a PNG
            at most 256 pixels square. Absent when the Member has none.
    MemberKind:
      type: string
      enum: [human, agent]
    MemberDetail:
      type: object
      required: [member, projects, skills, reports]
      properties:
        member: {$ref: "#/components/schemas/Member"}
        projects:
          type: array
          description: The Projects the Member is in, by name.
          items: {$ref: "#/components/schemas/Project"}
        skills:
          type: array
          items: {$ref: "#/components/schemas/Skill"}
        reports:
          type: array
          description: The Members this Member directs.
          items: {$ref: "#/components/schemas/Member"}
    MemberList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: {$ref: "#/components/schemas/Member"}
    CreateMemberBody:
      type: object
      required: [name, kind]
      properties:
        name: {type: string, minLength: 1, maxLength: 100}
        kind: {$ref: "#/components/schemas/MemberKind"}
        email: {type: string, format: email}
        admin: {type: boolean}
    UpdateMemberBody:
      type: object
      properties:
        name: {type: string, minLength: 1, maxLength: 100}
        email: {type: string, format: email}
        admin: {type: boolean}
        avatar_file_id:
          type: string
          format: id
          description: A file uploaded with `purpose=avatar`; `""` removes the avatar.
    AgentSettings:
      type: object
      description: |
        How the Runner starts an agent Member's Shifts. Absent for humans, and for agents the
        Runner does not start (an agent working from elsewhere, through its own token). `command`
        is the program and `args` its arguments; in each, the Runner replaces `{session_id}` (the
        id of the Session it chooses for the Shift), `{model}`, `{prompt_file}` (the prompt it writes from the record),
        `{mcp_config}` (a config file pointing at `darkory mcp`), `{workspace}` (the Shift's
        directory) and `{task}` (the Task's display key). The defaults start Claude Code:
        `claude --session-id {session_id} --model {model} --dangerously-skip-permissions
        --mcp-config {mcp_config} --append-system-prompt-file {prompt_file}`. Every Member can
        read these settings, `env` included: keep secrets in the server's own environment and
        name them in its `DARKORY_RUNNER_ENV` (comma-separated). A Shift takes only those, `env`
        and a few variables of the server's (`PATH`, `HOME`, `USER`, `LOGNAME`, `SHELL`, `LANG`,
        `LC_*`, `TERM`, `TMPDIR`, `TZ`, `SSH_AUTH_SOCK`, the proxy variables, `ANTHROPIC_*`).
      required: [command, args, model, env, unattended, paused, shifts]
      properties:
        command:
          type: string
          description: The program to start, such as `claude`.
        args:
          type: array
          description: Its arguments, each a template.
          items: {type: string}
        model:
          type: string
          description: The model the agent runs on, passed as `{model}` and reported as the Claim's model label.
        env:
          type: object
          description: Variables added to the Shift's environment, besides `DARKORY_URL`, `DARKORY_TOKEN` and `DARKORY_SESSION`.
          additionalProperties: {type: string}
        unattended:
          type: boolean
          description: The Shift runs with the agent's permission checks skipped; the worktree and the exit rules are the fence.
        paused:
          type: boolean
          description: The Runner starts no new Shift for the agent; one running carries on.
        shifts:
          type: integer
          minimum: 1
          maximum: 8
          description: How many Shifts the Runner runs for the agent at once, one Session and one Claim each; 1 unless set.
        progress_file:
          type: string
          description: |
            The file whose modified time shows the Shift making progress, for a command other
            than Claude Code (whose transcript the Runner finds itself); it may use the same
            placeholders. The Runner sends Heartbeats only while it changes.
    SetAgentSettingsBody:
      type: object
      description: The settings to change; those left out stay as they are. `progress_file` set to `""` clears it.
      properties:
        command: {type: string, minLength: 1, maxLength: 1000}
        args:
          type: array
          maxItems: 100
          items: {type: string, maxLength: 1000}
        model: {type: string, minLength: 1, maxLength: 200}
        env:
          type: object
          description: The whole set of variables, replacing the one there.
          additionalProperties: {type: string}
        unattended: {type: boolean}
        paused: {type: boolean}
        shifts: {type: integer, minimum: 1, maximum: 8}
        progress_file: {type: string, maxLength: 1000}
    SetManagerBody:
      type: object
      required: [manager]
      properties:
        manager:
          type: string
          description: Member id or name.

    # ------------------------------------------------------------ projects
    Project:
      type: object
      description: |
        A body of work with the Members who do it: its own key, Workflows, Labels, Rank and
        default Workspace. Every Task belongs to exactly one Project.
      required: [id, key, name, color, auto_complete, acceptance, created_at]
      properties:
        id: {type: string, format: id}
        key:
          type: string
          description: The prefix of the Project's display keys, such as `MAIN` in `MAIN-42`.
        name: {type: string}
        color: {$ref: "#/components/schemas/ProjectColor"}
        default_workspace_id:
          type: string
          format: id
          description: |
            The Workspace a Task with no Parent filed in the Project names when it names none.
            Absent when the Project has none.
        auto_complete:
          type: boolean
          description: The `auto_complete` a Task filed in the Project takes when its filer does not say.
        acceptance:
          type: boolean
          description: The `acceptance` a Task filed in the Project takes when its filer does not say.
        created_at: {type: string, format: date-time}
    ProjectColor:
      type: integer
      minimum: 0
      maximum: 11
      description: |
        The colour of the Project's mark: one of twelve hues around the colour wheel, by index,
        0 red through 11 pink, 30° apart; the app sets how light and strong it reads in each
        theme. Stored with the Project, so it keeps it. A new Project takes the hue farthest from
        those its Organisation's Projects already have (the lowest index on a tie; past twelve,
        the hues the fewest Projects have), unless its creator names one.
    ProjectDetail:
      type: object
      required: [project, members]
      properties:
        project: {$ref: "#/components/schemas/Project"}
        members:
          type: array
          description: The Project's Members, by name.
          items: {$ref: "#/components/schemas/Member"}
    ProjectList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: {$ref: "#/components/schemas/Project"}
    NewWorkflow:
      type: string
      description: |
        The Workflows a new Project starts with. `default`: Implementation (Backlog · Plan ·
        Build · Review · Retro · Skill review, carrying `breakdown`, `engineer`, `review`,
        `retro`, `skill-review`) and Bug triage (Triage · Fix · Code review · Verify, carrying
        `triage`, `engineer`, `review`, `qa`; Triage's outcomes lead to Fix, to Done, or into
        Implementation's Build), with their Connectors; New Tasks start at Build. `empty`: one
        Workflow named Work, Backlog, a hold, → Done. `copy`: every Workflow of another Project,
        with its Steps and Connectors. `default` when not given.
      enum: [default, empty, copy]
      x-enum-varnames: [NewWorkflowDefault, NewWorkflowEmpty, NewWorkflowCopy]
    CreateProjectBody:
      type: object
      required: [key, name]
      properties:
        key:
          type: string
          pattern: "^[A-Z][A-Z0-9]{1,9}$"
        name: {type: string, minLength: 1, maxLength: 100}
        color: {$ref: "#/components/schemas/ProjectColor"}
        workflow: {$ref: "#/components/schemas/NewWorkflow"}
        copy_from:
          type: string
          description: With `workflow` `copy` only, which needs it. Project id or key whose Workflows are copied.
        members:
          type: array
          description: Member ids or names put in the Project with it. The creator is not, unless named.
          items: {type: string}
        default_workspace:
          type: string
          description: Workspace id or name.
        auto_complete:
          type: boolean
          description: Defaults to false.
        acceptance:
          type: boolean
          description: Defaults to false.
    UpdateProjectBody:
      type: object
      properties:
        name: {type: string, minLength: 1, maxLength: 100}
        color: {$ref: "#/components/schemas/ProjectColor"}
        default_workspace:
          type: string
          description: Workspace id or name; `""` clears the Project's default.
        auto_complete: {type: boolean}
        acceptance: {type: boolean}

    # ------------------------------------------------------------ workflows
    Workflows:
      type: object
      description: |
        A Project's Workflows, with every Step and Connector. The Steps are ordered by their
        Workflow's `position`, then their own; "the first Step" reads that order. Each
        Workflow's board shows its Steps in order, then Done.
      required: [project_id, workflows, steps, connectors]
      properties:
        project_id: {type: string, format: id}
        workflows:
          type: array
          description: The Workflows, by `position`.
          items: {$ref: "#/components/schemas/Workflow"}
        steps:
          type: array
          description: Every Step, by its Workflow's `position` then its own, each with what is happening at it now.
          items: {$ref: "#/components/schemas/WorkflowStep"}
        connectors:
          type: array
          description: Every Connector, by its Step's order, then its own `position`.
          items: {$ref: "#/components/schemas/Connector"}
    Workflow:
      type: object
      description: |
        A named set of Steps and the Connectors between them, drawn on a canvas and shown as the
        columns of its own board. A Project has one or more; a Connector may lead into a Step of
        another Workflow of the same Project, or into Done. A Task's Workflow is that of the Step
        it is at.
      required: [id, name, position]
      properties:
        id: {type: string, format: id}
        name:
          type: string
          description: Unique in its Project, ignoring case.
        position:
          type: integer
          format: int64
          description: Its place among the Project's Workflows, 1 first.
    Step:
      type: object
      description: |
        A place in a Workflow, carrying at most one Skill: a Task at it is taken by a Member with
        that Skill. A Step without a Skill is a hold: no one is offered a Task there, and a human
        moves it on. Whether a Task at it is waiting or being worked follows from its Claim.
      required: [id, workflow_id, name, position, x, y]
      properties:
        id: {type: string, format: id}
        workflow_id:
          type: string
          format: id
          description: The Workflow it belongs to.
        name:
          type: string
          description: Unique in its Project, ignoring case.
        skill_id:
          type: string
          format: id
          description: The Skill a Member needs to take a Task at the Step. Absent on a hold.
        position:
          type: integer
          format: int64
          description: Its place in its Workflow, 1 first.
        x:
          type: integer
          format: int64
          description: Where the canvas draws it, in pixels from the left.
        y:
          type: integer
          format: int64
          description: Where the canvas draws it, in pixels from the top.
    WorkflowStep:
      description: A Step with what is happening at it now.
      allOf:
        - {$ref: "#/components/schemas/Step"}
        - {$ref: "#/components/schemas/StepFacts"}
    StepFacts:
      type: object
      required: [tasks, working, takers]
      properties:
        tasks:
          type: integer
          description: The open Tasks at the Step.
        working:
          type: integer
          description: Those of them with a live Claim; also counted in `tasks`.
        takers:
          type: array
          description: |
            The active Members who could take a Task at the Step by its Skill: the Project's
            Members holding it, or for `skill-review` the Organisation's, by name. None on a hold;
            a Step with a Skill and no takers is one nobody can work.
          items: {$ref: "#/components/schemas/Taker"}
        median_ms:
          type: integer
          format: int64
          description: |
            The median time Tasks that left the Step in the last 30 days spent at it, by advance,
            move, Complete or drop. Absent when none left it.
    Taker:
      type: object
      description: A Member who holds a Step's Skill.
      required: [id, name, kind]
      properties:
        id: {type: string, format: id}
        name: {type: string}
        kind: {$ref: "#/components/schemas/MemberKind"}
    Connector:
      type: object
      description: |
        A named way out of a Step into another Step, of its Workflow or of another Workflow of the
        same Project, or into Done: the outcome its holder names when they advance the Task.
        Advancing into Done completes the Task; dropping needs no Connector.
      required: [id, from_step_id, name, position]
      properties:
        id: {type: string, format: id}
        from_step_id: {type: string, format: id}
        to_step_id:
          type: string
          format: id
          description: The Step it leads to. Absent when it leads into Done.
        name:
          type: string
          description: The outcome, such as `pass` or `needs changes`; unique among the Connectors out of its Step, ignoring case.
        position:
          type: integer
          format: int64
          description: Its place among the Connectors out of its Step, 1 first.
    SetWorkflowBody:
      type: object
      required: [workflows, steps, connectors]
      properties:
        workflows:
          type: array
          minItems: 1
          description: |
            Every Workflow of the Project, one at least. One already there carries its `id`; one
            without an `id` keeps the id of the Workflow with the same name, ignoring case, unless
            another Workflow of the body carries it, and any other is new. One left out is deleted
            with its Steps, whose open Tasks need `moves`.
          items: {$ref: "#/components/schemas/WorkflowInput"}
        steps:
          type: array
          description: |
            Every Step of the Project, in any of its Workflows. A Step already there carries its
            `id`; a new one has none. A Step left out is deleted.
          items: {$ref: "#/components/schemas/StepInput"}
        connectors:
          type: array
          description: Every Connector of the Project. One left out is deleted.
          items: {$ref: "#/components/schemas/ConnectorInput"}
        moves:
          type: object
          description: |
            Where the Tasks at a deleted Step go, the open ones and the ended ones that ended at
            it (`last_step_id`): the deleted Step's id to any Step of the body, by its id or its
            name in `steps`.
          additionalProperties: {type: string}
        skills:
          type: array
          description: Generic Skills to create before the Workflows are put in place, each published as version 1.
          items: {$ref: "#/components/schemas/WorkflowSkillInput"}
        joins:
          type: array
          description: Members, by id or name, to add to the Project; one in it already changes nothing.
          items: {type: string}
        grants:
          type: array
          description: Skills to give Members; one a Member has changes nothing.
          items: {$ref: "#/components/schemas/SkillGrantInput"}
        revokes:
          type: array
          description: Skills to take away from Members; one a Member lacks changes nothing. Claims held under it are not ended.
          items: {$ref: "#/components/schemas/SkillGrantInput"}
    WorkflowSkillInput:
      type: object
      required: [name, body]
      properties:
        name:
          type: string
          pattern: "^[a-z0-9][a-z0-9-]{0,62}$"
        body:
          type: string
          description: The Skill's text, published as version 1.
    SkillGrantInput:
      type: object
      required: [member, skill]
      properties:
        member:
          type: string
          description: The Member, by id or name.
        skill:
          type: string
          description: The Skill, by id or name; one in `skills` by its name.
    WorkflowInput:
      type: object
      required: [name]
      properties:
        id:
          type: string
          format: id
          description: |
            The id of a Workflow of the Project now; left out, the one with the same name keeps
            its id unless another Workflow of the body carries it.
        name: {type: string, minLength: 1, maxLength: 50}
        position:
          type: integer
          format: int64
          minimum: 0
          description: Its place among the Workflows; distinct, and the Project numbers them 1, 2, 3… in this order. Left out, or 0, it is the item's place in the list.
    StepInput:
      type: object
      required: [workflow, name]
      properties:
        id:
          type: string
          format: id
          description: The id of a Step of the Project now; left out for a new one.
        workflow:
          type: string
          description: The Workflow it belongs to, by its id or its name in `workflows`.
        name: {type: string, minLength: 1, maxLength: 50}
        skill:
          type: string
          description: Skill id or name the Step carries. Left out, the Step is a hold.
        position:
          type: integer
          format: int64
          minimum: 0
          description: The Step's place in its Workflow; distinct among that Workflow's Steps, numbered 1, 2, 3… in this order. Left out, or 0, it is the item's place in the list.
        x:
          type: integer
          format: int64
          description: Left out, a Step of the Project now keeps its place, and a new one is drawn at (position − 1) × 448 in its Workflow.
        y:
          type: integer
          format: int64
          description: Left out, a Step of the Project now keeps its place, and a new one is drawn at 0.
    ConnectorInput:
      type: object
      required: [from, name]
      properties:
        id:
          type: string
          format: id
          description: |
            The id of a Connector of the Project now. Left out, a Connector out of the same Step
            with the same name, ignoring case, keeps its id; any other is new.
        from:
          type: string
          description: The Step it leads out of, by its id or its name in `steps`.
        to:
          type: string
          description: The Step it leads to, by its id or its name in `steps`, in any Workflow of the body. Left out, it leads into Done.
        name: {type: string, minLength: 1, maxLength: 50}
        position:
          type: integer
          format: int64
          minimum: 0
          description: Its place among the Connectors out of its Step; distinct among them, and numbered 1, 2, 3… in this order. Left out, or 0, it is the item's place in the list.

    # ------------------------------------------------------------ labels
    Label:
      type: object
      description: |
        A named, coloured mark carried by any number of Tasks: a Project's own, or the
        Organisation's for every Project. Filters and Views read it; Darkory's rules never do.
      required: [id, name, color, created_at]
      properties:
        id: {type: string, format: id}
        project_id:
          type: string
          format: id
          description: The Project that defined it for itself. Absent for the Organisation's.
        name:
          type: string
          description: Unique among the Labels a Task of its Project can carry, ignoring case.
        color:
          type: string
          description: "`#rrggbb`."
        created_at: {type: string, format: date-time}
    LabelList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: {$ref: "#/components/schemas/Label"}
    CreateLabelBody:
      type: object
      required: [name, color]
      properties:
        name: {type: string, minLength: 1, maxLength: 50}
        color:
          type: string
          pattern: "^#[0-9a-fA-F]{6}$"
    UpdateLabelBody:
      type: object
      properties:
        name: {type: string, minLength: 1, maxLength: 50}
        color:
          type: string
          pattern: "^#[0-9a-fA-F]{6}$"

    # ------------------------------------------------------------ workspaces
    Workspace:
      type: object
      description: |
        A place a session works in, named on the Install. A `git` Workspace is a repository at
        `path` on the machine that runs the Install; a session works in a checkout of it on a
        branch named after its Task. In `pull_request` mode, work lands through pull requests
        instead of merges by the Runner.
      required: [id, name, kind, path, mode, default_branch, created_at]
      properties:
        id: {type: string, format: id}
        name:
          type: string
          description: Unique on the Install, ignoring case; it names the session's checkout directory.
        kind: {$ref: "#/components/schemas/WorkspaceKind"}
        path:
          type: string
          description: The repository's absolute path.
        mode: {$ref: "#/components/schemas/WorkspaceMode"}
        default_branch:
          type: string
          description: The branch work lands on, such as `main`.
        created_at: {type: string, format: date-time}
    WorkspaceKind:
      type: string
      description: The kind of place. Only `git` for now; more may be added within `/v1`.
      enum: [git]
      x-enum-varnames: [WorkspaceKindGit]
    WorkspaceMode:
      type: string
      description: |
        `plain`: the Runner merges branches itself. `pull_request`: it opens pull requests
        instead, and reads a merged pull request carrying a Task's key as that Task's branch
        having landed.
      enum: [plain, pull_request]
      x-enum-varnames: [WorkspaceModePlain, WorkspaceModePullRequest]
    WorkspaceList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: {$ref: "#/components/schemas/Workspace"}
    CreateWorkspaceBody:
      type: object
      required: [name, path]
      properties:
        name:
          type: string
          pattern: "^[A-Za-z0-9][A-Za-z0-9._-]{0,62}$"
        kind: {$ref: "#/components/schemas/WorkspaceKind"}
        path:
          type: string
          minLength: 1
          maxLength: 4096
          description: The repository's absolute path.
        mode: {$ref: "#/components/schemas/WorkspaceMode"}
        default_branch:
          type: string
          minLength: 1
          maxLength: 255
          description: Defaults to `main`.
    UpdateWorkspaceBody:
      type: object
      properties:
        name:
          type: string
          pattern: "^[A-Za-z0-9][A-Za-z0-9._-]{0,62}$"
        path: {type: string, minLength: 1, maxLength: 4096}
        mode: {$ref: "#/components/schemas/WorkspaceMode"}
        default_branch: {type: string, minLength: 1, maxLength: 255}

    # ------------------------------------------------------------ skills
    Skill:
      type: object
      required: [id, name, kind, builtin, current_version, created_at]
      properties:
        id: {type: string, format: id}
        name: {type: string}
        kind: {$ref: "#/components/schemas/SkillKind"}
        base_skill_id:
          type: string
          format: id
          description: The generic Skill a company Skill builds on.
        project_id:
          type: string
          format: id
          description: |
            The Project a company Skill belongs to; absent for a generic Skill and for a company
            Skill of the whole Organisation.
        builtin:
          type: boolean
          description: True for `breakdown`, `acceptance`, `retro` and `skill-review`, which Darkory relies on.
        current_version:
          type: integer
          format: int64
        created_at: {type: string, format: date-time}
    SkillKind:
      type: string
      enum: [generic, company]
    SkillVersion:
      type: object
      required: [skill_id, version, body, published_at]
      properties:
        skill_id: {type: string, format: id}
        version:
          type: integer
          format: int64
        body: {type: string}
        proposal_id:
          type: string
          format: id
          description: The proposal this version was published from. Absent for version 1.
        published_by:
          type: string
          format: id
          description: The Member who completed the review, or who created the Skill.
        published_at: {type: string, format: date-time}
    SkillDetail:
      type: object
      required: [skill, current]
      properties:
        skill: {$ref: "#/components/schemas/Skill"}
        current: {$ref: "#/components/schemas/SkillVersion"}
    SkillList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: {$ref: "#/components/schemas/Skill"}
    SkillVersionList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: {$ref: "#/components/schemas/SkillVersion"}
    CreateSkillBody:
      type: object
      required: [name, kind, body]
      properties:
        name:
          type: string
          pattern: "^[a-z0-9][a-z0-9-]{0,62}$"
        kind: {$ref: "#/components/schemas/SkillKind"}
        base_skill:
          type: string
          description: Required for a company Skill. Id or name of a generic Skill.
        project:
          type: string
          description: Id or key of the Project the Skill belongs to; only for a company Skill.
        body:
          type: string
          description: The Skill's text, published as version 1.
    UpdateSkillBody:
      type: object
      required: [project]
      properties:
        project:
          type: string
          description: Id or key of the Project the company Skill belongs to; `""` makes it the Organisation's.
    SkillProposal:
      type: object
      required: [id, skill_id, task_id, based_on_version, body, author_id, state, created_at]
      properties:
        id: {type: string, format: id}
        skill_id: {type: string, format: id}
        task_id: {type: string, format: id}
        based_on_version:
          type: integer
          format: int64
        body: {type: string}
        author_id: {type: string, format: id}
        state: {$ref: "#/components/schemas/ProposalState"}
        published_version:
          type: integer
          format: int64
          description: The version publishing it made. Absent unless `state` is `published`.
        created_at: {type: string, format: date-time}
        decided_at:
          type: string
          format: date-time
          description: When it was published or superseded.
    ProposalState:
      type: string
      description: |
        `pending`: waiting for review. `published`: a review published it. `superseded`: it will
        not be published, because a newer proposal for the same Skill replaced it on its Task, or
        its Task ended without publishing it.
      enum: [pending, published, superseded]
    ProposeSkillVersionBody:
      type: object
      required: [skill, based_on_version, body]
      properties:
        skill:
          type: string
          description: Id or name of a company Skill.
        based_on_version:
          type: integer
          format: int64
        body: {type: string}

    # ------------------------------------------------------------ tasks
    Task:
      type: object
      description: |
        The unit of work in a Project. A Task with no Subtasks is at one Step of one of its
        Project's Workflows, where it is claimed, worked and advanced, or aimed at a Member by name
        and waiting with them. A Task with Subtasks is a Parent: at no Step, never claimed, and
        neither blocking nor blocked. Waiting, being worked and blocked follow from the Claim and
        Blocking and are not stored.
      required: [id, key, project_id, kind, title, description, state, owner_id, breakdown, auto_complete, acceptance, blocked, waiting_since, created_at]
      properties:
        id: {type: string, format: id}
        key:
          type: string
          description: Display key, such as `MAIN-42`; Tasks and Subtasks share the Project's sequence.
        project_id: {type: string, format: id}
        parent_id:
          type: string
          format: id
          description: The Parent of a Subtask. Absent on a Task with no Parent.
        kind: {$ref: "#/components/schemas/TaskKind"}
        title: {type: string}
        description: {type: string}
        state: {$ref: "#/components/schemas/TaskState"}
        owner_id:
          type: string
          format: id
          description: The Member with authority over the Task and its Subtasks. A Subtask's is its Parent's.
        rank:
          type: integer
          format: int64
          description: |
            Position in the Project's Rank, 1 first; an ended Task keeps its place. Absent on a
            Subtask, which sorts by its Parent's.
        step_id:
          type: string
          format: id
          description: |
            The Step the Task is at. Absent on a Parent, on a Task aimed at a Member, and on an
            ended Task.
        step_since:
          type: string
          format: date-time
          description: When the Task reached its Step. Absent when `step_id` is.
        workflow_id:
          type: string
          format: id
          description: |
            The Workflow the Task is listed in: that of the Step it is at or ended at; for a
            Parent, of its least-advanced open Subtask, or once ended of the Subtask that ended
            last at or before it; for a Task aimed at a Member, of the Task it blocks, else of its
            Parent. Absent when none gives one.
        last_step_id:
          type: string
          format: id
          description: |
            The Step an ended Task ended at; `moves` re-points it when that Step is deleted.
            Absent while it is open, on a Task that ended at no Step (a Parent, a Task aimed at a
            Member), and when that Step was since deleted with no `moves` for it.
        skill_id:
          type: string
          format: id
          description: |
            The Skill its Step carries: the Skill a Member needs to take it. Absent at a hold and
            wherever `step_id` is.
        aimed_at_id:
          type: string
          format: id
          description: The Member the Task is aimed at by name, who may take it at no Step.
        labels:
          type: array
          description: The ids of the Labels it carries, by name. Absent when it carries none.
          items: {type: string, format: id}
        breakdown:
          type: boolean
          description: Filed with Break down on; its Breakdown Subtask was filed with it.
        auto_complete:
          type: boolean
          description: |
            A Parent completes itself when its last open Subtask ends done and no Acceptance is
            due. Always false on a Subtask.
        acceptance:
          type: boolean
          description: |
            Once every Subtask of a Parent has ended and the last to end ended done, Darkory files
            an Acceptance under it, when its Project has a Step carrying `acceptance`. Always
            false on a Subtask.
        from_retrospective_task_id:
          type: string
          format: id
          description: The Retrospective that filed this Task.
        claim:
          $ref: "#/components/schemas/Claim"
        blocked:
          type: boolean
          description: True while any Task blocking this one is open. Always false on a Parent.
        open_blockers:
          type: array
          description: The open Tasks blocking this one. Absent when none is open.
          items: {$ref: "#/components/schemas/TaskBrief"}
        workspace_ids:
          type: array
          description: The Workspaces the Task names, in the order named. Absent when it names none.
          items: {type: string, format: id}
        pull_request: {$ref: "#/components/schemas/PullRequest"}
        filed_by:
          type: string
          format: id
          description: |
            The Member who filed it. Absent on the Subtasks Darkory files itself: a Breakdown, an
            Acceptance, a Retrospective.
        waiting_since:
          type: string
          format: date-time
          description: When the Task was filed or last reached a Step; `next` gives a tie to the Task that has waited longest.
        created_at: {type: string, format: date-time}
        ended_at:
          type: string
          format: date-time
          description: When it ended, done or dropped.
        subtask_counts: {$ref: "#/components/schemas/SubtaskCounts"}
    PullRequest:
      type: object
      description: |
        The pull request a Task's branch lands through, in a Workspace in `pull_request` mode, as the
        Runner read it on GitHub: written when it finds one open for the branch and again when it is
        merged. Absent until the Runner has seen one.
      required: [number, url, state]
      properties:
        number: {type: integer, format: int64}
        url: {type: string}
        state: {$ref: "#/components/schemas/PullRequestState"}
    PullRequestState:
      type: string
      enum: [open, merged]
      x-enum-varnames: [PullRequestOpen, PullRequestMerged]
    SetTaskPullRequestBody:
      type: object
      required: [number, url, state]
      properties:
        number: {type: integer, format: int64, minimum: 1}
        url:
          type: string
          minLength: 1
          maxLength: 2000
          description: |
            The pull request's own `https` address, `https://<host>/<owner>/<repo>/pull/<number>`,
            on `github.com` or on the host `GH_HOST` names.
        state: {$ref: "#/components/schemas/PullRequestState"}
    SubtaskCounts:
      type: object
      description: How many of a Parent's Subtasks are in each state. Absent on a Task with no Subtasks.
      required: [open, working, done, dropped]
      properties:
        open:
          type: integer
          description: Open Subtasks, held or not.
        working:
          type: integer
          description: Open Subtasks with a live Claim; also counted in `open`.
        done: {type: integer}
        dropped: {type: integer}
    TaskBrief:
      type: object
      description: A Task named by its id, display key and title.
      required: [id, key, title]
      properties:
        id: {type: string, format: id}
        key:
          type: string
          description: Display key, such as `MAIN-42`.
        title: {type: string}
    TaskState:
      type: string
      description: Claimed, lapsed, waiting and blocked are not states; they follow from the Task's Claim and Blocking.
      enum: [open, done, dropped]
    TaskKind:
      type: string
      description: |
        `work`: filed by a Member, a question or Escalation included. `breakdown`, `acceptance`
        and `retrospective`: the Subtasks Darkory files about a Parent as a whole, at the Steps
        carrying those Skills.
      enum: [work, breakdown, acceptance, retrospective]
    Claim:
      type: object
      required: [id, task_id, holder_id, session_id, started_at]
      properties:
        id: {type: string, format: id}
        task_id: {type: string, format: id}
        holder_id: {type: string, format: id}
        session_id:
          type: string
          format: id
          description: The Session that made the Claim.
        skill_id:
          type: string
          format: id
          description: The Skill of the Step the Task was taken at. Absent for a Task aimed at a Member.
        skill_version:
          type: integer
          format: int64
          description: The version of the Skill the Claim was worked under.
        model_label:
          type: string
          description: The AI model the holder said it used. Stored, never interpreted.
        heartbeat_timeout_seconds:
          type: integer
          description: Absent when the Claim never lapses on its own.
        started_at: {type: string, format: date-time}
        expires_at:
          type: string
          format: date-time
          description: When the Claim lapses unless a Heartbeat arrives.
        ended_at: {type: string, format: date-time}
        how_ended: {$ref: "#/components/schemas/ClaimEnd"}
    ClaimEnd:
      type: string
      description: |
        How a Claim ended. `advanced`: its holder advanced the Task to another Step. `split`: its
        holder filed a Subtask under the Task, which became a Parent. `completed`: the Task ended
        done. `taken_back`: someone on the holder's Reporting line or the Task's Owner took it
        back, or moved the Task. The rest are named for what ended it.
      enum: [released, advanced, split, completed, lapsed, taken_back, dropped, token_revoked, session_closed, member_deactivated]
    TaskDetail:
      type: object
      required: [task, subtasks, connectors, labels, workspaces, claims, notes, evidence, blockers, blocking, observations, proposals]
      description: The Task with its record.
      properties:
        task: {$ref: "#/components/schemas/Task"}
        parent:
          $ref: "#/components/schemas/TaskBrief"
        subtasks:
          type: array
          description: A Parent's Subtasks, in the order they were filed; empty on a Task with none.
          items: {$ref: "#/components/schemas/Task"}
        step:
          $ref: "#/components/schemas/Step"
        connectors:
          type: array
          description: |
            The Connectors out of the Task's Step, in order: the outcomes its holder may advance
            it along. Empty when it is at no Step.
          items: {$ref: "#/components/schemas/Connector"}
        labels:
          type: array
          description: The Labels it carries, by name.
          items: {$ref: "#/components/schemas/Label"}
        workspaces:
          type: array
          description: The Workspaces the Task names, in the order of `task.workspace_ids`.
          items: {$ref: "#/components/schemas/Workspace"}
        claims:
          type: array
          description: Every Claim on the Task, oldest first.
          items: {$ref: "#/components/schemas/Claim"}
        notes:
          type: array
          description: The running log, oldest first.
          items: {$ref: "#/components/schemas/Note"}
        evidence:
          type: array
          items: {$ref: "#/components/schemas/Evidence"}
        blockers:
          type: array
          description: The Tasks blocking this one.
          items: {$ref: "#/components/schemas/Task"}
        blocking:
          type: array
          description: The Tasks this one blocks.
          items: {$ref: "#/components/schemas/Task"}
        observations:
          type: array
          description: The Observations recorded on the Task itself, oldest first.
          items: {$ref: "#/components/schemas/Observation"}
        proposals:
          type: array
          description: |
            The latest Skill proposal written on the Task for each Skill, pending or decided,
            oldest first. A Retrospective carries at most one pending proposal per Skill.
          items: {$ref: "#/components/schemas/SkillProposal"}
    TaskList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: {$ref: "#/components/schemas/Task"}
        next_cursor:
          type: string
          description: Pass as `cursor` for the next page. Absent on the last page.
    FileTaskBody:
      type: object
      required: [title]
      properties:
        project:
          type: string
          description: Project id or key. May be left out when `parent` or `blocks` is given.
        title: {type: string, minLength: 1, maxLength: 200}
        description: {type: string}
        parent:
          type: string
          description: Id or display key of the Task to file a Subtask under.
        owner:
          type: string
          description: Member id or name. Defaults to the caller; a Subtask's is its Parent's and cannot be named.
        step:
          type: string
          description: |
            Step id or name in any Workflow of the Project to start at. Defaults to the first Step,
            by its Workflows' order then their Steps', carrying a Skill other than `breakdown`,
            `acceptance`, `retro` and `skill-review` (Build in a `default` Project); failing that,
            the first Step carrying any Skill; failing that, the first Step.
        breakdown:
          type: boolean
          description: File the Task with its Breakdown Subtask, making it a Parent from its first moment.
        auto_complete:
          type: boolean
          description: Defaults to the Project's. Not on a Subtask.
        acceptance:
          type: boolean
          description: Defaults to the Project's. Not on a Subtask.
        labels:
          type: array
          description: Label ids or names, each the Project's own or the Organisation's.
          items: {type: string}
        workspaces:
          type: array
          description: |
            Workspace ids or names the Task names: where a session works it. Left out, a Task with
            no Parent names its Project's default Workspace, or none when the Project has none,
            and a Subtask names its Parent's Workspaces; an empty list names none.
          items: {type: string}
        aim:
          type: string
          description: Member id or name the Task is aimed at by name; it then waits with them at no Step.
        blocks:
          type: string
          description: Id or display key of a Task the new one blocks (a question or Escalation).
        blocked_by:
          type: array
          description: |
            Ids or display keys of Tasks that block the new one from its first moment, in the same
            write, so it is never takeable before they end. Each a worked Task, never a Parent;
            not with `breakdown`, since a Parent is never blocked. Refused `cycle` when one is the
            Task the new one blocks, or blocked by it.
          items: {type: string}
        note:
          type: string
          description: |
            Only when filing a Subtask under a Task the caller holds: added to the Parent's Notes
            in the same write, as the Claim the filing ends hands its context on.
        from_retrospective:
          type: string
          description: Id or display key of the Retrospective filing this Task.
    ClaimTaskBody:
      type: object
      properties:
        heartbeat_timeout_seconds:
          type: integer
          minimum: 0
          maximum: 86400
          description: Seconds without a Heartbeat before the Claim lapses. 0 for none. Defaults to the token's default.
        model_label:
          type: string
          maxLength: 200
    NextTaskBody:
      type: object
      properties:
        wait_seconds:
          type: integer
          minimum: 0
          maximum: 60
          description: How long to wait for a takeable Task. Defaults to 30; 0 returns at once.
        heartbeat_timeout_seconds:
          type: integer
          minimum: 0
          maximum: 86400
          description: Seconds without a Heartbeat before the Claim lapses. 0 for none. Defaults to the token's default.
        model_label:
          type: string
          maxLength: 200
    HeartbeatReply:
      type: object
      required: [status]
      properties:
        status: {$ref: "#/components/schemas/HeartbeatStatus"}
        expires_at:
          type: string
          format: date-time
          description: The Claim's new expiry, when `status` is `ok`.
    HeartbeatStatus:
      type: string
      description: |
        `ok`: the Claim is extended. `lapsed`: it ran out before this Heartbeat. `taken_back`:
        someone on the Reporting line or the Task's Owner took it back, or moved the Task.
        `ended`: it ended some other way (released, advanced, split, completed, dropped, revoked).
      enum: [ok, lapsed, taken_back, ended]
    ReleaseTaskBody:
      type: object
      properties:
        note:
          type: string
          description: Added to the Task's Notes in the same write.
    AdvanceTaskBody:
      type: object
      properties:
        outcome:
          type: string
          description: |
            The name of a Connector out of the Task's Step, ignoring case. May be left out when
            the Step has exactly one.
        note:
          type: string
          description: Added to the Task's Notes in the same write, before it moves on.
    MoveTaskBody:
      type: object
      required: [step]
      properties:
        step:
          type: string
          description: Step id or name in any Workflow of the Task's Project.
        note:
          type: string
          description: Added to the Task's Notes in the same write.
    CompleteTaskBody:
      type: object
      properties:
        note:
          type: string
          description: Added to the Task's Notes in the same write.
    DropTaskBody:
      type: object
      properties:
        reason: {type: string}
    TakeBackTaskBody:
      type: object
      properties:
        reason: {type: string}
    PassOwnershipBody:
      type: object
      required: [owner]
      properties:
        owner:
          type: string
          description: Member id or name.
    RankTaskBody:
      type: object
      required: [position]
      properties:
        position:
          type: integer
          format: int64
          minimum: 1
    SetTaskLabelsBody:
      type: object
      required: [labels]
      properties:
        labels:
          type: array
          description: Label ids or names, each the Task's Project's own or the Organisation's; the whole set it carries.
          items: {type: string}

    # ------------------------------------------------------------ Notes, Observations, Evidence
    Note:
      type: object
      required: [id, task_id, author_id, body, created_at]
      properties:
        id: {type: string, format: id}
        task_id: {type: string, format: id}
        author_id: {type: string, format: id}
        skill_id:
          type: string
          format: id
          description: The Skill the author was working under.
        body: {type: string}
        created_at: {type: string, format: date-time}
    AddNoteBody:
      type: object
      required: [body]
      properties:
        body: {type: string, minLength: 1}
    Observation:
      type: object
      description: |
        An entry on a Task, marked worked or didn't work, recording who wrote it and the Skill
        they worked under. It feeds the Retrospective of the Task's Parent, which marks it
        reviewed.
      required: [id, task_id, author_id, outcome, body, created_at]
      properties:
        id: {type: string, format: id}
        task_id: {type: string, format: id}
        author_id: {type: string, format: id}
        skill_id:
          type: string
          format: id
          description: The Skill the author was working under.
        outcome: {$ref: "#/components/schemas/ObservationOutcome"}
        body: {type: string}
        created_at: {type: string, format: date-time}
        reviewed_by_task_id:
          type: string
          format: id
          description: The Retrospective that reviewed it. Absent until reviewed.
        reviewed_at: {type: string, format: date-time}
    ObservationOutcome:
      type: string
      enum: [worked, didnt_work]
    ObservationList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: {$ref: "#/components/schemas/Observation"}
    ObserveBody:
      type: object
      required: [outcome, body]
      properties:
        outcome: {$ref: "#/components/schemas/ObservationOutcome"}
        body: {type: string, minLength: 1}
    Evidence:
      type: object
      description: |
        A report, screenshot or log attached to a Task, recording who attached it; Evidence
        about a Parent as a whole is attached to the Parent.
      required: [id, task_id, kind, filename, content_type, size, sha256, attached_by, created_at]
      properties:
        id: {type: string, format: id}
        task_id: {type: string, format: id}
        kind: {$ref: "#/components/schemas/EvidenceKind"}
        filename: {type: string}
        content_type: {type: string}
        size:
          type: integer
          format: int64
        sha256: {type: string}
        attached_by: {type: string, format: id}
        created_at: {type: string, format: date-time}
    EvidenceKind:
      type: string
      description: |
        `evidence`: attached by the Task's holder or a Member about the work. `log`: a Shift's
        terminal log, attached by the Runner when the Shift ends; it belongs to the Claim the Shift
        worked under and is not counted or listed as the Task's Evidence.
      enum: [evidence, log]
      x-enum-varnames: [EvidenceKindEvidence, EvidenceKindLog]

    # ------------------------------------------------------------ files
    File:
      type: object
      description: |
        Bytes the Organisation keeps, referenced by id, such as a Member's avatar. Its bytes are
        at `/v1/files/{id}/content`.
      required: [id, name, content_type, size, sha256, purpose, created_by, created_at]
      properties:
        id: {type: string, format: id}
        name: {type: string}
        content_type:
          type: string
          description: The type the server found by reading the bytes.
        size:
          type: integer
          format: int64
        sha256: {type: string}
        purpose: {$ref: "#/components/schemas/FilePurpose"}
        created_by:
          type: string
          format: id
          description: The Member who uploaded it.
        created_at: {type: string, format: date-time}
    FilePurpose:
      type: string
      description: |
        What a file was uploaded as. An `avatar` was checked to be an image and made a PNG at
        most 256 pixels square, and only such a file can be set as a Member's avatar.
      enum: [general, avatar]
      x-enum-varnames: [FilePurposeGeneral, FilePurposeAvatar]

    # ------------------------------------------------------------ activity
    Activity:
      type: object
      required: [seq, at, kind, subject_type, subject_id, payload]
      properties:
        seq:
          type: integer
          format: int64
          description: Per-Organisation sequence number, in commit order.
        at: {type: string, format: date-time}
        actor_id:
          type: string
          format: id
          description: The Member who acted. Absent when Darkory acted, as when recording a lapse.
        kind: {$ref: "#/components/schemas/ActivityKind"}
        subject_type: {$ref: "#/components/schemas/SubjectType"}
        subject_id:
          type: string
          format: id
          description: The id of the record the entry is about, of `subject_type`.
        payload:
          type: object
          additionalProperties: true
    ActivityKind:
      type: string
      description: |
        What happened. The part before the dot is the `subject_type`. New kinds may be added
        within `/v1`; a client should skip a kind it does not know.

        The entries that trace a Task's path through its Project's Workflows carry Step ids in their
        payloads: `task.filed` its `step_id` (absent for a Task aimed at a Member or filed as a
        Parent), with `parent_id`, `aimed_at_id`, `blocks`, `labels` and, for a Task with no Parent,
        `auto_complete` and `acceptance`, and `breakdown` when it was filed with Break down on;
        `task.advanced` `from` and `to` (Step ids) and `outcome`; `task.moved` `to`, and `from` when
        it was at a Step; `task.became_parent`, `task.completed` and `task.dropped` `from` when it
        was at a Step. Those that leave a Step also carry `since`, when the Task reached it, in
        milliseconds since the Unix epoch. The Subtasks Darkory files itself (a Breakdown, an
        Acceptance, a Retrospective) are recorded with no actor. `task.nudged` (no actor) says the
        Runner nudged the agent holding the Task, whose turn had ended with no decision: `claim_id`,
        `holder_id` and `nudge`, 1 or 2. `task.evidence_attached` carries `evidence_id`,
        `filename`, `size` and `kind`. `task.pull_request_opened` and `task.pull_request_merged` carry the
        pull request's `number` and `url`. `skill.created` carries `name`, `kind`, `builtin` and
        `project_id`, null for a Skill of the whole Organisation; `skill.changed` carries
        `project_id`, null when the Skill became the Organisation's.

        `workflow.changed` carries the Project's Workflows as they now stand: `workflows`
        (`id`, `name`, `position` each), `steps` (`id`, `workflow_id`, `name`, `skill_id`,
        `position` each) and `connectors` (`id`, `from`, `to`, `name` each), with `moves` and
        `tasks_moved` when open Tasks were moved off deleted Steps.
      enum:
        - task.filed
        - task.claimed
        - task.lapsed
        - task.nudged
        - task.released
        - task.advanced
        - task.moved
        - task.completed
        - task.dropped
        - task.taken_back
        - task.claim_ended
        - task.split
        - task.became_parent
        - task.note_added
        - task.observed
        - task.blocker_added
        - task.blocker_removed
        - task.evidence_attached
        - task.skill_proposed
        - task.ranked
        - task.owner_passed
        - task.labels_set
        - task.pull_request_opened
        - task.pull_request_merged
        - workflow.changed
        - label.created
        - label.changed
        - label.deleted
        - skill.created
        - skill.version_published
        - skill.changed
        - member.created
        - member.updated
        - member.manager_set
        - member.manager_cleared
        - member.skill_granted
        - member.skill_revoked
        - member.deactivated
        - member.reactivated
        - member.agent_changed
        - project.created
        - project.changed
        - project.member_added
        - project.member_removed
        - workspace.added
        - workspace.changed
        - workspace.removed
        - token.issued
        - token.revoked
        - session.closed
        - login_link.issued
        - login_link.redeemed
        - file.uploaded
        - file.deleted
    SubjectType:
      type: string
      description: |
        The kind of record an Activity entry is about. `workflow` is a Project's Workflows as a
        whole, every Workflow, Step and Connector; its `subject_id` is the Project's id.
      enum: [task, workflow, label, skill, member, project, token, session, login_link, workspace, file]
    ActivityPage:
      type: object
      required: [items, last_seq]
      properties:
        items:
          type: array
          items: {$ref: "#/components/schemas/Activity"}
        last_seq:
          type: integer
          format: int64
          description: The sequence number of the last entry returned, or `after` when none were. Pass it as `after` next time.
        first_seq:
          type: integer
          format: int64
          description: The sequence number of the first entry returned. Absent when none were. Pass it as `before` to read the page before.

    # ------------------------------------------------------------ runner
    RunnerSession:
      type: object
      description: |
        A Shift the Runner runs for a Task it claimed as that agent. Not part of the
        record: it lives as long as the Shift.
      required: [task_id, member_id, session_id, host, started_at, state, state_since, log_path]
      properties:
        task_id: {type: string, format: id}
        member_id:
          type: string
          format: id
          description: The agent whose Shift it is.
        session_id:
          type: string
          format: id
          description: The Darkory Session the Runner holds the Claim through, which is also the agent's own Session id.
        host:
          type: string
          description: The machine the Shift runs on.
        tmux:
          type: string
          description: The tmux session's name, such as `dk-MAIN-12`. Absent when the Shift runs without tmux and cannot be joined.
        started_at: {type: string, format: date-time}
        state: {$ref: "#/components/schemas/RunnerSessionState"}
        state_since:
          type: string
          format: date-time
          description: When the Shift entered its current state; `started_at` until it first changed.
        log_path:
          type: string
          description: Where the Shift's terminal is logged on that machine; attached to the Task as Evidence when it ends.
    RunnerSessionState:
      type: string
      description: |
        `running`: working, its progress moving, the Runner sending Heartbeats. `waiting`: its
        turn ended with the Task still held and no decision, and the Runner nudges it to end the
        Task (a nudge pending or sent), then releases it; or the agent's screen shows a Claude Code
        dialog the Runner leaves to a person, who answers it by joining the Shift. `stalled`:
        its progress has not moved for the Runner's stale window, so the Runner sends no more
        Heartbeats and the Claim lapses unless it moves again. `ending`: the Claim has ended and
        the Shift is closing.
      enum: [running, waiting, stalled, ending]
      x-enum-varnames: [RunnerSessionRunning, RunnerSessionWaiting, RunnerSessionStalled, RunnerSessionEnding]
    RecordNudgeBody:
      type: object
      required: [nudge]
      properties:
        nudge:
          type: integer
          minimum: 1
          maximum: 2
          description: Which of the Runner's two nudges it was.
    RunnerSessionList:
      type: object
      required: [items, runner]
      properties:
        items:
          type: array
          items: {$ref: "#/components/schemas/RunnerSession"}
        runner:
          type: boolean
          description: Whether a Runner is attached to this server; false with no Shifts when none is.

    # ------------------------------------------------------------ views
    ViewEntity:
      type: string
      description: |
        The list a View is of; its filters are that list's `filter` tokens. Only `tasks` for now;
        more may be added within `/v1`.
      enum: [tasks]
      x-enum-varnames: [ViewEntityTasks]
    ProjectSeen:
      type: object
      description: |
        How far a Member has seen a Project's Activity. Both fields are null until the Member
        first sets it.
      required: [seq, at]
      properties:
        seq:
          type: integer
          format: int64
          nullable: true
          description: The `seq` of the newest Activity entry the Member has seen in the Project.
        at:
          type: string
          format: date-time
          nullable: true
          description: When the Member last moved it forward.
    SetProjectSeenBody:
      type: object
      required: [seq]
      properties:
        seq:
          type: integer
          format: int64
          minimum: 0
          description: |
            The `seq` of the newest Activity entry the caller has seen in the Project; 0 when
            there is none yet.
    View:
      type: object
      description: |
        A saved set of filters, sort and display for a list, kept by one Member for themselves.
      required: [id, entity, name, filters, created_at, updated_at]
      properties:
        id: {type: string, format: id}
        entity: {$ref: "#/components/schemas/ViewEntity"}
        project_id:
          type: string
          format: id
          description: The Project whose list it is; absent for a list across Projects.
        name: {type: string}
        filters:
          type: array
          description: The list's `filter` tokens, in the order saved.
          items: {type: string}
        sort:
          type: string
          description: How the list is sorted, as the client wrote it; the server does not read it.
        display:
          type: object
          additionalProperties: true
          description: How the list is shown, as the client wrote it; the server does not read it.
        created_at: {type: string, format: date-time}
        updated_at: {type: string, format: date-time}
    ViewList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: {$ref: "#/components/schemas/View"}
    CreateViewBody:
      type: object
      required: [entity, name]
      properties:
        entity: {$ref: "#/components/schemas/ViewEntity"}
        project:
          type: string
          description: The Project whose list it is, by id or key; omitted for a list across Projects.
        name: {type: string, minLength: 1, maxLength: 100}
        filters:
          type: array
          maxItems: 50
          description: The list's `filter` tokens; none when omitted.
          items: {type: string, minLength: 1}
        sort: {type: string, maxLength: 200}
        display:
          type: object
          additionalProperties: true
          description: At most 16 KiB as JSON.
    UpdateViewBody:
      type: object
      properties:
        name: {type: string, minLength: 1, maxLength: 100}
        filters:
          type: array
          maxItems: 50
          items: {type: string, minLength: 1}
        sort:
          type: string
          maxLength: 200
          description: '`""` clears it.'
        display:
          type: object
          additionalProperties: true
          description: At most 16 KiB as JSON; replaces the whole object.
